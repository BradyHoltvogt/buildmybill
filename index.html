// Every signed-in member sees these; owner-only areas are admin.
const ALWAYS_VISIBLE = ["dashboard", "profile"];
const OWNER_ONLY = ["team", "settings", "subscriptions"];
// Live employee location — not owner-employee-grantable like other sections;
// only owners and managers ever see it, full stop.
const MANAGER_PLUS_ONLY = ["crew-locations", "shift-requests"];
// Nav items an owner can grant to employees (everything not always/owner-only).
const GRANTABLE = NAV.map(n => n.id).filter(id => !ALWAYS_VISIBLE.includes(id) && !OWNER_ONLY.includes(id) && !MANAGER_PLUS_ONLY.includes(id));

function canAccess(navId, user) {
  if (!user) return false;
  if (!moduleEnabled(navId)) return false;          // switched off for this company
  if (user.isOwner) return true;                    // owner sees everything
  if (ALWAYS_VISIBLE.includes(navId)) return true;
  if (OWNER_ONLY.includes(navId)) return false;
  if (MANAGER_PLUS_ONLY.includes(navId)) return user.role === "Manager";
  return !!(user.permissions && user.permissions[navId]);
}

/* ═══ Quick Command ═════════════════════════════════════════════════════════
   Type — or say — what you want done ("invoice Acme $2,500 for gravel
   hauling", "log 6 hours on the Miller driveway", "received 40 tons of sand")
   and the app performs the same action the manual form would have.

   How it works: a plain pattern matcher that runs entirely on the device. Each
   entry in QC_ACTIONS owns the phrasings it recognizes, pulls the details out
   of the sentence, and then calls exactly the same db/write helpers the app's
   own forms call — so a command can never do something a person couldn't do by
   hand, and every record lands in the same shape. Nothing is sent anywhere:
   no external service, no account, no key to manage, and it works offline.

   Everything it pulled out of the sentence is shown filled in and editable
   before it's saved, because a guess about someone's money or hours should be
   correctable in one tap rather than undone afterwards.
   ═══════════════════════════════════════════════════════════════════════════ */

const QC_HISTORY_KEY = "bmb_qc_history";
const QC_Speech = window.SpeechRecognition || window.webkitSpeechRecognition || null;

const qcNorm = s => String(s == null ? "" : s)
  .replace(/[‘’]/g, "'").replace(/[“”]/g, '"')
  .replace(/\s+/g, " ").trim().toLowerCase();

// Title-case a name we had to invent from free text ("acme corp" → "Acme Corp").
// A name matched against an existing record keeps its stored spelling instead.
const qcTitle = s => String(s || "").replace(/(^|[\s\-/&(])([a-z])/g, (_m, a, b) => a + b.toUpperCase());

/* ── Pulling values out of a sentence ─────────────────────────────────────── */

const QC_DOW = ["sunday", "monday", "tuesday", "wednesday", "thursday", "friday", "saturday"];
const QC_MON = ["january", "february", "march", "april", "may", "june", "july", "august", "september", "october", "november", "december"];
const QC_WORD_NUM = { a: 1, an: 1, one: 1, two: 2, three: 3, four: 4, five: 5, six: 6, seven: 7, eight: 8, nine: 9, ten: 10, eleven: 11, twelve: 12 };

function qcShiftDays(n) { const d = new Date(); d.setDate(d.getDate() + Number(n)); return dateStr(d); }

// Any date a person would actually type or say. Returns "" when there isn't one.
function qcDate(text) {
  const t = qcNorm(text);
  let m = t.match(/\b(\d{4})-(\d{1,2})-(\d{1,2})\b/);
  if (m) return dateStr(new Date(+m[1], +m[2] - 1, +m[3]));
  if (/\b(today|tonight|this morning|this afternoon|this evening|right now|just now)\b/.test(t)) return today();
  if (/\byesterday\b/.test(t)) return qcShiftDays(-1);
  if (/\btomorrow\b/.test(t)) return qcShiftDays(1);
  m = t.match(/\bin (\d{1,3}) days?\b/); if (m) return qcShiftDays(+m[1]);
  m = t.match(/\bin (\d{1,2}) weeks?\b/); if (m) return qcShiftDays(+m[1] * 7);
  m = t.match(/\b(\d{1,3}) days? ago\b/); if (m) return qcShiftDays(-m[1]);
  m = t.match(/\b(\d{1,2}) weeks? ago\b/); if (m) return qcShiftDays(-m[1] * 7);

  const mons = QC_MON.map(x => x.slice(0, 3)).join("|");
  m = t.match(new RegExp("\\b(" + mons + ")[a-z]*\\.? (\\d{1,2})(?:st|nd|rd|th)?(?:,? (\\d{4}))?\\b"));
  if (m) return dateStr(new Date(m[3] ? +m[3] : new Date().getFullYear(), QC_MON.findIndex(x => x.startsWith(m[1])), +m[2]));
  m = t.match(new RegExp("\\b(\\d{1,2})(?:st|nd|rd|th)? (?:of )?(" + mons + ")[a-z]*\\.?(?:,? (\\d{4}))?\\b"));
  if (m) return dateStr(new Date(m[3] ? +m[3] : new Date().getFullYear(), QC_MON.findIndex(x => x.startsWith(m[2])), +m[1]));

  m = t.match(/\b(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\b/);
  if (m) { let y = m[3] ? +m[3] : new Date().getFullYear(); if (y < 100) y += 2000; return dateStr(new Date(y, +m[1] - 1, +m[2])); }

  m = t.match(new RegExp("\\b(next|last|this|coming|on)?\\s?(" + QC_DOW.join("|") + ")\\b"));
  if (m) {
    const d = new Date();
    let diff = QC_DOW.indexOf(m[2]) - d.getDay();
    if (m[1] === "last") { if (diff >= 0) diff -= 7; }
    else if (diff <= 0) diff += 7;
    d.setDate(d.getDate() + diff);
    return dateStr(d);
  }
  return "";
}

function qcTo24(h, min, ap) {
  h = +h; min = min ? +min : 0;
  if (ap === "pm" && h < 12) h += 12;
  if (ap === "am" && h === 12) h = 0;
  return String(h).padStart(2, "0") + ":" + String(min).padStart(2, "0");
}

// "from 8 to 4:30", "7am-3pm", "between 6 and 2" → { start:"08:00", end:"16:30" }.
// People almost always leave am/pm off, so assume a normal workday: a start of
// 5–11 is morning, and the end is read whichever way lands after the start.
function qcRange(text) {
  const t = qcNorm(text);
  const m = t.match(/\b(?:from |between )?(\d{1,2})(?::(\d{2}))?\s*(am|pm)?\s*(?:-|–|—|to|until|til|till|thru|through|and)\s*(\d{1,2})(?::(\d{2}))?\s*(am|pm)?/);
  if (!m) return null;
  const h1 = +m[1], h2 = +m[4];
  if (h1 > 23 || h2 > 23) return null;
  const start = qcTo24(h1, m[2], m[3] || (h1 >= 5 && h1 <= 11 ? "am" : "pm"));
  let end;
  if (m[6]) end = qcTo24(h2, m[5], m[6]);
  else {
    const pm = qcTo24(h2, m[5], "pm"), am = qcTo24(h2, m[5], "am");
    end = pm > start ? pm : (am > start ? am : pm);
  }
  return end > start ? { start, end } : null;
}

function qcHours(text) {
  const t = qcNorm(text);
  let m = t.match(/\b(\d+)\s+and\s+a\s+half\s+hours?\b/);
  if (m) return +m[1] + 0.5;
  m = t.match(/\b(\d+(?:[.,]\d+)?)\s*(?:h\b|hrs?\b|hours?\b)/);
  if (m) {
    let h = parseFloat(m[1].replace(",", "."));
    if (/^ ?(?:and )?a half\b/.test(t.slice(t.indexOf(m[0]) + m[0].length))) h += 0.5;
    return h;
  }
  if (/\b(half an hour|a half hour)\b/.test(t)) return 0.5;
  m = t.match(/\b(an|one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve)\s+(?:and a half\s+)?hours?\b/);
  if (m) return QC_WORD_NUM[m[1]] + (/and a half/.test(m[0]) ? 0.5 : 0);
  return 0;
}

function qcMoney(text) {
  let m = String(text).match(/\$\s?(\d[\d,]*(?:\.\d+)?)/);
  if (!m) m = String(text).match(/\b(\d[\d,]*(?:\.\d+)?)\s*(?:dollars|bucks|cad|usd)\b/i);
  return m ? parseFloat(m[1].replace(/,/g, "")) : 0;
}

// "12 hours at $150", "40 tons @ 22.50" → { qty, unit, rate }
function qcQtyAtRate(text) {
  const m = qcNorm(text).match(/\b(\d[\d,]*(?:\.\d+)?)\s*([a-z]{0,10}?)\s*(?:@|at)\s*\$?\s?(\d[\d,]*(?:\.\d+)?)/);
  if (!m) return null;
  return { qty: parseFloat(m[1].replace(/,/g, "")), unit: (m[2] || "").trim(), rate: parseFloat(m[3].replace(/,/g, "")) };
}

const QC_UNITS = "tons?|tonnes?|cubic yards?|yards?|yds?|loads?|bags?|pallets?|boxes|sheets?|units?|pieces?|pcs?|each|ea|litres?|liters?|gallons?|gal|kg|lbs?|pounds?|metres?|meters?|feet|ft|rolls?|drums?|pails?|buckets?|sticks?|bundles?";
function qcQty(text) {
  const m = qcNorm(text).match(new RegExp("\\b(\\d[\\d,]*(?:\\.\\d+)?)\\s*(" + QC_UNITS + ")\\b"));
  return m ? { qty: parseFloat(m[1].replace(/,/g, "")), unit: m[2] } : null;
}

// The first plain number in the sentence — the last resort for "how many".
function qcFirstNumber(text) {
  const m = String(text).match(/\b(\d[\d,]*(?:\.\d+)?)\b/);
  return m ? parseFloat(m[1].replace(/,/g, "")) : 0;
}

const qcEmail = t => (String(t).match(/[\w.+-]+@[\w-]+\.[\w.-]+\w/) || [""])[0];
function qcPhone(text) {
  const m = String(text).replace(/\b\d{4}-\d{2}-\d{2}\b/g, " ").match(/(\+?\d[\d\s().-]{7,}\d)/);
  if (!m) return "";
  return m[1].replace(/\D/g, "").length >= 10 ? m[1].trim() : "";
}
function qcQuoted(text) {
  const m = String(text).match(/["“]([^"”]{2,90})["”]/) || String(text).match(/'([^']{2,90})'/);
  return m ? m[1].trim() : "";
}

// Where a name should stop: the next connector, a number, or punctuation.
const QC_CUT = /(?:,|;|:|\bfor\b|\bat\b|\bon\b|\bas\b|\bwith\b|\bstarting\b|\bstarts\b|\bdue\b|\bfrom\b|\bemail\b|\bphone\b|\brate\b|\bworth\b|\band\b|\busing\b|\bto\b|\bin\b|\btoday\b|\btomorrow\b|\byesterday\b|\$|\d)/i;
const QC_LEAD = /^(?:a|an|the|new|another|my|our|this|that|please|pls)\s+/i;

// Everything after `startRe`, up to the next connector. Used for names and
// descriptions — the parts of a sentence with no format to pattern-match on.
function qcPhrase(text, startRe, cut) {
  const m = String(text).match(startRe);
  if (!m) return "";
  let rest = String(text).slice(m.index + m[0].length);
  const at = rest.search(cut === null ? /$^/ : (cut || QC_CUT));
  if (at > 0) rest = rest.slice(0, at);
  return qcClean(rest);
}
function qcClean(s) {
  let v = String(s || "").replace(/^[\s:—–\-]+/, "").replace(/[\s.,;:!?\-]+$/, "").trim();
  for (let i = 0; i < 4; i++) { const before = v; v = v.replace(QC_LEAD, "").trim(); if (v === before) break; }
  return v;
}

// Find the record a sentence is talking about. An exact name scores highest,
// then "the sentence contains this record's name", then shared words — so
// "log 6 hours on the miller driveway" finds the job "Miller Driveway".
function qcBest(text, items, keyFn) {
  const q = qcNorm(text);
  if (!q) return null;
  let best = null, bestScore = 0;
  (items || []).forEach(it => {
    const name = qcNorm(keyFn(it));
    if (!name || name.length < 2) return;
    let score = 0;
    if (name === q) score = 200;
    else if (q.includes(name)) score = 100 + name.length;
    else if (name.includes(q) && q.length >= 3) score = 60 + q.length;
    else {
      const qt = q.split(" ").filter(w => w.length > 2);
      const nt = name.split(" ").filter(w => w.length > 2);
      const hits = nt.filter(w => qt.includes(w)).length;
      if (hits) score = 20 + hits * 12 + (hits === nt.length ? 15 : 0);
    }
    if (score > bestScore) { bestScore = score; best = it; }
  });
  return bestScore >= 32 ? best : null;
}

const qcNames = (col, key) => getCol(col).map(r => r[key]).filter(Boolean);
const qcCrewNames = () => getCol("employees").filter(e => e.isActive !== false).map(e => e.fullName).filter(Boolean);
const qcMe = ctx => (ctx.user && (ctx.user.name || ctx.user.email)) || "";

// "assign john and dave" / "crew: john, dave" → ["John", "Dave"], matched
// against real employees where possible so the names line up with the roster.
function qcCrew(text) {
  const found = [];
  getCol("employees").forEach(e => {
    const n = qcNorm(e.fullName);
    if (!n) return;
    const first = n.split(" ")[0];
    if (qcNorm(text).includes(n) || (first.length > 2 && new RegExp("\\b" + first + "\\b").test(qcNorm(text)))) found.push(e.fullName);
  });
  return Array.from(new Set(found));
}

/* ── The action catalog ───────────────────────────────────────────────────────
   One entry per thing the app can already do from a form or a button. Each one
   declares:
     patterns / test — the phrasings it answers to (longest match wins; `weight`
                       breaks ties between actions that share vocabulary)
     fields          — what the review card shows, in the order a person reads it
     parse           — sentence → field values (best effort; always editable)
     run             — the actual write, through the same helpers the forms use
   `nav` is the section it belongs to, so someone only ever gets the commands
   their permissions already allow. Adding a command here is all it takes for
   the parser, the review card, and the examples list to pick it up. */

/* ── Reading a photo ──────────────────────────────────────────────────────────
   Point the camera at a scale ticket, a delivery slip, a material label or an
   odometer instead of typing the numbers in. The text recognition is Tesseract
   (the long-standing open-source OCR engine, vendored in vendor/tesseract/), so
   the photo never leaves the phone and no account or key is involved.

   It's ~6 MB the first time someone scans — deliberately NOT part of the app
   shell, so the 99% of sessions that never scan anything don't pay for it. The
   service worker caches it on the way past, which means the second scan works
   with no signal at all. */

const QC_OCR_BASE = "vendor/tesseract/";
let qcOcrScript = null;

function qcLoadOcr() {
  if (window.Tesseract) return Promise.resolve(window.Tesseract);
  if (qcOcrScript) return qcOcrScript;
  qcOcrScript = new Promise((resolve, reject) => {
    const el = document.createElement("script");
    el.src = QC_OCR_BASE + "tesseract.min.js";
    el.onload = () => (window.Tesseract ? resolve(window.Tesseract) : reject(new Error("Text recognition failed to start.")));
    el.onerror = () => { qcOcrScript = null; reject(new Error("Couldn't load text recognition — you may be offline and haven't scanned before.")); };
    document.head.appendChild(el);
  });
  return qcOcrScript;
}

// Photo → plain text. `onProgress` gets 0–1 so the wait is visible; a phone
// photo takes a few seconds and silence reads as a hang.
async function qcReadPhoto(file, onProgress) {
  const T = await qcLoadOcr();
  const img = await downscaleImage(file, 1800, 0.92);
  let worker = null;
  try {
    worker = await T.createWorker("eng", 1, {
      workerPath: QC_OCR_BASE + "worker.min.js",
      corePath: QC_OCR_BASE,
      langPath: QC_OCR_BASE,
      gzip: false,
      logger: m => {
        if (!onProgress) return;
        // Loading the engine is the slow half of a first scan; show it as such.
        const share = m.status === "recognizing text" ? 0.5 + 0.5 * (m.progress || 0) : 0.5 * (m.progress || 0);
        onProgress(Math.max(0, Math.min(1, share)), m.status || "");
      },
    });
    const res = await worker.recognize(img);
    return (res && res.data && res.data.text) || "";
  } finally {
    if (worker) { try { await worker.terminate(); } catch (e) {} }
  }
}

/* ── Pulling values off a scanned document ────────────────────────────────── */

const qcLines = text => String(text || "").split(/\r?\n/).map(s => s.replace(/\s+/g, " ").trim()).filter(Boolean);

// OCR turns O into 0 and l into 1 as often as not, so read money off the line
// that says "total" first and only fall back to "the biggest number that looks
// like money" — which is right on a receipt far more often than it's wrong.
function qcOcrMoney(text) {
  const labelled = qcLines(text).filter(l => /\b(total|amount due|balance|grand total|subtotal)\b/i.test(l));
  for (const l of labelled) { const v = qcMoney(l); if (v > 0) return v; }
  let best = 0;
  qcLines(text).forEach(l => {
    const m = l.match(/\$?\s?\d[\d,]*\.\d{2}\b/g) || [];
    m.forEach(x => { const v = parseFloat(x.replace(/[^0-9.]/g, "")); if (v > best) best = v; });
  });
  return best;
}

function qcOcrTicket(text) {
  const m = String(text).match(/\b(?:scale\s*)?ticket\s*(?:no\.?|number|#)?\s*[:#]?\s*([A-Z0-9][A-Z0-9-]{2,})/i)
    || String(text).match(/\b(?:ticket|tkt)\s*[:#]\s*([A-Z0-9-]{3,})/i);
  return m ? m[1].trim() : "";
}

// Scale tickets print gross / tare / net; net is the number that gets billed.
function qcOcrWeight(text) {
  const lines = qcLines(text);
  const net = lines.filter(l => /\bnet\b/i.test(l));
  const pick = ls => {
    for (const l of ls) {
      const m = l.match(/(\d[\d,]*(?:\.\d+)?)\s*(tons?|tonnes?|t\b|yards?|yds?|cu\.?\s?yds?|lbs?|kg)/i);
      if (m) return { qty: parseFloat(m[1].replace(/,/g, "")), unit: m[2].toLowerCase() };
    }
    return null;
  };
  return pick(net) || pick(lines) || qcQty(text);
}

// The vendor is nearly always the biggest thing at the top of the slip: take
// the first line that reads like a name rather than an address or a number.
function qcOcrVendor(text) {
  const lines = qcLines(text).slice(0, 6);
  for (const l of lines) {
    const letters = (l.match(/[A-Za-z]/g) || []).length;
    const digits = (l.match(/\d/g) || []).length;
    if (letters >= 4 && digits <= 2 && l.length <= 46 && !/\b(invoice|receipt|ticket|date|time|phone|fax)\b/i.test(l)) {
      return qcTitle(l.toLowerCase());
    }
  }
  return "";
}

function qcOcrNumberNear(text, labelRe) {
  for (const l of qcLines(text)) {
    if (!labelRe.test(l)) continue;
    const m = l.match(/(\d[\d,]*(?:\.\d+)?)/);
    if (m) return parseFloat(m[1].replace(/,/g, ""));
  }
  return "";
}

/* ── What kind of document is this? ──────────────────────────────────────────
   Scored rather than a chain of ifs, so a slip that looks like two things picks
   the stronger read — and the answer is a dropdown on the review card either
   way, because a bad guess should cost one tap, not a wrong record. */
const QC_PHOTO_KINDS = [
  {
    id: "log_load", label: "Scale ticket / load slip",
    score: t => (/\bscale\b/.test(t) ? 3 : 0) + (/\bticket\b/.test(t) ? 3 : 0)
      + (/\b(gross|tare|net)\b/.test(t) ? 3 : 0) + (/\b(tons?|tonnes?|yards?|yds?)\b/.test(t) ? 2 : 0),
  },
  {
    id: "update_inventory", label: "Delivery slip for material you stock",
    score: (t, ctx) => (qcBest(t, getCol("inventory"), i => i.materialName) ? 4 : 0)
      + (/\b(delivered|delivery|received|packing slip|bill of lading)\b/.test(t) ? 3 : 0)
      + (qcQty(t) ? 1 : 0),
  },
  {
    id: "add_inventory", label: "Receipt / label for something new",
    score: t => (/\b(receipt|invoice|sold to|qty|quantity|item|sku|part\s*(no|#))\b/.test(t) ? 3 : 0)
      + (qcOcrMoney(t) > 0 ? 2 : 0),
  },
  {
    id: "update_equipment", label: "Odometer / hour meter",
    score: t => (/\b(odometer|odo|hour meter|hourmeter|hobbs|engine hours)\b/.test(t) ? 6 : 0)
      + (/\b(km|kms|miles|mi|hrs|hours)\b/.test(t) ? 1 : 0),
  },
  {
    id: "add_client", label: "Business card / contact details",
    score: t => (qcEmail(t) ? 3 : 0) + (qcPhone(t) ? 3 : 0)
      + (/\b(cell|mobile|office|tel|www\.|\.com|\.ca)\b/.test(t) ? 2 : 0)
      - (/\b(total|ticket|qty|net|tare)\b/.test(t) ? 4 : 0),
  },
];

function qcClassifyPhoto(text, actions, ctx) {
  const t = qcNorm(text);
  const allowed = QC_PHOTO_KINDS.filter(k => actions.some(a => a.id === k.id));
  let best = null, bestScore = 0;
  allowed.forEach(k => {
    let s = 0;
    try { s = k.score(t, ctx) || 0; } catch (e) {}
    if (s > bestScore) { bestScore = s; best = k; }
  });
  return { kinds: allowed, kind: best || allowed[0] || null };
}

const QC_ACTIONS = [
  /* ── Quotes & invoices ─────────────────────────────────────────────────── */
  {
    id: "create_invoice",
    label: "Create an invoice or quote",
    icon: "📄",
    nav: "quotes",
    weight: 6,
    examples: ["invoice Acme Corp $2,500 for gravel hauling", "create a quote for Jane Smith, 12 hours at $150"],
    // Starting the sentence with "invoice"/"quote" settles it, even when the
    // rest reads like a time entry ("invoice Miller 12 hours at $185").
    test: t => /^(?:invoice|bill|quote|estimate)\s+\S/.test(t),
    patterns: [
      /\b(?:create|make|add|new|start|draft|write|issue|raise|generate|build|open)\s+(?:a\s+|an\s+|new\s+)*(invoice|bill|quote|estimate)\b/,
      /\b(?:invoice|bill|quote|estimate)\s+(?:for|to)\b/,
      /^\s*(?:invoice|bill|quote|estimate)\s+[a-z]/i,
    ],
    fields: [
      { key: "status", label: "Type", type: "select", options: QUOTE_STATUSES },
      { key: "clientName", label: "Client", type: "datalist", options: () => qcNames("clients", "clientName"), required: true, placeholder: "Who is this for?" },
      { key: "description", label: "What for", placeholder: "Gravel hauling" },
      { key: "qty", label: "Quantity", type: "number" },
      { key: "unit", label: "Unit", placeholder: "hours, tons, each…" },
      { key: "rate", label: "Rate / amount ($)", type: "number" },
      { key: "taxRate", label: "Tax %", type: "number" },
      { key: "jobReference", label: "Job", type: "datalist", options: () => qcNames("jobs", "jobTitle") },
      { key: "dueDate", label: "Due date", type: "date" },
    ],
    parse: (text) => {
      const t = qcNorm(text);
      const isQuote = /\b(quote|estimate)\b/.test(t) && !/\binvoice\b/.test(t);
      const client = qcBest(text, getCol("clients"), c => c.clientName);
      const job = qcBest(text, getCol("jobs"), j => j.jobTitle);
      const atRate = qcQtyAtRate(text);
      const money = qcMoney(text);
      const qty = qcQty(text);

      // "for" carries both the client and the work; when we already know the
      // client from the roster, the last "for" is what the work was.
      let who = client ? client.clientName : qcTitle(qcQuoted(text) || qcPhrase(text, /\b(?:invoice|bill|quote|estimate|for|to)\s+/i));
      let what = "";
      const fors = t.split(/\bfor\b/).length - 1;
      if (client || fors > 1) what = qcPhrase(text, /^[\s\S]*\bfor\s+/i, /(?:,|;|\bat\b|\bdue\b|\bstarting\b|\$)/i);
      if (qcNorm(what) === qcNorm(who)) what = "";

      const v = {
        status: isQuote ? "Quote" : "Invoice",
        clientName: who,
        description: what,
        jobReference: job ? job.jobTitle : "",
        taxRate: "",
        dueDate: /\bdue\b/i.test(text) ? qcDate(text.slice(text.toLowerCase().indexOf("due"))) : "",
      };
      if (atRate) { v.qty = atRate.qty; v.unit = atRate.unit; v.rate = atRate.rate; }
      else if (qty && money) { v.qty = qty.qty; v.unit = qty.unit; v.rate = +(money / qty.qty).toFixed(2); }
      else { v.qty = 1; v.unit = ""; v.rate = money || ""; }
      return v;
    },
    run: (v, ctx) => {
      const doc = defaultDoc(ctx.company);
      const isQuote = v.status === "Quote" || v.status === "Draft";
      doc.status = v.status || "Invoice";
      if (isQuote) doc.quoteId = doc.quoteId.replace(/^INV-/, "QTE-");
      const c = getCol("clients").find(x => qcNorm(x.clientName) === qcNorm(v.clientName));
      doc.to = {
        name: c ? c.clientName : String(v.clientName || "").trim(),
        email: c ? (c.emailAddress || "") : "",
        phone: c ? (c.phoneNumber || "") : "",
        address: c ? (c.billingAddress || "") : "",
      };
      doc.clientReference = doc.to.name;
      doc.jobReference = v.jobReference || "";
      doc.taxRate = num(v.taxRate);
      if (v.dueDate) doc.dueDate = v.dueDate;
      doc.items = [{ id: genId(), description: v.description || "Work performed", unit: v.unit || "", qty: num(v.qty, 1) || 1, rate: num(v.rate), taxable: true }];
      doc.totalAmount = calcTotals(doc).total;

      const miles = (String(text).match(/\b(\d[\d,]*(?:\.\d+)?)\s*(?:miles?|mi\b|km\b|kilometres?|kilometers?)\b/i) || [])[1];

        endTime: range ? range.end : "",
        workDescription: what,

        equipmentUsed: v.equipmentUsed || "", mileageDriven: num(v.mileageDriven),

      };

    ],
    fields: [
      { key: "equipmentId", label: "Equipment", type: "select", options: () => getCol("equipment").map(e => ({ value: e._id, label: e.equipmentName })), required: true },
      { key: "currentMileage", label: "Mileage (km)", type: "number" },

      { key: "maintenanceNotes", label: "Maintenance note", type: "textarea" },
    ],
    parse: (text) => {
      const t = qcNorm(text);
      const eq = qcBest(text, getCol("equipment"), e => e.equipmentName);
      const v = { equipmentId: eq ? eq._id : "", currentMileage: "", totalHours: "", lastServiceDate: "", billingRatePerHour: "", warehouse: "", maintenanceNotes: "" };
      // Read the number carefully: unit names are attached to machine names too
      // ("F350", "CAT 320"), so never scan across letters to find one — take the
      // number next to the unit, or the one after "to"/"is"/"at".
      const grab = (res) => { for (let i = 0; i < res.length; i++) { const m = t.match(res[i]); if (m) return parseFloat(m[1].replace(/,/g, "")); } return ""; };
      if (/\b(mileage|odometer|kilometres|kilometers|km|miles)\b/.test(t)) {
        v.currentMileage = grab([
          /(\d[\d,]*(?:\.\d+)?)\s*(?:km|kilometres|kilometers|miles)\b/,
          /(?:mileage|odometer)[^0-9a-z]{0,12}(\d[\d,]*(?:\.\d+)?)/,
          /\b(?:to|at|is|now|reads?)\s+(\d[\d,]*(?:\.\d+)?)/,
        ]);
      }
      if (/\b(engine hours|hour meter|hours on|hourmeter)\b/.test(t)) {
        v.totalHours = grab([
          /(?:engine hours|hour meter|hourmeter|hours on)[^0-9a-z]{0,12}(\d[\d,]*(?:\.\d+)?)/,
          /(\d[\d,]*(?:\.\d+)?)\s*(?:engine )?hours\b/,
          /\b(?:to|at|is|now|reads?)\s+(\d[\d,]*(?:\.\d+)?)/,
        ]);
      }
      if (/\b(serviced|service|maintenance|greased|oil change)\b/.test(t)) v.lastServiceDate = qcDate(text) || today();
      const rate = t.match(/\$\s?(\d[\d,]*(?:\.\d+)?)\s*(?:an?|per|\/)\s*(?:hr|hour)/);
      if (rate) v.billingRatePerHour = parseFloat(rate[1].replace(/,/g, ""));
      const wh = qcBest(text, getCol("warehouses"), w => w.warehouseName);
      if (wh) v.warehouse = wh.warehouseName;
      if (/\b(note|noted|notes)\b/.test(t)) v.maintenanceNotes = qcPhrase(text, /\bnotes?d?\s*:?\s*/i, null);
      return v;
    },
    fromPhoto: (text) => {
      const eq = qcBest(text, getCol("equipment"), e => e.equipmentName);
      const km = qcOcrNumberNear(text, /\b(odometer|odo|km|kms|miles|mi)\b/i);
      const hrs = qcOcrNumberNear(text, /\b(hour meter|hourmeter|hobbs|engine hours|hrs?)\b/i);
      // A dash photo is usually one big number and nothing else — if no label
      // was readable, take the largest number and let the label decide later.
      const bare = km === "" && hrs === "" ? qcLines(text).map(l => (l.match(/\d[\d,]*/g) || []).map(x => parseFloat(x.replace(/,/g, "")))).flat().sort((a, b) => b - a)[0] : "";
      return {
        equipmentId: eq ? eq._id : "",
        currentMileage: km !== "" ? km : (bare || ""),
        totalHours: hrs !== "" ? hrs : "",
        lastServiceDate: "", billingRatePerHour: "", warehouse: "", maintenanceNotes: "",
      };
    },
    run: (v) => {
      const eq = db.getById("equipment", v.equipmentId);
      if (!eq) return { ok: false, message: "Pick which equipment item this is about." };
      const patch = { ...eq };
      const touched = [];
      if (String(v.currentMileage) !== "") { patch.currentMileage = num(v.currentMileage); touched.push("mileage " + num(v.currentMileage).toLocaleString() + " km"); }
      if (String(v.totalHours) !== "") { patch.totalHours = num(v.totalHours); touched.push(num(v.totalHours) + " engine hours"); }
      if (v.lastServiceDate) { patch.lastServiceDate = v.lastServiceDate; touched.push("serviced " + v.lastServiceDate); }
      if (String(v.billingRatePerHour) !== "") { patch.billingRatePerHour = num(v.billingRatePerHour); touched.push(fmt(num(v.billingRatePerHour)) + "/hr"); }
      if (v.warehouse) { patch.warehouse = v.warehouse; touched.push("at " + v.warehouse); }
      if (v.maintenanceNotes) { patch.maintenanceNotes = [eq.maintenanceNotes, v.maintenanceNotes].filter(Boolean).join("\n"); touched.push("note added"); }
      if (!touched.length) return { ok: false, message: "Nothing to change — fill in at least one detail." };
      db.update("equipment", patch);
      return { ok: true, message: eq.equipmentName + " updated: " + touched.join(", ") + ".", open: { page: "equipment" }, openLabel: "Open Equipment" };
    },
  },

      /\b(?:received|got in|took in|delivered|restocked|used|consumed|pulled)\b[\s\S]{0,24}\b(?:of|from|for)?\b/,

      { key: "movement", label: "What happened", type: "select", options: [{ value: "Received", label: "Received into stock" }, { value: "Used", label: "Used / taken out" }, { value: "Set", label: "Set the count on hand to…" }] },

        movement: "Received",
        quantity: w ? w.qty : "",

      if (!(qty >= 0)) return { ok: false, message: "How many? Add a quantity." };

        db.update("inventory", { ...item, currentStock: qty });

        inventoryId: item._id, type: v.movement, quantity: qty,
        note: v.note || "", entryDate: v.entryDate || today(), loggedBy: qcMe(ctx),

      const after = num(db.getById("inventory", item._id).currentStock);
      const low = isLowStock(db.getById("inventory", item._id));
      return {
        ok: true,
        message: v.movement.toLowerCase() + " " + qty.toLocaleString() + " " + unit + " of " + item.materialName

      let end = range.length > 1 ? qcDate(range.slice(1).join(" ")) : "";

        jobId: job ? job._id : "",

        endDate: end && end !== start ? end : (job ? job.endDate || "" : ""),
        jobStatus: (job && job.jobStatus) || "Pending",

/* ── Matching a sentence to an action ─────────────────────────────────────── */
// Longest match wins, with `weight` separating actions that share vocabulary
// ("set the mileage" is equipment, not a stock adjustment). Anything that only
// scrapes by turns into a suggestion rather than a silent wrong guess.
function qcMatch(text, actions) {
  const t = qcNorm(text);
  let best = null, bestScore = 0;
  (actions || []).forEach(a => {
    let score = 0;
    (a.patterns || []).forEach(re => { const m = t.match(re); if (m && m[0].length + (a.weight || 0) > score) score = m[0].length + (a.weight || 0); });
    if (a.test) { try { if (a.test(t)) score = Math.max(score, 16 + (a.weight || 0)); } catch (e) {} }
    if (score > bestScore) { bestScore = score; best = a; }
  });
  return bestScore > 0 ? best : null;
}

// When nothing matched, offer the closest few things it *can* do rather than a
// dead end — the catalog is the only place to learn the vocabulary.
function qcSuggest(text, actions) {
  const words = qcNorm(text).split(" ").filter(w => w.length > 2);
  const scored = (actions || []).map(a => {
    const hay = qcNorm(a.label + " " + (a.examples || []).join(" "));
    return { a, n: words.filter(w => hay.includes(w)).length };
  }).sort((x, y) => y.n - x.n);
  const top = scored.filter(s => s.n > 0).slice(0, 3).map(s => s.a);
  return top.length ? top : (actions || []).slice(0, 3);
}

/* ── The command bar ──────────────────────────────────────────────────────── */

const qcHistory = () => { try { return JSON.parse(storage.get(QC_HISTORY_KEY) || "[]"); } catch (e) { return []; } };

// Wraps the command bar in whatever a given device expects: a centred dialog on
// a computer, a full-height sheet on a phone (so the keyboard has room and the
// crew isn't aiming at a small box with gloves on).
function QuickCommandFrame({ onClose, isMobile, children }) {
  useEffect(() => {
    const onKey = e => { if (e.key === "Escape") onClose(); };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [onClose]);

  if (isMobile) {
    return (
      <div style={{ position: "fixed", inset: 0, zIndex: 300, background: C.bg, display: "flex", flexDirection: "column", paddingTop: "env(safe-area-inset-top)" }}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "14px 16px", borderBottom: "1px solid " + C.border, background: C.surface }}>
          <span style={{ fontWeight: 800, fontSize: 17 }}>⚡ Quick Command</span>
          <button type="button" onClick={onClose} style={{ background: "none", border: "none", fontSize: 26, color: C.textMuted, cursor: "pointer", lineHeight: 1 }}>×</button>
        </div>
        <div style={{ flex: 1, overflowY: "auto", padding: 16, paddingBottom: "calc(24px + env(safe-area-inset-bottom))" }}>{children}</div>
      </div>
    );
  }
  return (
    <div
      style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.5)", zIndex: 300, display: "flex", alignItems: "flex-start", justifyContent: "center", overflowY: "auto", padding: "60px 16px 40px" }}
      onMouseDown={e => { if (e.target === e.currentTarget) onClose(); }}
    >
      <div style={{ background: C.surface, borderRadius: 16, padding: 24, width: "100%", maxWidth: 640, boxShadow: "0 24px 60px rgba(0,0,0,0.25)" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
          <h3 style={{ fontSize: 18, fontWeight: 800 }}>⚡ Quick Command</h3>
          <button type="button" onClick={onClose} aria-label="Close" style={{ background: "none", border: "none", fontSize: 22, cursor: "pointer", color: C.textMuted, lineHeight: 1 }}>×</button>
        </div>
        {children}
      </div>
    </div>
  );
}

function QuickCommand({ onClose }) {
  const { user } = useAuth();
  const { company } = useCompany();
  const { navigate } = useRouter();
  const isMobile = useIsMobile();
  const actions = useMemo(() => QC_ACTIONS.filter(a => !a.nav || canAccess(a.nav, user)), [user]);

  const [text, setText] = useState("");
  const [stage, setStage] = useState("input");     // input → review → done
  const [action, setAction] = useState(null);
  const [values, setValues] = useState({});
  const [showAll, setShowAll] = useState(false);
  const [error, setError] = useState("");
  const [suggestions, setSuggestions] = useState([]);
  const [result, setResult] = useState(null);
  const [listening, setListening] = useState(false);
  const [history, setHistory] = useState(qcHistory);
  const [photoText, setPhotoText] = useState("");   // raw text read off a photo
  const [photoKinds, setPhotoKinds] = useState([]);
  const [photoKind, setPhotoKind] = useState("");
  const [showPhotoText, setShowPhotoText] = useState(false);
  const [scan, setScan] = useState(null);           // { pct, status } while reading
  const inputRef = useRef(null);
  const recRef = useRef(null);
  const fileRef = useRef(null);

  const ctx = { user, company, navigate, isMobile };

  useEffect(() => {
    const t = setTimeout(() => { if (inputRef.current) inputRef.current.focus(); }, 80);
    return () => { clearTimeout(t); try { if (recRef.current) recRef.current.abort(); } catch (e) {} };
  }, []);

  const interpret = (raw) => {
    const t = String(raw || "").trim();
    if (!t) return;
    const a = qcMatch(t, actions);
    if (!a) {
      setAction(null);
      setSuggestions(qcSuggest(t, actions));
      setError("That doesn't match anything the app can do yet. Try one of these:");
      return;
    }
    let parsed = {};
    try { parsed = (a.parse ? a.parse(t, ctx) : {}) || {}; } catch (e) { console.error("Quick Command parse:", e); }
    setError(""); setSuggestions([]);
    setAction(a); setValues(parsed); setShowAll(false); setStage("review");
  };

  const runIt = () => {
    const missing = (action.fields || []).filter(f => f.required && !String(values[f.key] === undefined ? "" : values[f.key]).trim());
    if (missing.length) { setShowAll(true); setError("Fill in " + missing.map(f => f.label.toLowerCase()).join(" and ") + " first."); return; }
    let out;
    try { out = action.run(values, ctx); } catch (e) {
      console.error("Quick Command run:", e);
      out = { ok: false, message: "Couldn't finish that — " + (e && e.message ? e.message : e) };
    }
    if (!out || out.ok === false) { setError((out && out.message) || "Couldn't finish that."); return; }
    const entry = text.trim();
    const next = [entry].concat(history.filter(h => h !== entry)).slice(0, 6);
    setHistory(next); storage.set(QC_HISTORY_KEY, JSON.stringify(next));
    notifyData();   // whatever page is open behind this re-reads the store
    if (out.immediate && out.open && navigate) { navigate(out.open.page, out.open.params || {}); onClose(); return; }
    setError(""); setResult(out); setStage("done");
  };

  const reset = () => {
    setStage("input"); setAction(null); setValues({}); setResult(null); setError(""); setSuggestions([]); setText("");
    setPhotoText(""); setPhotoKinds([]); setPhotoKind(""); setShowPhotoText(false); setScan(null);
    setTimeout(() => { if (inputRef.current) inputRef.current.focus(); }, 40);
  };

  // Point the camera at a ticket or a label instead of typing it. The photo is
  // read on the device and thrown away; only the fields you confirm get saved.
  const onPhoto = async (file) => {
    if (!file) return;
    setError(""); setSuggestions([]); setScan({ pct: 0, status: "Getting ready…" });
    try {
      const raw = await qcReadPhoto(file, (pct, status) => setScan({ pct, status: status || "Reading…" }));
      setScan(null);
      if (!qcNorm(raw)) { setError("Couldn't read any text in that photo. Try again with more light and the page filling the frame."); return; }
      const { kinds, kind } = qcClassifyPhoto(raw, actions, ctx);
      if (!kind) { setError("Nothing in the app takes a photo like that yet."); return; }
      setPhotoText(raw); setPhotoKinds(kinds);
      applyPhotoKind(kind.id, raw);
    } catch (e) {
      console.error("Quick Command photo:", e);
      setScan(null);
      setError(e && e.message ? e.message : "Couldn't read that photo.");
    }
  };

  const applyPhotoKind = (id, raw) => {
    const a = actions.find(x => x.id === id);
    if (!a) return;
    let v = {};
    try { v = (a.fromPhoto ? a.fromPhoto(raw || photoText, ctx) : {}) || {}; } catch (e) { console.error("Quick Command photo parse:", e); }
    setPhotoKind(id); setAction(a); setValues(v); setShowAll(false); setStage("review");
    setText("Photo — " + a.label.toLowerCase());
  };

  const listen = () => {
    if (!QC_Speech) return;
    if (listening) { try { recRef.current && recRef.current.stop(); } catch (e) {} return; }
    try {
      const r = new QC_Speech();
      recRef.current = r;
      r.lang = navigator.language || "en-CA";
      r.interimResults = false;
      r.continuous = false;
      r.maxAlternatives = 1;
      r.onresult = e => { const said = e.results[0][0].transcript; setText(said); interpret(said); };
      r.onerror = () => { setListening(false); setError("Couldn't hear that — check the microphone permission for this site."); };
      r.onend = () => setListening(false);
      setListening(true);
      r.start();
    } catch (e) { setListening(false); }
  };

  /* One field of the review card. Every field is editable — the parse is a head
     start, not a verdict. */
  const renderField = (f) => {
    const v = values[f.key] === undefined || values[f.key] === null ? "" : values[f.key];
    const set = val => setValues(p => Object.assign({}, p, { [f.key]: val }));
    const opts = typeof f.options === "function" ? f.options() : (f.options || []);
    let control;
    if (f.type === "select") {
      control = (
        <select value={v} onChange={e => set(e.target.value)} style={isMobile ? mInput : inputCls}>
          {!opts.some(o => (typeof o === "string" ? o : o.value) === "") && <option value="">Select…</option>}
          {opts.map((o, i) => {
            const val = typeof o === "string" ? o : o.value;
            const lab = typeof o === "string" ? o : o.label;
            return <option key={i} value={val}>{lab}</option>;
          })}
        </select>
      );
    } else if (f.type === "datalist") {
      const id = "qc-dl-" + f.key;
      control = (
        <>
          <input list={id} value={v} onChange={e => set(e.target.value)} placeholder={f.placeholder || ""} style={isMobile ? mInput : inputCls} />
          <datalist id={id}>{opts.map((o, i) => <option key={i} value={typeof o === "string" ? o : o.value} />)}</datalist>
        </>
      );
    } else if (f.type === "textarea") {
      control = <textarea value={v} onChange={e => set(e.target.value)} rows={2} placeholder={f.placeholder || ""} style={Object.assign({}, isMobile ? mInput : inputCls, { resize: "vertical", fontFamily: "inherit" })} />;
    } else if (f.type === "date" || f.type === "time" || f.type === "number") {
      control = <input type={f.type} step={f.type === "number" ? "any" : undefined} value={v} onChange={e => set(e.target.value)} placeholder={f.placeholder || ""} style={isMobile ? mInput : inputCls} />;
    } else {
      control = <input type="text" value={v} onChange={e => set(e.target.value)} placeholder={f.placeholder || ""} style={isMobile ? mInput : inputCls} />;
    }
    return (
      <div key={f.key} style={{ marginBottom: 10 }}>
        <label style={{ fontSize: 10.5, fontWeight: 700, color: C.textMuted, display: "block", marginBottom: 4, textTransform: "uppercase", letterSpacing: "0.5px" }}>
          {f.label}{f.required && <span style={{ color: C.destructive }}> *</span>}
        </label>
        {control}
      </div>
    );
  };

  const exampleChips = useMemo(() => {
    const out = [];
    actions.forEach(a => { if (a.examples && a.examples[0] && out.length < 6) out.push(a.examples[0]); });
    return out;
  }, [actions]);

  const filled = action ? (action.fields || []).filter(f => String(values[f.key] === undefined ? "" : values[f.key]).trim() !== "" || f.required) : [];
  const rest = action ? (action.fields || []).filter(f => filled.indexOf(f) === -1) : [];

  return (
    <QuickCommandFrame onClose={onClose} isMobile={isMobile}>
      {stage === "input" && (
        <div>
          <div style={{ display: "flex", gap: 8, alignItems: "stretch" }}>
            <input
              ref={inputRef}
              value={text}
              onChange={e => { setText(e.target.value); if (error) { setError(""); setSuggestions([]); } }}
              onKeyDown={e => { if (e.key === "Enter") { e.preventDefault(); interpret(text); } }}
              placeholder="What do you want to do?"
              style={Object.assign({}, isMobile ? mInput : inputCls, { fontSize: isMobile ? 16 : 15, padding: isMobile ? "14px" : "12px 14px" })}
            />
            {QC_Speech && (
              <button
                type="button" onClick={listen} title="Dictate"
                style={{ flexShrink: 0, width: isMobile ? 52 : 46, borderRadius: 10, cursor: "pointer", fontSize: 18, border: "1px solid " + (listening ? C.destructive : C.border), background: listening ? "#FEF2F2" : C.surfaceAlt, color: listening ? C.destructive : C.text }}
              >🎤</button>
            )}
          </div>
          {listening && <div style={{ fontSize: 12.5, color: C.destructive, fontWeight: 700, marginTop: 8 }}>Listening… say what you want done.</div>}

          <div style={{ display: "flex", gap: 10, marginTop: 12 }}>
            <button
              type="button" onClick={() => interpret(text)} disabled={!text.trim() || !!scan}
              style={Object.assign({}, isMobile ? mBtn : btnPrimary, { flex: 2, opacity: text.trim() && !scan ? 1 : 0.5 })}
            >Go</button>
            <button
              type="button" onClick={() => fileRef.current && fileRef.current.click()} disabled={!!scan}
              style={Object.assign({}, isMobile ? mBtn : btnOutline, { flex: 1, background: C.surface, color: C.text, border: "1px solid " + C.border, opacity: scan ? 0.5 : 1, whiteSpace: "nowrap" })}
            >📷 Photo</button>
          </div>
          <input
            ref={fileRef} type="file" accept="image/*" capture="environment" style={{ display: "none" }}
            onChange={e => { const f = e.target.files && e.target.files[0]; e.target.value = ""; onPhoto(f); }}
          />

          {scan && (
            <div style={{ marginTop: 14, padding: 14, background: C.surfaceAlt, borderRadius: 10 }}>
              <div style={{ fontSize: 13, fontWeight: 700, marginBottom: 8 }}>Reading the photo… <span style={{ color: C.textMuted, fontWeight: 500 }}>{scan.status}</span></div>
              <div style={{ height: 6, background: C.border, borderRadius: 3, overflow: "hidden" }}>
                <div style={{ height: "100%", width: Math.round(scan.pct * 100) + "%", background: C.accent, transition: "width .2s" }} />
              </div>
              <div style={{ fontSize: 11.5, color: C.textMuted, marginTop: 8, lineHeight: 1.5 }}>
                The first scan downloads the text reader (about 6 MB) — after that it works with no signal.
              </div>
            </div>
          )}

          {error && (
            <div style={{ marginTop: 14, padding: 12, background: "#FEFCE8", border: "1px solid #FDE68A", borderRadius: 10, fontSize: 13, color: "#92400E" }}>{error}</div>
          )}

          {(suggestions.length ? suggestions : []).map(a => (
            <button key={a.id} type="button" onClick={() => { setText(a.examples[0]); interpret(a.examples[0]); }}
              style={{ display: "block", width: "100%", textAlign: "left", marginTop: 8, padding: "10px 12px", border: "1px solid " + C.border, borderRadius: 10, background: C.surface, cursor: "pointer", fontSize: 13 }}>
              <span style={{ marginRight: 8 }}>{a.icon}</span><strong>{a.label}</strong>
              <div style={{ color: C.textMuted, fontSize: 12, marginTop: 2 }}>“{a.examples[0]}”</div>
            </button>
          ))}

          {history.length > 0 && !error && (
            <div style={{ marginTop: 18 }}>
              <div style={{ fontSize: 10.5, fontWeight: 700, color: C.textMuted, textTransform: "uppercase", letterSpacing: "0.5px", marginBottom: 6 }}>Recent</div>
              {history.map((h, i) => (
                <button key={i} type="button" onClick={() => { setText(h); interpret(h); }}
                  style={{ display: "block", width: "100%", textAlign: "left", padding: "8px 10px", border: "none", borderRadius: 8, background: "transparent", cursor: "pointer", fontSize: 13, color: C.text }}>
                  ↺ {h}
                </button>
              ))}
            </div>
          )}

          {!error && (
            <div style={{ marginTop: 18 }}>
              <div style={{ fontSize: 10.5, fontWeight: 700, color: C.textMuted, textTransform: "uppercase", letterSpacing: "0.5px", marginBottom: 6 }}>Things you can say</div>
              {exampleChips.map((ex, i) => (
                <button key={i} type="button" onClick={() => { setText(ex); interpret(ex); }}
                  style={{ display: "block", width: "100%", textAlign: "left", padding: "8px 10px", marginBottom: 2, border: "none", borderRadius: 8, background: C.surfaceAlt, cursor: "pointer", fontSize: 13, color: C.text }}>
                  “{ex}”
                </button>
              ))}
              <p style={{ fontSize: 11.5, color: C.textMuted, marginTop: 10, lineHeight: 1.5 }}>
                Or tap <strong>📷 Photo</strong> to read a scale ticket, delivery slip, material label,
                odometer or business card instead of typing it.
              </p>
              <p style={{ fontSize: 11.5, color: C.textMuted, marginTop: 6, lineHeight: 1.5 }}>
                All of it runs on this device — nothing is sent anywhere, and it works with no signal.
              </p>
            </div>
          )}
        </div>
      )}

      {stage === "review" && action && (
        <div>
          <div style={{ display: "flex", alignItems: "center", gap: 10, padding: "10px 12px", background: C.surfaceAlt, borderRadius: 10, marginBottom: 14 }}>
            <span style={{ fontSize: 20 }}>{action.icon}</span>
            <div style={{ minWidth: 0 }}>
              <div style={{ fontWeight: 800, fontSize: 14 }}>{action.label}</div>
              <div style={{ fontSize: 12, color: C.textMuted, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>“{text}”</div>
            </div>
          </div>

          {photoText && photoKinds.length > 1 && (
            <div style={{ marginBottom: 12 }}>
              <label style={{ fontSize: 10.5, fontWeight: 700, color: C.textMuted, display: "block", marginBottom: 4, textTransform: "uppercase", letterSpacing: "0.5px" }}>What is this photo?</label>
              <select value={photoKind} onChange={e => applyPhotoKind(e.target.value)} style={isMobile ? mInput : inputCls}>
                {photoKinds.map(k => <option key={k.id} value={k.id}>{k.label}</option>)}
              </select>
            </div>
          )}

          {filled.map(renderField)}

          {rest.length > 0 && !showAll && (
            <button type="button" onClick={() => setShowAll(true)}
              style={{ background: "none", border: "none", color: C.accent, fontWeight: 700, fontSize: 12.5, cursor: "pointer", padding: "4px 0", marginBottom: 8 }}>
              + Add more details ({rest.length})
            </button>
          )}
          {showAll && rest.map(renderField)}

          {/* Everything the camera actually read, so a wrong-looking number can
              be checked against the slip without starting over. */}
          {photoText && (
            <div style={{ marginTop: 6 }}>
              <button type="button" onClick={() => setShowPhotoText(v => !v)}
                style={{ background: "none", border: "none", color: C.textMuted, fontWeight: 700, fontSize: 12, cursor: "pointer", padding: "4px 0" }}>
                {showPhotoText ? "▾" : "▸"} Text read from the photo
              </button>
              {showPhotoText && (
                <pre style={{ margin: "4px 0 8px", padding: 10, background: C.surfaceAlt, borderRadius: 8, fontSize: 11.5, lineHeight: 1.5, maxHeight: 180, overflow: "auto", whiteSpace: "pre-wrap", color: C.textMuted, fontFamily: "ui-monospace, Menlo, Consolas, monospace" }}>{photoText.trim()}</pre>
              )}
            </div>
          )}

          {error && <div style={{ margin: "6px 0 10px", padding: 10, background: "#FEF2F2", border: "1px solid #FECACA", borderRadius: 8, fontSize: 12.5, color: "#991B1B" }}>{error}</div>}

          <div style={{ display: "flex", gap: 10, marginTop: 12 }}>
            <button type="button" onClick={reset} style={Object.assign({}, isMobile ? mBtn : btnOutline, { flex: 1, background: C.surface, color: C.text, border: "1px solid " + C.border })}>Back</button>
            <button type="button" onClick={runIt} style={Object.assign({}, isMobile ? mBtn : btnPrimary, { flex: 2 })}>Do it</button>
          </div>
        </div>
      )}

      {stage === "done" && result && (
        <div>
          <div style={{ textAlign: "center", padding: "10px 0 16px" }}>
            <div style={{ fontSize: 40, lineHeight: 1 }}>✅</div>
            <div style={{ fontSize: 14.5, fontWeight: 600, marginTop: 10, lineHeight: 1.5 }}>{result.message}</div>
          </div>
          <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
            {result.open && navigate && !isMobile && (
              <button type="button" onClick={() => { navigate(result.open.page, result.open.params || {}); onClose(); }}
                style={Object.assign({}, btnSecondary, { flex: 1 })}>{result.openLabel || "Open it"}</button>
            )}
            <button type="button" onClick={reset} style={Object.assign({}, isMobile ? mBtn : btnOutline, { flex: 1, background: C.surface, color: C.text, border: "1px solid " + C.border })}>Do another</button>
            <button type="button" onClick={onClose} style={Object.assign({}, isMobile ? mBtn : btnPrimary, { flex: 1 })}>Done</button>
          </div>
        </div>
      )}
    </QuickCommandFrame>
  );
}

// Opening the bar from anywhere: a button, or ⌘K / Ctrl-K on a keyboard.
function useQuickCommand() {
  const [open, setOpen] = useState(false);
  useEffect(() => {
    const onKey = e => {
      if ((e.metaKey || e.ctrlKey) && (e.key === "k" || e.key === "K")) { e.preventDefault(); setOpen(o => !o); }
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, []);
  return [open, setOpen];
}

function Sidebar({ open, onClose }) {
  const { page, navigate } = useRouter();
  const { company } = useCompany();
  const { logout, user } = useAuth();

  // While the menu is over the page, the page underneath must not scroll —
  // otherwise a swipe aimed at the nav list drags the dashboard around behind
  // the backdrop. Only matters in the overlay state; harmless on a wide screen
  // where the sidebar is never "open".
  useEffect(() => {
    if (!open) return;
    const prev = document.body.style.overflow;
    document.body.style.overflow = "hidden";
    return () => { document.body.style.overflow = prev; };
  }, [open]);

  return (
    <>
      <div className={"sidebar-backdrop" + (open ? " open" : "")} onClick={onClose} />
      <aside className={"sidebar" + (open ? " open" : "")}>
        <div style={{ padding: "18px 16px", borderBottom: "1px solid rgba(255,255,255,0.1)", display: "flex", alignItems: "center", gap: 10 }}>
          {company?.logoUrl
            ? <img src={company.logoUrl} alt="" style={{ width: 32, height: 32, borderRadius: 8, objectFit: "cover", background: "#fff", flexShrink: 0 }} />
            : <div style={{ width: 32, height: 32, borderRadius: 8, background: C.secondary, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 16, fontWeight: 800, flexShrink: 0 }}>{(company?.companyName || "B").slice(0, 1).toUpperCase()}</div>}
          <div style={{ minWidth: 0 }}>
            <div style={{ fontWeight: 800, fontSize: 14, letterSpacing: "-0.3px", lineHeight: 1.2 }}>BuildMyBill</div>
            <div style={{ fontSize: 10, opacity: 0.55, lineHeight: 1.3, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
              {company?.companyName || "My Company"}
            </div>
          </div>
        </div>

        <nav style={{ flex: 1, padding: 8, overflowY: "auto" }}>
          {NAV.filter(item => canAccess(item.id, user)).map(item => {
            const active = page === item.id || (page === "quote-editor" && item.id === "quotes");
            return (
              <button
                type="button"
                key={item.id}
                onClick={() => { navigate(item.id); onClose(); }}
                style={{
                  width: "100%", display: "flex", alignItems: "center", gap: 8,

const FORCE_DESKTOP_KEY = "bmb_force_desktop";
const FORCE_MOBILE_KEY = "bmb_force_mobile";
const ACTIVE_CLOCK_KEY = "bmb_active_clock";

function useIsMobile() {
  const q = "(max-width: 820px)";
  // Force-mobile lets you preview the field app on a computer (and adds "?mobile=1").
  const forced = () => storage.get(FORCE_MOBILE_KEY) === "1" || /[?&]mobile=1/.test(window.location.href);
  const val = () => forced() || (storage.get(FORCE_DESKTOP_KEY) !== "1" && window.matchMedia(q).matches);
  const [mobile, setMobile] = useState(val);
  useEffect(() => {
    const mq = window.matchMedia(q);
    const on = () => setMobile(val());
    mq.addEventListener ? mq.addEventListener("change", on) : mq.addListener(on);
    return () => { mq.removeEventListener ? mq.removeEventListener("change", on) : mq.removeListener(on); };
  }, []);
  return mobile;
}

// Current position as "lat, lng", or null. Never blocks the caller for long.
function getGeo(timeout = 8000) {
  return new Promise(resolve => {
    if (!navigator.geolocation) return resolve(null);
    navigator.geolocation.getCurrentPosition(
      p => resolve(p.coords.latitude.toFixed(6) + ", " + p.coords.longitude.toFixed(6)),
      () => resolve(null),
      { enableHighAccuracy: true, timeout, maximumAge: 60000 }
    );
  });
}

const timeHM = d => { const p = n => String(n).padStart(2, "0"); return p(d.getHours()) + ":" + p(d.getMinutes()); };
const fmtDur = ms => {
  const s = Math.max(0, Math.floor(ms / 1000));
  const p = n => String(n).padStart(2, "0");
  return Math.floor(s / 3600) + ":" + p(Math.floor((s % 3600) / 60)) + ":" + p(s % 60);
};

// 📊 My Hours — an employee's own clocked-shift history, grouped by month, with
// a way to request a correction on a shift instead of editing it directly
// (e.g. forgot to clock out and ended up with a 23-hour shift). Requests go to
// the owner/managers for approval — see ShiftRequestsPage and
// supabase/migration_shift_requests.sql for the email side.
function MyHoursSheet({ employee, onClose }) {
  useDataVersion();
  const shifts = getCol("shifts").filter(s => s.employeeName === employee).sort((a, b) => (b.entryDate || "").localeCompare(a.entryDate || ""));
  const requests = getCol("shiftrequests").filter(r => r.employeeName === employee);

  const oneYearAgo = dateStr(new Date(Date.now() - 366 * 86400000));
  const recent = shifts.filter(s => (s.entryDate || "") >= oneYearAgo);
  const totalHours = recent.reduce((s, x) => s + num(x.hours), 0);

  const months = {};
  recent.forEach(s => { const k = (s.entryDate || "").slice(0, 7); if (!months[k]) months[k] = []; months[k].push(s); });
  const monthKeys = Object.keys(months).sort((a, b) => b.localeCompare(a));
  const monthLabel = k => { const [y, m] = k.split("-").map(Number); return new Date(y, m - 1, 1).toLocaleDateString(undefined, { month: "long", year: "numeric" }); };

  const [expanded, setExpanded] = useState(() => today().slice(0, 7));
  const [editingId, setEditingId] = useState(null);
  const [form, setForm] = useState({ start: "", end: "", reason: "" });
  const [msg, setMsg] = useState("");

  const openEdit = s => { setEditingId(s._id); setForm({ start: s.startTime || "", end: s.endTime || "", reason: "" }); setMsg(""); };
  const submitRequest = s => {
    if (!form.start || !form.end || !form.reason.trim()) { setMsg("Fill in the corrected times and a reason."); return; }
    db.create("shiftrequests", {
      employeeName: employee, shiftId: s._id, entryDate: s.entryDate,
      originalStartTime: s.startTime, originalEndTime: s.endTime, originalHours: s.hours,
      requestedStartTime: form.start, requestedEndTime: form.end, reason: form.reason.trim(),
      status: "Pending",
    });
    notifyData();
    setEditingId(null);
    setMsg("Request sent — your owner/manager will get an email.");
    setTimeout(() => setMsg(""), 4000);
  };

  return (
    <MobileSheet title="My Hours" onClose={onClose}>
      <div style={{ padding: 16 }}>
        <div style={{ fontSize: 12, color: C.textMuted, marginBottom: 16 }}>{totalHours.toFixed(1)} hours clocked over the last 12 months</div>

        {monthKeys.length === 0 && <div style={{ textAlign: "center", color: C.textMuted, padding: "20px 0" }}>No clocked shifts yet.</div>}

        {monthKeys.map(k => {
          const rows = months[k];
          const monthTotal = rows.reduce((s, x) => s + num(x.hours), 0);
          const isOpen = expanded === k;
          return (
            <div key={k} style={{ marginBottom: 10 }}>
              <button type="button" onClick={() => setExpanded(isOpen ? null : k)} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", width: "100%", background: C.surfaceAlt, border: "none", borderRadius: 10, padding: "12px 14px", cursor: "pointer", textAlign: "left" }}>
                <span style={{ fontWeight: 700, fontSize: 14 }}>{isOpen ? "▾" : "▸"} {monthLabel(k)}</span>
                <span style={{ fontSize: 13, color: C.textMuted }}>{monthTotal.toFixed(1)} h · {rows.length} shift{rows.length === 1 ? "" : "s"}</span>
              </button>
              {isOpen && rows.map(s => {
                const req = requests.find(r => r.shiftId === s._id && r.status !== "Rejected");
                return (
                  <div key={s._id} style={{ ...mCard, marginTop: 8, padding: 14 }}>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 10 }}>
                      <div>
                        <div style={{ fontWeight: 700, fontSize: 14 }}>{s.entryDate}</div>
                        <div style={{ fontSize: 12, color: C.textMuted }}>{s.startTime || "?"}–{s.endTime || "?"}</div>
                      </div>
                      <div style={{ fontWeight: 800, color: C.accent }}>{hmm(num(s.hours))}</div>
                    </div>
                    {req
                      ? <div style={{ marginTop: 8 }}><StatusBadge status={req.status} /></div>
                      : editingId === s._id
                        ? (
                          <div style={{ marginTop: 10, borderTop: "1px solid " + C.border, paddingTop: 10 }}>
                            {dayWorkContext(employee, s.entryDate).length > 0 && (
                              <div style={{ background: C.surfaceAlt, borderRadius: 8, padding: 10, marginBottom: 10, fontSize: 12 }}>
                                <div style={{ fontWeight: 700, marginBottom: 4 }}>You logged that day:</div>
                                {dayWorkContext(employee, s.entryDate).map(e => (
                                  <div key={e._id}>{e.jobName || "Work"} · {e.startTime || "?"}–{e.endTime || "?"}</div>
                                ))}
                              </div>
                            )}
                            <div style={{ display: "flex", gap: 10 }}>
                              <div style={{ flex: 1 }}><label style={mLbl}>Actually started</label><input type="time" value={form.start} onChange={e => setForm(f => ({ ...f, start: e.target.value }))} style={mInput} /></div>
                              <div style={{ flex: 1 }}><label style={mLbl}>Actually ended</label><input type="time" value={form.end} onChange={e => setForm(f => ({ ...f, end: e.target.value }))} style={mInput} /></div>
                            </div>
                            <label style={mLbl}>Reason</label>
                            <input value={form.reason} onChange={e => setForm(f => ({ ...f, reason: e.target.value }))} placeholder="Forgot to clock out, left around 5pm…" style={mInput} />
                            {msg && <div style={{ fontSize: 12, color: msg.includes("sent") ? C.green : "#DC2626", marginTop: 8 }}>{msg}</div>}
                            <div style={{ display: "flex", gap: 10, marginTop: 10 }}>
                              <button type="button" onClick={() => setEditingId(null)} style={{ ...btnOutline, flex: 1 }}>Cancel</button>
                              <button type="button" onClick={() => submitRequest(s)} style={{ ...btnSecondary, flex: 1 }}>Send request</button>
                            </div>
                          </div>
                        )
                        : <button type="button" onClick={() => openEdit(s)} style={{ background: "none", border: "none", color: C.accent, fontSize: 12, fontWeight: 700, cursor: "pointer", padding: 0, marginTop: 8 }}>Request a correction</button>}
                  </div>
                );
              })}
            </div>
          );
        })}
      </div>
    </MobileSheet>
  );
}
