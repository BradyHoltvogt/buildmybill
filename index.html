// Draw-with-your-finger signature box. Exports a PNG data URL; the file itself
// isn't uploaded until the submission syncs, so signing works offline.
function SignaturePad({ value, onChange, height = 150 }) {
  const ref = useRef(null);
  const drawing = useRef(false);
  const last = useRef(null);

  const ctxOf = () => ref.current && ref.current.getContext("2d");
  const paintBase = (ctx, w, h) => {
    ctx.fillStyle = "#FFFFFF"; ctx.fillRect(0, 0, w, h);
    ctx.strokeStyle = "#111827"; ctx.lineWidth = 2.2; ctx.lineCap = "round"; ctx.lineJoin = "round";
  };

  useEffect(() => {
    const c = ref.current;
    if (!c) return;
    // Back the canvas at device resolution so the line isn't a blurry smear on a
    // phone, but keep drawing in CSS pixels.
    const dpr = window.devicePixelRatio || 1;
    const w = c.clientWidth || 300;
    c.width = Math.round(w * dpr); c.height = Math.round(height * dpr);
    const ctx = c.getContext("2d");
    ctx.scale(dpr, dpr);
    paintBase(ctx, w, height);
    if (value) { const img = new Image(); img.onload = () => ctx.drawImage(img, 0, 0, w, height); img.src = value; }
  }, []);

  const at = e => {
    const r = ref.current.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  };
  const down = e => {
    e.preventDefault();
    if (ref.current.setPointerCapture) { try { ref.current.setPointerCapture(e.pointerId); } catch (err) {} }
    drawing.current = true; last.current = at(e);
  };
  const move = e => {
    if (!drawing.current) return;
    e.preventDefault();
    const ctx = ctxOf(); const p = at(e);
    ctx.beginPath(); ctx.moveTo(last.current.x, last.current.y); ctx.lineTo(p.x, p.y); ctx.stroke();
    last.current = p;
  };
  const up = () => {
    if (!drawing.current) return;
    drawing.current = false;
    onChange(ref.current.toDataURL("image/png"));
  };
  const clear = () => {
    const c = ref.current;
    paintBase(c.getContext("2d"), c.clientWidth || 300, height);
    onChange("");
  };

  return (
    <div>
      <canvas
        ref={ref}
        onPointerDown={down} onPointerMove={move} onPointerUp={up} onPointerCancel={up} onPointerLeave={up}
        style={{ width: "100%", height, border: "1px dashed " + C.border, borderRadius: 10, background: "#fff", touchAction: "none", cursor: "crosshair", display: "block" }}
      />
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginTop: 6 }}>
        <span style={{ fontSize: 11, color: value ? C.green : C.textMuted }}>{value ? "✓ Signed" : "Sign above with your finger or mouse"}</span>
        <button type="button" onClick={clear} style={{ ...btnOutline, padding: "4px 10px", fontSize: 11 }}>Clear</button>
      </div>
    </div>
  );
}

// A stored signature/photo, fetched through a short-lived signed URL.
function SafetyImage({ path, alt, height = 120 }) {
  const [url, setUrl] = useState(null);
  useEffect(() => {
    let alive = true;
    bmbSafetyFiles.signedUrl(path).then(u => { if (alive) setUrl(u); });
    return () => { alive = false; };
  }, [path]);
  if (!url) return <div style={{ height, background: C.surfaceAlt, borderRadius: 8, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 11, color: C.textMuted }}>Loading…</div>;
  return (
    <a href={url} target="_blank" rel="noopener noreferrer">
      <img src={url} alt={alt || "Attachment"} style={{ width: "100%", height, objectFit: "contain", background: "#fff", border: "1px solid " + C.border, borderRadius: 8, display: "block" }} />
    </a>
  );
}

/* ── Filling out a form ─────────────────────────────────────────────────────
   Answers are held in local state until Submit, then handed to the offline queue
   in one piece. Photos are downscaled hard (1400px / q0.65): they have to sit in
   localStorage until there's signal, so a 12 MP original is not an option. */
function SafetyFormFill({ template, job, workerName, workerId, onDone, onCancel, compact }) {
  const fields = Array.isArray(template.fields) ? template.fields : [];
  const [answers, setAnswers] = useState({});
  const [photos, setPhotos] = useState({});   // fieldId → { dataUrl, name }
  const [sigs, setSigs] = useState({});       // fieldId → PNG data URL
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState("");
  const set = (id, v) => setAnswers(a => ({ ...a, [id]: v }));

  const addPhoto = async (fieldId, file) => {
    if (!file) return;
    setError("");
    try {
      const blob = await downscaleImage(file, 1400, 0.65);
      const dataUrl = await blobToDataUrl(blob);
      if (!dataUrl) throw new Error("Couldn't read that photo.");
      setPhotos(p => ({ ...p, [fieldId]: { dataUrl, name: file.name || "photo.jpg" } }));
    } catch (e) { setError(e.message || String(e)); }
  };

  const submit = async () => {
    // Required fields: a signature/photo counts as answered when one is captured.
    const missing = fields.filter(f => {
      if (!f.required) return false;
      if (f.type === "signature") return !sigs[f.id];
      if (f.type === "photo") return !photos[f.id];
      if (f.type === "checkbox") return !answers[f.id];
      return !String(answers[f.id] ?? "").trim();
    });
    if (missing.length) { setError('"' + (missing[0].label || "A field") + '" is required.'); return; }

    setBusy(true); setError("");
    const files = [];
    fields.forEach(f => {
      if (f.type === "signature" && sigs[f.id]) files.push({ kind: "signature", fieldId: f.id, dataUrl: sigs[f.id], ext: "png", mime: "image/png" });
      if (f.type === "photo" && photos[f.id]) files.push({ kind: "photo", fieldId: f.id, dataUrl: photos[f.id].dataUrl, ext: "jpg", mime: "image/jpeg", name: photos[f.id].name });
    });
    // Answers are keyed by field id, but the label is stored alongside so a
    // submission still reads correctly after someone renames a template field.
    const answerRows = fields.map(f => ({
      id: f.id, label: f.label, type: f.type,
      value: f.type === "signature" ? (sigs[f.id] ? "Signed" : "")
        : f.type === "photo" ? (photos[f.id] ? (photos[f.id].name || "Photo") : "")
        : f.type === "checkbox" ? !!answers[f.id]
        : (answers[f.id] ?? ""),
    }));
    try {
      const res = await submitSafetyForm({
        data: {
          templateId: template._id, templateTitle: template.title, category: template.category || "",
          repeatSchedule: template.repeatSchedule || "none",
          workerName, workerId: workerId || null,
          jobId: job ? job._id : "", jobName: job ? job.jobTitle : "",
          submittedAt: new Date().toISOString(), entryDate: today(),
          answers: answerRows,
        },
        files,
      });
      onDone(res);
    } catch (e) { setError(e.message || String(e)); setBusy(false); }
  };

  const lbl = f => (
    <div style={{ fontSize: 12, fontWeight: 700, color: C.textMuted, textTransform: "uppercase", letterSpacing: "0.4px", marginBottom: 5 }}>
      {f.label}{f.required && <span style={{ color: C.destructive }}> *</span>}
    </div>
  );

  return (
    <div>
      {!compact && (
        <div style={{ marginBottom: 14 }}>
          <div style={{ fontSize: 13, color: C.textMuted }}>{job ? job.jobTitle : "No job"} · {workerName}</div>
        </div>
      )}
      {error && <div style={{ background: "#FEF2F2", color: "#DC2626", padding: "10px 14px", borderRadius: 8, marginBottom: 14, fontSize: 13 }}>{error}</div>}

      {fields.length === 0 && <div style={{ fontSize: 13, color: C.textMuted, marginBottom: 14 }}>This template has no questions yet.</div>}

      {fields.map(f => (
        <div key={f.id} style={{ marginBottom: 16 }}>
          {f.type !== "checkbox" && lbl(f)}
          {f.type === "text" && <TextInput value={answers[f.id]} onChange={v => set(f.id, v)} placeholder={f.placeholder || ""} style={compact ? mInput : {}} />}
          {f.type === "choice" && (
            <div style={{ display: "grid", gap: 6 }}>
              {(f.options || []).map(o => {
                const on = answers[f.id] === o;
                return (
                  <button type="button" key={o} onClick={() => set(f.id, o)}
                    style={{ textAlign: "left", padding: "10px 12px", borderRadius: 9, cursor: "pointer", fontSize: 14, fontWeight: on ? 700 : 500,
                             border: "1px solid " + (on ? C.green : C.border), background: on ? "#F0FDF4" : C.surface, color: C.text }}>
                    {on ? "● " : "○ "}{o}
                  </button>
                );
              })}
              {(f.options || []).length === 0 && <div style={{ fontSize: 12, color: C.textMuted }}>No choices set on this question.</div>}
            </div>
          )}
          {f.type === "checkbox" && <Checkbox checked={!!answers[f.id]} onChange={v => set(f.id, v)} label={f.label + (f.required ? " *" : "")} />}
          {f.type === "signature" && <SignaturePad value={sigs[f.id] || ""} onChange={v => setSigs(s => ({ ...s, [f.id]: v }))} />}
          {f.type === "photo" && (
            <div>
              {photos[f.id]
                ? <img src={photos[f.id].dataUrl} alt={f.label} style={{ width: "100%", maxHeight: 220, objectFit: "contain", border: "1px solid " + C.border, borderRadius: 10, background: "#fff", display: "block", marginBottom: 6 }} />
                : null}
              <label style={{ ...btnOutline, display: "inline-block", cursor: "pointer" }}>
                {photos[f.id] ? "Retake / choose another" : "📷 Take or choose a photo"}
                <input type="file" accept="image/*" style={{ display: "none" }} onChange={e => addPhoto(f.id, e.target.files && e.target.files[0])} />
              </label>
            </div>
          )}
        </div>
      ))}

      <div style={{ display: "flex", gap: 10, marginTop: 20 }}>
        <button type="button" onClick={onCancel} disabled={busy} style={{ ...btnOutline, flex: 1, ...(compact ? { padding: 14, fontSize: 15 } : {}) }}>Cancel</button>
        <button type="button" onClick={submit} disabled={busy} style={{ ...btnSecondary, flex: 2, opacity: busy ? 0.6 : 1, ...(compact ? { padding: 14, fontSize: 15 } : {}) }}>
          {busy ? "Submitting…" : "Submit form"}
        </button>
      </div>
    </div>
  );
}

/* ── The form builder (admin) ─────────────────────────────────────────────── */
function TemplateBuilder({ template, onSave, onCancel }) {
  const [t, setT] = useState(() => ({
    title: "", category: SAFETY_CATEGORIES[0], repeatSchedule: "none", assignedJobs: [], active: true, fields: [],
    ...template,
  }));
  const [error, setError] = useState("");
  const jobs = useMemo(() => jobsByClient(getCol("jobs")), []);
  const set = (k, v) => setT(p => ({ ...p, [k]: v }));
  const fields = t.fields || [];
  const setFields = f => set("fields", f);
  const patch = (i, p) => setFields(fields.map((f, fi) => (fi === i ? { ...f, ...p } : f)));
  const addField = () => setFields([...fields, { id: genId(), type: "text", label: "", required: false, options: [] }]);
  const removeField = i => setFields(fields.filter((_, fi) => fi !== i));
  const moveField = (i, d) => {
    const j = i + d;
    if (j < 0 || j >= fields.length) return;
    const next = fields.slice();
    next[i] = fields[j]; next[j] = fields[i];
    setFields(next);
  };

  const save = () => {
    if (!String(t.title || "").trim()) { setError("Give the form a title."); return; }
    if (!fields.length) { setError("Add at least one question."); return; }
    const unlabelled = fields.find(f => !String(f.label || "").trim());
    if (unlabelled) { setError("Every question needs a label."); return; }
    const emptyChoice = fields.find(f => f.type === "choice" && (f.options || []).filter(o => String(o).trim()).length < 2);
    if (emptyChoice) { setError('"' + emptyChoice.label + '" needs at least two choices.'); return; }
    onSave({ ...t, fields: fields.map(f => ({ ...f, options: (f.options || []).map(o => String(o).trim()).filter(Boolean) })) });
  };

  return (
    <div>
      {error && <div style={{ background: "#FEF2F2", color: "#DC2626", padding: "10px 14px", borderRadius: 8, marginBottom: 14, fontSize: 13 }}>{error}</div>}
      <Field label="Form Title" required><TextInput value={t.title} onChange={v => set("title", v)} placeholder="Daily Hazard Assessment" /></Field>
      <div className="grid-2" style={{ gap: 12 }}>
        <Field label="Category">
          <input list="safety-categories" value={t.category || ""} onChange={e => set("category", e.target.value)} placeholder="Hazard Assessment" style={inputCls} />
          <datalist id="safety-categories">{SAFETY_CATEGORIES.map(c => <option key={c} value={c} />)}</datalist>
        </Field>
        <Field label="Repeat Schedule">
          <Select value={t.repeatSchedule || "none"} onChange={v => set("repeatSchedule", v)} options={REPEAT_SCHEDULES} />
        </Field>
      </div>
      <Field label={"Jobs this form applies to" + ((t.assignedJobs || []).length ? " (" + t.assignedJobs.length + ")" : " — leave empty for every job")}>
        {jobs.length === 0
          ? <div style={{ fontSize: 13, color: C.textMuted }}>No jobs yet.</div>
          : (
            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(200px, 1fr))", gap: 6, maxHeight: 170, overflowY: "auto" }}>
              {jobs.map(j => {
                const on = (t.assignedJobs || []).includes(j._id);
                return <Checkbox key={j._id} checked={on} label={j.jobTitle} onChange={v => set("assignedJobs", v ? [...(t.assignedJobs || []), j._id] : (t.assignedJobs || []).filter(x => x !== j._id))} />;
              })}
            </div>
          )}
      </Field>
      <div style={{ marginBottom: 10 }}><Checkbox checked={t.active !== false} onChange={v => set("active", v)} label="Active — crews can fill this out" /></div>

      <div style={{ borderTop: "1px solid " + C.border, paddingTop: 14, marginTop: 6 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
          <span style={{ fontSize: 13, fontWeight: 700 }}>Questions ({fields.length})</span>
          <button type="button" onClick={addField} style={btnOutline}>+ Add question</button>
        </div>
        {fields.length === 0 && <div style={{ fontSize: 13, color: C.textMuted, background: C.surfaceAlt, borderRadius: 8, padding: 16, textAlign: "center" }}>No questions yet — add the first one.</div>}
        {fields.map((f, i) => (
          <div key={f.id} style={{ border: "1px solid " + C.border, borderRadius: 10, padding: 12, marginBottom: 10, background: C.surfaceAlt }}>
            <div style={{ display: "flex", gap: 8, alignItems: "center", marginBottom: 8 }}>
              <span style={{ fontSize: 12, fontWeight: 800, color: C.textMuted, width: 20 }}>{i + 1}.</span>
              <input value={f.label} onChange={e => patch(i, { label: e.target.value })} placeholder="Question / item…" style={{ ...inputCls, flex: 1 }} />
              <button type="button" onClick={() => moveField(i, -1)} disabled={i === 0} title="Move up" style={{ ...btnOutline, padding: "7px 9px", opacity: i === 0 ? 0.4 : 1 }}>↑</button>
              <button type="button" onClick={() => moveField(i, 1)} disabled={i === fields.length - 1} title="Move down" style={{ ...btnOutline, padding: "7px 9px", opacity: i === fields.length - 1 ? 0.4 : 1 }}>↓</button>
              <button type="button" onClick={() => removeField(i)} title="Remove" style={{ ...btnOutline, padding: "7px 9px", color: C.destructive }}>×</button>
            </div>
            <div style={{ display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap" }}>
              <Select value={f.type} onChange={v => patch(i, { type: v })} options={SAFETY_FIELD_TYPES} style={{ width: 170 }} />
              <label style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 12, cursor: "pointer" }}>
                <input type="checkbox" checked={!!f.required} onChange={e => patch(i, { required: e.target.checked })} style={{ accentColor: C.green, cursor: "pointer" }} />
                Required
              </label>
            </div>
            {f.type === "choice" && (
              <div style={{ marginTop: 8 }}>
                <div style={{ fontSize: 11, color: C.textMuted, marginBottom: 4 }}>Choices (one per line)</div>
                <textarea
                  value={(f.options || []).join("\n")}
                  onChange={e => patch(i, { options: e.target.value.split("\n") })}
                  rows={3} placeholder={"Pass\nFail\nN/A"} style={{ ...inputCls, resize: "vertical" }}
                />
              </div>
            )}
          </div>
        ))}
      </div>

      <div style={{ display: "flex", gap: 10, marginTop: 20 }}>
        <button type="button" onClick={onCancel} style={{ ...btnOutline, flex: 1 }}>Cancel</button>
        <button type="button" onClick={save} style={{ ...btnSecondary, flex: 1 }}>Save template</button>
      </div>
    </div>
  );
}

// Small badge telling the crew whether their work is on the server yet.
// Tracks the browser's own online/offline flag so the banner below can say which
// it is. (It only reports whether there's a network at all — a "connected" phone
// with one bar and no throughput still fails; that's what the retry loop is for.)
function useOnline() {
  const [on, setOn] = useState(() => (typeof navigator.onLine === "boolean" ? navigator.onLine : true));
  useEffect(() => {
    const up = () => setOn(true), down = () => setOn(false);
    window.addEventListener("online", up);
    window.addEventListener("offline", down);
    return () => { window.removeEventListener("online", up); window.removeEventListener("offline", down); };
  }, []);
  return on;
}

const STUCK_AFTER_ATTEMPTS = 4; // a few failures is a bad signal; many is a real problem

function SyncStatusBar({ pending }) {
  const online = useOnline();
  if (!pending.length) return null;
  const stuck = online ? pending.find(p => (p.attempts || 0) >= STUCK_AFTER_ATTEMPTS && p.lastError) : null;
  return (
    <div style={{ background: stuck ? "#FEF2F2" : "#FEFCE8", border: "1px solid " + (stuck ? "#FECACA" : "#FDE68A"), color: stuck ? "#991B1B" : "#92400E", borderRadius: 10, padding: "10px 14px", marginBottom: 14, fontSize: 13, display: "flex", justifyContent: "space-between", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
      <span style={{ minWidth: 0 }}>
        {stuck ? "⚠️ " : "⏳ "}
        {pending.length} form{pending.length > 1 ? "s" : ""} saved on this device, waiting to sync{online ? "" : " — you're offline"}.
        {stuck && <div style={{ marginTop: 4, fontSize: 12 }}>The server keeps refusing the oldest one: {stuck.lastError}. Nothing is lost — show this to your office.</div>}
      </span>
      <button type="button" onClick={() => flushSafetyQueue()} style={{ ...btnOutline, padding: "5px 12px", fontSize: 12 }}>Try now</button>
    </div>
  );
}

/* ── Worker view: pick your job, fill what it needs ────────────────────────── */
function SafetyFillOut({ compact }) {
  useDataVersion();
  const pending = useSafetyQueue();
  const { user } = useAuth();
  const workerName = user?.name || "";
  const allJobs = jobsByClient(getCol("jobs"));
  // "Their current job": the jobs they're assigned to, if any — otherwise every
  // job they can see, because assignment is optional in this app.
  const myJobs = allJobs.filter(j => Array.isArray(j.assignedEmployees) && j.assignedEmployees.includes(workerName));
  const jobs = myJobs.length ? myJobs : allJobs;
  const [jobId, setJobId] = useState(() => (jobs[0] ? jobs[0]._id : ""));
  const job = jobs.find(j => j._id === jobId) || null;
  const [filling, setFilling] = useState(null);
  const [done, setDone] = useState("");

  const templates = getCol("formtemplates")
    .filter(t => t.active !== false && templateAppliesToJob(t, jobId))
    .sort((a, b) => String(a.title || "").localeCompare(String(b.title || "")));

  const finish = res => {
    setFilling(null);
    setDone(res.synced ? "Form submitted." : "Saved on this device — it'll upload when you're back in range.");
    setTimeout(() => setDone(""), 6000);
  };

  const CardW = compact ? mCard : card;

  return (
    <div>
      <SyncStatusBar pending={pending} />
      {done && <div style={{ background: "#F0FDF4", border: "1px solid #BBF7D0", color: "#166534", borderRadius: 10, padding: "10px 14px", marginBottom: 14, fontSize: 13 }}>✓ {done}</div>}

      <div style={{ ...CardW, marginBottom: 12 }}>
        <div style={{ fontSize: 11, fontWeight: 700, color: C.textMuted, textTransform: "uppercase", letterSpacing: "0.5px", marginBottom: 6 }}>Job</div>
        {jobs.length === 0
          ? <div style={{ fontSize: 13, color: C.textMuted }}>No jobs yet — forms attach to a job.</div>
          : <Select value={jobId} onChange={setJobId} options={jobs.map(j => ({ value: j._id, label: jobLabel(j) }))} style={compact ? mInput : {}} />}
        {myJobs.length > 0 && <div style={{ fontSize: 11, color: C.textMuted, marginTop: 6 }}>Showing the jobs you're assigned to.</div>}
      </div>

      {templates.length === 0
        ? <div style={{ ...CardW, textAlign: "center", color: C.textMuted, fontSize: 13, padding: "26px 16px" }}>
            No safety forms are set up for this job yet.
          </div>
        : templates.map(t => {
          const already = submissionDoneThisPeriod(t, jobId, workerName, pending);
          const period = t.repeatSchedule === "daily" ? "today" : t.repeatSchedule === "weekly" ? "this week" : "";
          return (
            <div key={t._id} style={{ ...CardW, display: "flex", justifyContent: "space-between", alignItems: "center", gap: 12, flexWrap: "wrap" }}>
              <div style={{ minWidth: 0 }}>
                <div style={{ fontSize: 15, fontWeight: 700 }}>{t.title}</div>
                <div style={{ fontSize: 12, color: C.textMuted }}>
                  {t.category || "Safety form"} · {(t.fields || []).length} question{(t.fields || []).length === 1 ? "" : "s"}
                  {period ? " · " + (t.repeatSchedule === "daily" ? "Daily" : "Weekly") : ""}
                </div>
              </div>
              {already
                ? <Badge color="#F0FDF4" textColor="#16A34A">✓ Done {period}</Badge>
                : <button type="button" onClick={() => { setFilling(t); setDone(""); }} style={{ ...btnSecondary, ...(compact ? { padding: "12px 18px", fontSize: 15 } : {}) }}>Fill out</button>}
            </div>
          );
        })}

      {filling && !compact && (
        <Modal title={filling.title} width={620} onClose={() => setFilling(null)}>
          <SafetyFormFill template={filling} job={job} workerName={workerName} workerId={user?.id} onDone={finish} onCancel={() => setFilling(null)} />
        </Modal>
      )}
      {filling && compact && (
        <MobileSheet title={filling.title} onClose={() => setFilling(null)}>
          <div style={{ padding: 16 }}>
            <div style={{ fontSize: 12, color: C.textMuted, marginBottom: 12 }}>{job ? job.jobTitle : "No job"} · {workerName}</div>
            <SafetyFormFill template={filling} job={job} workerName={workerName} workerId={user?.id} onDone={finish} onCancel={() => setFilling(null)} compact />
          </div>
        </MobileSheet>
      )}
    </div>
  );
}

/* ── Admin: submission history ─────────────────────────────────────────────── */
function SafetySubmissions() {
  useDataVersion();
  const pending = useSafetyQueue();
  const { user } = useAuth();
  const isAdmin = user?.isOwner || user?.role === "Manager";
  const [f, setF] = useState({ jobId: "", worker: "", from: "", to: "", templateId: "" });
  const [viewing, setViewing] = useState(null);
  const set = (k, v) => setF(p => ({ ...p, [k]: v }));

  const jobs = jobsByClient(getCol("jobs"));
  const templates = getCol("formtemplates");
  // A worker only ever sees their own submissions — the database enforces the
  // same rule, this just keeps the UI honest about it.
  const mine = s => s.workerName === user?.name || s.workerId === user?.id;
  const rows = getCol("formsubmissions")
    .concat(pending.map(p => ({ ...p.data, _id: p.id, _pending: true })))
    .filter(s => isAdmin || mine(s))
    .filter(s => !f.jobId || s.jobId === f.jobId)
    .filter(s => !f.templateId || s.templateId === f.templateId)
    .filter(s => !f.worker || String(s.workerName || "").toLowerCase().includes(f.worker.toLowerCase()))
    .filter(s => !f.from || (s.entryDate || "") >= f.from)
    .filter(s => !f.to || (s.entryDate || "") <= f.to)
    .sort((a, b) => String(b.submittedAt || "").localeCompare(String(a.submittedAt || "")));

  const exportCsv = () => {
    const head = ["Submitted", "Form", "Category", "Worker", "Job", "Status", "Answers"];
    const body = rows.map(s => [
      new Date(s.submittedAt).toLocaleString(), s.templateTitle || "", s.category || "", s.workerName || "", s.jobName || "",
      s._pending ? "Pending sync" : "Synced",
      (Array.isArray(s.answers) ? s.answers : []).map(a => a.label + ": " + (a.type === "checkbox" ? (a.value ? "Yes" : "No") : a.value)).join(" | "),
    ]);
    downloadFile("safety-submissions-" + today() + ".csv", toCSV([head, ...body]), "text/csv");
  };

  return (
    <div>
      <SyncStatusBar pending={pending} />
      <div style={card}>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(150px, 1fr))", gap: 10, marginBottom: 14 }}>
          <Field label="Job" style={{ marginBottom: 0 }}>
            <Select value={f.jobId} onChange={v => set("jobId", v)} placeholder="All jobs" options={jobs.map(j => ({ value: j._id, label: j.jobTitle }))} />
          </Field>
          <Field label="Form" style={{ marginBottom: 0 }}>
            <Select value={f.templateId} onChange={v => set("templateId", v)} placeholder="All forms" options={templates.map(t => ({ value: t._id, label: t.title }))} />
          </Field>
          {isAdmin && (
            <Field label="Worker" style={{ marginBottom: 0 }}>
              <TextInput value={f.worker} onChange={v => set("worker", v)} placeholder="Name…" />
            </Field>
          )}
          <Field label="From" style={{ marginBottom: 0 }}><TextInput type="date" value={f.from} onChange={v => set("from", v)} /></Field>
          <Field label="To" style={{ marginBottom: 0 }}><TextInput type="date" value={f.to} onChange={v => set("to", v)} /></Field>
        </div>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
          <span style={{ fontSize: 12, color: C.textMuted }}>{rows.length} submission{rows.length === 1 ? "" : "s"}</span>
          <div style={{ display: "flex", gap: 8 }}>
            <button type="button" onClick={() => setF({ jobId: "", worker: "", from: "", to: "", templateId: "" })} style={btnOutline}>Clear filters</button>
            <button type="button" onClick={exportCsv} disabled={!rows.length} style={{ ...btnOutline, opacity: rows.length ? 1 : 0.5 }}>Export CSV</button>
          </div>
        </div>
      </div>

      <div style={card}>
        <DataTable
          columns={[
            { key: "submittedAt", label: "Submitted", render: v => (v ? new Date(v).toLocaleString() : "—") },
            { key: "templateTitle", label: "Form" },
            { key: "workerName", label: "Worker" },
            { key: "jobName", label: "Job" },
            { key: "category", label: "Category" },
            { key: "syncStatus", label: "Status", render: (v, row) => row._pending
              ? <Badge color="#FEFCE8" textColor="#CA8A04">Pending sync</Badge>
              : <Badge color="#F0FDF4" textColor="#16A34A">Synced</Badge> },
          ]}
          rows={rows}
          onView={setViewing}
          emptyMessage="No submissions match these filters."
        />
      </div>

      {viewing && (
        <Modal title="Submission" width={620} onClose={() => setViewing(null)}>
          <SubmissionDetail sub={viewing} />
          <div style={{ marginTop: 20 }}><button type="button" onClick={() => setViewing(null)} style={{ ...btnSecondary, width: "100%" }}>Close</button></div>
        </Modal>
      )}
    </div>
  );
}

function CertBadge({ cert }) {
  const { state, days } = certState(cert);
  if (state === "expired") return <Badge color="#FEF2F2" textColor="#DC2626">Expired {Math.abs(days)}d ago</Badge>;
  if (state === "expiring") return <Badge color="#FEFCE8" textColor="#CA8A04">{days === 0 ? "Expires today" : days + "d left"}</Badge>;
  if (state === "valid") return <Badge color="#F0FDF4" textColor="#16A34A">Valid</Badge>;
  return <Badge>No expiry</Badge>;
}

/* ─── Warehouses ─────────────────────────────────────────────────────────────
   Three screens behind one nav item:

       their reorder threshold.

       exactly what's stored in it.
     • Builder   — drag/resize the racks on that plan and save.
   Reorder-threshold alerts aren't a stored flag or a cron job: every count on
   these screens is derived from live inventory the moment it renders, so a
   quantity edited anywhere in the app shows up here immediately.
──────────────────────────────────────────────────────────────────────────────*/
const clampNum = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

// What zone is this item in? The id is authoritative; the stored label is the
// fallback for rows that predate zones or came back through an export/import.
function zoneLabelFor(item) {
  if (item && item.zoneId) {
    const z = getCol("zones").find(x => x._id === item.zoneId);
    if (z) return z.label;
  }
  return (item && item.zoneLabel) || "";
}

const WAREHOUSE_FIELDS = [
  { key: "warehouseName", label: "Warehouse Name", required: true, placeholder: "Main Warehouse" },
  { key: "address", label: "Location (optional)", type: "maps", placeholder: "Address or pin (lat, lng) — fill in later if you don't know it yet" },
  { key: "contactPerson", label: "Contact Person", placeholder: "John Doe" },
  { key: "phoneNumber", label: "Phone Number", placeholder: "+1 555 000 0000" },
  { key: "capacity", label: "Total Square Footage", type: "number", placeholder: "10000" },
  { key: "description", label: "What's stored here", type: "textarea", placeholder: "General notes — staging area, spare parts bin, bulk materials not tracked as line-item stock…" },
  { key: "customFields", label: "Additional Details", type: "customFields", hint: "Gate code, landlord, hours, a quirk worth remembering… whatever's useful, no fixed list." },
  { key: "isActive", label: "Currently active", type: "boolean" },
];

/* Floor plan renderer. Read-only by default; the builder passes `editable` plus
   an onDragStart so the very same boxes can be dragged and resized. */
function LayoutCanvas({ layout, zones, cell = 34, selectedKey, onSelect, editable, onDragStart, mini }) {
  const { cols, rows } = layout;
  return (
    <div className="scroll-x" style={{ paddingBottom: 2 }}>
      <div
        style={{
          position: "relative", width: cols * cell, height: rows * cell, flexShrink: 0,
          background: C.surface, borderRadius: mini ? 6 : 10, border: "1px solid " + C.border,
          backgroundImage: "linear-gradient(to right, #EFF1F4 1px, transparent 1px), linear-gradient(to bottom, #EFF1F4 1px, transparent 1px)",
          backgroundSize: cell + "px " + cell + "px",
          touchAction: editable ? "none" : "auto",
        }}
      >
        {zones.length === 0 && !mini && (
          <div style={{ position: "absolute", inset: 0, display: "flex", alignItems: "center", justifyContent: "center", color: C.textMuted, fontSize: 13, textAlign: "center", padding: 20 }}>
            {editable ? "Add a rack, then drag it where it belongs." : "No storage zones drawn yet — use Edit layout to lay this place out."}
          </div>
        )}
        {zones.map(z => {
          const key = z._key || z._id;
          const used = z._new ? 0 : zoneUsed(z);
          const cap = num(z.capacity);
          const over = cap > 0 && used > cap;
          const hasLow = !z._new && itemsInZone(z).some(isLowStock);
          const sel = selectedKey === key;
          return (
            <div
              key={key}
              onPointerDown={editable ? e => onDragStart(e, z, "move") : undefined}
              onClick={editable ? undefined : () => onSelect && onSelect(key)}
              title={(z.label || "Untitled") + (cap > 0 ? " — " + used.toLocaleString() + " of " + cap.toLocaleString() : "")}
              style={{
                position: "absolute", left: z.x * cell + 1, top: z.y * cell + 1,
                width: Math.max(2, z.w * cell - 2), height: Math.max(2, z.h * cell - 2),
                boxSizing: "border-box", borderRadius: mini ? 3 : 6, padding: mini ? 0 : 4, overflow: "hidden",
                background: ZONE_FILL[z.kind] || ZONE_FILL.Other,
                border: (mini ? 1 : 2) + "px solid " + (sel ? C.accent : over ? C.destructive : hasLow ? "#F59E0B" : (ZONE_EDGE[z.kind] || ZONE_EDGE.Other)),
                boxShadow: sel ? "0 0 0 3px rgba(99,102,241,0.25)" : "none",
                cursor: editable ? "move" : (mini ? "default" : "pointer"),
                display: "flex", flexDirection: "column", justifyContent: "space-between",
                userSelect: "none", touchAction: editable ? "none" : "auto",
              }}
            >
              {!mini && (
                <React.Fragment>
                  <div style={{ fontSize: 11, fontWeight: 800, color: C.text, lineHeight: 1.15, wordBreak: "break-word" }}>{z.label || "Untitled"}</div>
                  <div style={{ fontSize: 10, fontWeight: 700, color: over ? C.destructive : C.textMuted, whiteSpace: "nowrap" }}>
                    {cap > 0 ? used.toLocaleString() + " / " + cap.toLocaleString() : used.toLocaleString()}{hasLow ? " ⚠️" : ""}
                  </div>
                </React.Fragment>
              )}
              {editable && (
                <div
                  onPointerDown={e => onDragStart(e, z, "resize")}
                  title="Drag to resize"
                  style={{ position: "absolute", right: -1, bottom: -1, width: 14, height: 14, background: C.accent, borderRadius: "5px 0 4px 0", cursor: "nwse-resize", touchAction: "none" }}
                />
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* Drag-and-drop grid editor. Everything happens on a local draft; nothing is
   written until Save, so an accidental drag costs nothing. */
function WarehouseLayoutBuilder({ warehouse, onDone }) {
  const CELL = 34;
  const original = useMemo(() => zonesForWarehouse(warehouse), [warehouse._id]);
  const [layout, setLayout] = useState(() => whLayout(warehouse));
  const [draft, setDraft] = useState(() => original.map(z => ({ ...z, _key: z._id })));
  const [selectedKey, setSelectedKey] = useState(null);
  // Drag handlers and the grid steppers both need the CURRENT grid, not the one
  // captured when they were created — a ref keeps them right even when several
  // updates land before React re-renders.
  const layoutRef = useRef(layout);
  layoutRef.current = layout;

  const selected = draft.find(z => z._key === selectedKey) || null;
  const patch = (key, p) => setDraft(list => list.map(z => (z._key === key ? { ...z, ...p } : z)));

  // First free cell, scanning top-left to bottom-right, so a new rack never
  // lands on top of one that's already placed.
  const freeSpot = (w, h) => {
    const overlaps = (x, y) => draft.some(z => x < z.x + z.w && x + w > z.x && y < z.y + z.h && y + h > z.y);
    for (let y = 0; y + h <= layoutRef.current.rows; y++)
      for (let x = 0; x + w <= layoutRef.current.cols; x++)
        if (!overlaps(x, y)) return { x, y };
    return { x: 0, y: 0 };
  };

  const addZone = kind => {
    const w = Math.min(3, layout.cols);
    const spot = freeSpot(w, 1);
    const key = genId();
    const n = draft.filter(z => (z.kind || "Rack") === kind).length + 1;
    setDraft(list => [...list, { _key: key, _new: true, label: kind + " " + n, kind, capacity: "", x: spot.x, y: spot.y, w, h: 1 }]);
    setSelectedKey(key);
  };

  const startDrag = (e, z, mode) => {
    e.preventDefault();
    e.stopPropagation();
    setSelectedKey(z._key);
    const start = { sx: e.clientX, sy: e.clientY, x: z.x, y: z.y, w: z.w, h: z.h };
    const move = ev => {
      const dx = Math.round((ev.clientX - start.sx) / CELL);
      const dy = Math.round((ev.clientY - start.sy) / CELL);
      const g = layoutRef.current;
      setDraft(list => list.map(item => {
        if (item._key !== z._key) return item;
        if (mode === "move") {
          return { ...item, x: clampNum(start.x + dx, 0, g.cols - item.w), y: clampNum(start.y + dy, 0, g.rows - item.h) };
        }
        return { ...item, w: clampNum(start.w + dx, 1, g.cols - item.x), h: clampNum(start.h + dy, 1, g.rows - item.y) };
      }));
    };
    const up = () => {
      window.removeEventListener("pointermove", move);
      window.removeEventListener("pointerup", up);
      window.removeEventListener("pointercancel", up);
    };
    window.addEventListener("pointermove", move);
    window.addEventListener("pointerup", up);
    window.addEventListener("pointercancel", up);
  };

  // Growing the grid is free; shrinking it pulls any zone that would fall off
  // the edge back inside instead of losing it.
  const setGrid = (key, delta) => {
    const next = { ...layoutRef.current, [key]: clampNum(layoutRef.current[key] + delta, 4, 60) };
    layoutRef.current = next;
    setLayout(next);
    setDraft(list => list.map(z => {
      const w = clampNum(z.w, 1, next.cols);
      const h = clampNum(z.h, 1, next.rows);
      return { ...z, w, h, x: clampNum(z.x, 0, next.cols - w), y: clampNum(z.y, 0, next.rows - h) };
    }));
  };

  const removeZone = async z => {
    const held = z._new ? 0 : itemsInZone(z).length;
    if (held > 0) {
      const ok = await confirmDialog(
        "“" + (z.label || "This zone") + "” holds " + held + " item" + (held === 1 ? "" : "s") +
        ". Deleting the zone leaves what's in it unassigned — the stock itself is kept.",
        { confirmLabel: "Delete zone" });
      if (!ok) return;
    }
    setDraft(list => list.filter(x => x._key !== z._key));
    setSelectedKey(null);
  };

  const save = () => {
    const kept = new Set(draft.filter(z => z._id).map(z => z._id));
    // Zones taken off the plan: release whatever they held, then delete.
    original.forEach(z => {
      if (kept.has(z._id)) return;
      itemsInZone(z).forEach(i => db.update("inventory", { ...i, zoneId: "", zoneLabel: "" }));
      db.remove("zones", z._id);
    });
    draft.forEach(z => {
      const body = {
        warehouseId: warehouse._id,
        warehouseName: warehouse.warehouseName,
        label: String(z.label || "").trim() || "Untitled",
        kind: z.kind || "Rack",
        capacity: (z.capacity === "" || z.capacity === undefined || z.capacity === null) ? "" : num(z.capacity),
        x: z.x, y: z.y, w: z.w, h: z.h,
      };
      if (!z._id) { db.create("zones", body); return; }
      db.update("zones", { _id: z._id, ...body });
      // A renamed zone drags its label along on the items it holds, so the
      // plain-text fallback match never points at a name that's gone.
      if (z.label !== (original.find(o => o._id === z._id) || {}).label) {
        itemsInZone(z).forEach(i => db.update("inventory", { ...i, zoneLabel: body.label }));
      }
    });
    db.update("warehouses", { ...warehouse, layout: { cols: layout.cols, rows: layout.rows } });
    onDone();
  };

  const stepper = (label, key) => (
    <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
      <button type="button" onClick={() => setGrid(key, -1)} style={{ ...btnOutline, padding: "4px 10px" }}>−</button>
      <span style={{ fontSize: 12, fontWeight: 700, minWidth: 62, textAlign: "center" }}>{layout[key]} {label}</span>
      <button type="button" onClick={() => setGrid(key, 1)} style={{ ...btnOutline, padding: "4px 10px" }}>+</button>
    </div>
  );

  return (
    <div>
      <PageHeader
        title="Layout Builder"
        subtitle={warehouse.warehouseName + " — drag racks to place them, drag the corner to resize"}
        action={
          <div style={{ display: "flex", gap: 8 }}>
            <button type="button" onClick={onDone} style={btnOutline}>Cancel</button>
            <button type="button" onClick={save} style={btnSecondary}>Save Layout</button>
          </div>
        }
      />

      <div style={card}>
        <div style={{ display: "flex", gap: 10, flexWrap: "wrap", alignItems: "center", marginBottom: 14 }}>
          <Select value="" onChange={v => v && addZone(v)} options={ZONE_KINDS} placeholder="+ Add zone…" style={{ maxWidth: 190 }} />
          <div style={{ flex: 1 }} />
          {stepper("wide", "cols")}
          {stepper("deep", "rows")}
        </div>

        <LayoutCanvas
          layout={layout} zones={draft} cell={CELL}
          selectedKey={selectedKey} editable onDragStart={startDrag}
        />
        <ZoneLegend />
      </div>

      <div style={card}>
        <h3 style={{ fontSize: 14, fontWeight: 700, marginBottom: 10 }}>
          {selected ? "Selected zone" : "Zone settings"}
        </h3>
        {!selected
          ? <p style={{ color: C.textMuted, fontSize: 13 }}>Click a zone on the plan to rename it, set its capacity, or remove it.</p>
          : (
            <div>
              <div className="grid-3" style={{ gap: 12 }}>
                <Field label="Label">
                  <TextInput value={selected.label} onChange={v => patch(selected._key, { label: v })} placeholder="Rack A3" />
                </Field>
                <Field label="Type">
                  <Select value={selected.kind || "Rack"} onChange={v => patch(selected._key, { kind: v })} options={ZONE_KINDS} />
                </Field>
                <Field label="Capacity (units held)">
                  <TextInput type="number" value={selected.capacity} onChange={v => patch(selected._key, { capacity: v })} placeholder="Optional" />
                </Field>
              </div>
              <div style={{ fontSize: 12, color: C.textMuted, marginBottom: 12 }}>
                Position {selected.x}, {selected.y} · {selected.w} × {selected.h} cells
                {selected._new ? " · not saved yet" : " · holds " + itemsInZone(selected).length + " item(s)"}
              </div>
              <button type="button" onClick={() => removeZone(selected)} style={btnDanger}>Delete zone</button>
            </div>
          )}
      </div>
    </div>
  );
}

/* One warehouse: its plan, what each rack holds, and what needs reordering. */
function WarehouseDetail({ warehouse, onBack, onEdit, onBuild }) {
  const [selectedZoneId, setSelectedZoneId] = useState(null);
  const [assignId, setAssignId] = useState("");
  const [, bump] = useState(0);
  const refresh = () => bump(x => x + 1);

  const wh = db.getById("warehouses", warehouse._id) || warehouse;
  const s = warehouseStats(wh);
  const layout = whLayout(wh);
  const zone = s.zones.find(z => z._id === selectedZoneId) || null;
  const zoneItems = zone ? itemsInZone(zone) : [];
  const zoneCap = zone ? num(zone.capacity) : 0;
  const zoneFill = zone ? zoneUsed(zone) : 0;
  const equipmentHere = getCol("equipment").filter(e => (e.warehouse || "") === wh.warehouseName);

  const assign = () => {
    const item = db.getById("inventory", assignId);
    if (!item || !zone) return;
    db.update("inventory", { ...item, warehouse: wh.warehouseName, zoneId: zone._id, zoneLabel: zone.label });
    setAssignId("");
    refresh();
  };

  const field = (label, node) => node ? (
    <div style={{ marginBottom: 12 }}>
      <div style={{ fontSize: 10, fontWeight: 700, color: C.textMuted, textTransform: "uppercase", letterSpacing: "0.5px" }}>{label}</div>
      <div style={{ fontSize: 14 }}>{node}</div>

  const stockCols = [

    { key: "sku", label: "SKU", render: v => v || "—" },

        <span style={{ display: "flex", alignItems: "center", gap: 6, whiteSpace: "nowrap" }}>
          {num(v).toLocaleString() + " " + (row.unitOfMeasure || "units")}
          {isLowStock(row) && <Badge color="#FEF2F2" textColor="#DC2626">Low</Badge>}

    { key: "unitPrice", label: "Unit Price", render: money },

  return (
    <div>
      <button type="button" onClick={onBack} style={{ ...btnOutline, marginBottom: 14, padding: "6px 12px" }}>← All warehouses</button>
      <PageHeader
        title={wh.warehouseName}
        subtitle={wh.address || "No location set"}
        action={
          <div style={{ display: "flex", gap: 8 }}>
            <button type="button" onClick={onEdit} style={btnOutline}>Edit details</button>
            <button type="button" onClick={onBuild} style={btnSecondary}>✏️ Edit layout</button>
          </div>
        }
      />

      <div className="grid-3" style={{ marginBottom: 16 }}>
        <StatCard label="Capacity Used" value={s.pct === null ? "—" : s.pct + "%"} />
        <StatCard label="Storage Zones" value={s.zones.length} />
        <StatCard label="Low Stock" value={s.low.length} />
      </div>
      <div className="grid-3" style={{ marginBottom: 20 }}>
        <StatCard label="Items Stored" value={s.stock.length} />
        <StatCard label="Stock Value" value={fmt(s.value)} />
        <StatCard label="Total Square Footage" value={wh.capacity ? num(wh.capacity).toLocaleString() + " sq ft" : "—"} />
      </div>

      {s.low.length > 0 && (
        <div style={{ ...card, background: "#FEF2F2", border: "1px solid #FECACA" }}>
          <h3 style={{ fontSize: 14, fontWeight: 700, marginBottom: 10, color: "#991B1B" }}>
            ⚠️ Below reorder threshold ({s.low.length})
          </h3>
          <DataTable
            columns={[
              { key: "materialName", label: "Item" },
              { key: "sku", label: "SKU", render: v => v || "—" },
              { key: "_zone", label: "Zone", render: (_v, row) => zoneLabelFor(row) || "Unassigned" },
              { key: "currentStock", label: "On Hand", render: (v, row) => num(v).toLocaleString() + " " + (row.unitOfMeasure || "units") },
              { key: "reorderPoint", label: "Reorder At", render: v => num(v).toLocaleString() },
              { key: "supplier", label: "Supplier", render: v => v || "—" },
            ]}
            rows={s.low}
            emptyMessage="Nothing low."
          />
        </div>
      )}

      <div style={card}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 10, marginBottom: 12 }}>

          <span style={{ fontSize: 12, color: C.textMuted }}>
            {s.zones.length > 0 ? "Click a zone to see what's stored in it" : "Nothing laid out yet"}
          </span>
        </div>
        <LayoutCanvas layout={layout} zones={s.zones} selectedKey={selectedZoneId} onSelect={id => { setSelectedZoneId(id === selectedZoneId ? null : id); setAssignId(""); }} />
        {s.zones.length > 0 && <ZoneLegend />}
      </div>

      {zone && (
        <div style={{ ...card, border: "2px solid " + C.accent }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", flexWrap: "wrap", gap: 10, marginBottom: 12 }}>

              <div style={{ fontSize: 17, fontWeight: 800 }}>{zone.label}</div>
              <div style={{ fontSize: 12, color: C.textMuted, marginTop: 2 }}>
                {zone.kind || "Zone"} · {zone.w} × {zone.h} cells
                {zoneCap > 0 ? " · " + zoneFill.toLocaleString() + " of " + zoneCap.toLocaleString() + " capacity" : " · " + zoneFill.toLocaleString() + " units held"}

            </div>

            <div style={{ height: 8, borderRadius: 999, background: C.surfaceAlt, overflow: "hidden", marginBottom: 14 }}>
              <div style={{
                width: Math.min(100, Math.round((zoneFill / zoneCap) * 100)) + "%", height: "100%",
                background: zoneFill > zoneCap ? C.destructive : (zoneFill / zoneCap >= 0.85 ? "#F59E0B" : C.green),
              }} />
            </div>
          )}

          <DataTable
            columns={stockCols}
            rows={zoneItems}
            onDelete={item => unassign(item)}
            emptyMessage="Nothing stored in this zone yet."
          />
          {zoneItems.length > 0 && (
            <div style={{ fontSize: 11, color: C.textMuted, marginTop: 6 }}>“Del” takes an item out of this zone — it does not delete the stock.</div>
          )}

          <div style={{ marginTop: 14, paddingTop: 14, borderTop: "1px solid " + C.border }}>
            <div style={{ fontSize: 12, fontWeight: 700, color: C.textMuted, textTransform: "uppercase", letterSpacing: "0.5px", marginBottom: 8 }}>Put stock in this zone</div>
            {s.unassigned.length === 0
              ? <p style={{ fontSize: 13, color: C.textMuted }}>Every item in this warehouse is already assigned to a zone. Add new materials on the Inventory page.</p>
              : (
                <div style={{ display: "flex", gap: 10, flexWrap: "wrap", alignItems: "center" }}>
                  <Select
                    value={assignId} onChange={setAssignId} placeholder="Unassigned stock here…"
                    options={s.unassigned.map(i => ({ value: i._id, label: i.materialName + " (" + num(i.currentStock).toLocaleString() + " " + (i.unitOfMeasure || "units") + ")" }))}
                    style={{ maxWidth: 320 }}
                  />
                  <button type="button" onClick={assign} disabled={!assignId} style={{ ...btnSecondary, opacity: assignId ? 1 : 0.5 }}>Assign</button>
                </div>
              )}
          </div>
        </div>
      )}

      <div style={card}>
        <h3 style={{ fontSize: 14, fontWeight: 700, marginBottom: 10 }}>Unassigned Stock ({s.unassigned.length})</h3>
        {s.unassigned.length === 0
          ? <p style={{ color: C.textMuted, fontSize: 13 }}>Everything stored here has a zone.</p>
          : (
            <React.Fragment>
              <p style={{ color: C.textMuted, fontSize: 13, marginBottom: 10 }}>
                {s.zones.length === 0
                  ? "In this warehouse, but there's no floor plan to place it on yet — use Edit layout to draw one."
                  : "In this warehouse but not placed on the plan yet — pick a zone above and assign them, or set the zone on the Inventory page."}
              </p>
              <DataTable columns={stockCols} rows={s.unassigned} emptyMessage="None." />
            </React.Fragment>
          )}
      </div>

      <div style={card}>
        <h3 style={{ fontSize: 14, fontWeight: 700, marginBottom: 10 }}>Equipment Here ({equipmentHere.length})</h3>
        {equipmentHere.length === 0
          ? <p style={{ color: C.textMuted, fontSize: 13 }}>No equipment assigned to this warehouse yet — set it on the Equipment page.</p>
          : (
            <DataTable
              columns={[
                { key: "equipmentName", label: "Name" },
                { key: "equipmentType", label: "Type" },
                { key: "totalHours", label: "Engine Hrs", render: v => (v || v === 0) ? num(v).toLocaleString() : "—" },
              ]}
              rows={equipmentHere}
              emptyMessage="No equipment."
            />
          )}
      </div>

      <div style={card}>
        <h3 style={{ fontSize: 14, fontWeight: 700, marginBottom: 10 }}>Details</h3>
        <div style={{ marginBottom: 12 }}>
          {wh.isActive !== false ? <Badge color="#F0FDF4" textColor="#16A34A">Active</Badge> : <Badge color="#FEF2F2" textColor="#DC2626">Inactive</Badge>}
        </div>
        <div className="grid-2" style={{ gap: 8 }}>
          {field("Contact", wh.contactPerson)}
          {field("Phone", wh.phoneNumber)}
        </div>
        {wh.address && field("Location", (
          <div style={{ display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
            <span>{wh.address}</span>
            <a href={mapsUrl(wh.address)} target="_blank" rel="noopener noreferrer" style={{ ...btnOutline, textDecoration: "none", padding: "6px 12px" }}>🗺️ Open in Maps</a>
          </div>
        ))}
        {field("What's stored here", wh.description)}
        {Array.isArray(wh.customFields) && wh.customFields.some(r => r.label || r.value) && (
          <div className="grid-2" style={{ gap: 8 }}>
            {wh.customFields.filter(r => r.label || r.value).map((r, i) => <React.Fragment key={i}>{field(r.label || "Detail", r.value)}</React.Fragment>)}
          </div>
        )}
      </div>
    </div>
  );
}

function WarehousesPage() {
  const [openId, setOpenId] = useState(null);
  const [builderId, setBuilderId] = useState(null);
  const [modal, setModal] = useState(null);
  const [, bump] = useState(0);
  const reload = () => bump(x => x + 1);

  const warehouses = getCol("warehouses");
  const openWh = openId ? db.getById("warehouses", openId) : null;
  const buildWh = builderId ? db.getById("warehouses", builderId) : null;

  const saveWarehouse = async data => {
    const ll = await resolveLatLng(data.address);
    const payload = { ...data, addressLat: ll ? ll.lat : null, addressLng: ll ? ll.lng : null };
    if (modal.mode === "edit") {
      const prev = db.getById("warehouses", data._id);
      db.update("warehouses", payload);
      // Zones, stock and equipment are matched to a warehouse by name as well
      // as by id — carry a rename through so nothing here gets orphaned.
      if (prev && prev.warehouseName !== payload.warehouseName) {
        getCol("zones").filter(z => z.warehouseId === data._id || z.warehouseName === prev.warehouseName)
          .forEach(z => db.update("zones", { ...z, warehouseId: data._id, warehouseName: payload.warehouseName }));
        getCol("inventory").filter(i => i.warehouse === prev.warehouseName)
          .forEach(i => db.update("inventory", { ...i, warehouse: payload.warehouseName }));
        getCol("equipment").filter(e => e.warehouse === prev.warehouseName)
          .forEach(e => db.update("equipment", { ...e, warehouse: payload.warehouseName }));
      }
    } else {
      db.create("warehouses", payload);
    }
    setModal(null);
    reload();
  };

  const del = async wh => {
    const zones = zonesForWarehouse(wh);
    const stock = stockForWarehouse(wh);
    const warn = "Delete “" + wh.warehouseName + "”? This can't be undone."
      + (zones.length ? " Its " + zones.length + " storage zone" + (zones.length === 1 ? "" : "s") + " go with it." : "")
      + (stock.length ? " The " + stock.length + " item" + (stock.length === 1 ? "" : "s") + " stored here stay in Inventory — the stock is kept, only its zone is cleared." : "");
    if (!(await confirmDialog(warn))) return;
    zones.forEach(z => {
      itemsInZone(z).forEach(i => db.update("inventory", { ...i, zoneId: "", zoneLabel: "" }));
      db.remove("zones", z._id);
    });
    db.remove("warehouses", wh._id);

const emptyItem = () => ({ id: genId(), description: "", unit: "", qty: 1, rate: 0, taxable: true });

// True when rich-text HTML has real content (not just empty tags / whitespace).
function hasRichContent(html) {
  if (!html) return false;
  const stripped = html.replace(/<(br|hr)\s*\/?>/gi, "").replace(/<[^>]*>/g, "").replace(/&nbsp;/gi, " ");
  return stripped.trim().length > 0;
}

function calcTotals(doc) {
  const items = Array.isArray(doc.items) ? doc.items : [];
  const lineTotal = it => num(it.qty) * num(it.rate);
  const subtotal = items.reduce((s, it) => s + lineTotal(it), 0);
  const taxableSubtotal = items.filter(i => i.taxable).reduce((s, it) => s + lineTotal(it), 0);
  const discountAmt = doc.discountType === "percent"
    ? subtotal * (num(doc.discount) / 100)
    : Math.min(num(doc.discount), subtotal);
  const afterDiscount = subtotal - discountAmt;
  // Spread the discount proportionally across taxable lines.
  const taxBase = subtotal > 0 ? taxableSubtotal * (1 - discountAmt / subtotal) : 0;
  const taxAmt = taxBase * (num(doc.taxRate) / 100);
  return { subtotal, discountAmt, taxAmt, total: afterDiscount + taxAmt };
}

/* ─── Rich text (Word-style) document editor ─────────────────────────────── */
// A lightweight contenteditable editor with a formatting toolbar. Uses
// document.execCommand — deprecated but supported everywhere and dependency-free,
// which suits this fully-offline app. The HTML is written by the app's own user
// and only ever rendered back to that same user, so no external sanitizer is needed.
const RTE_TOOLS = [
  { cmd: "formatBlock", value: "<h2>", label: "H1", title: "Large heading", style: { fontWeight: 800 } },
  { cmd: "formatBlock", value: "<h3>", label: "H2", title: "Small heading", style: { fontWeight: 700 } },
  { cmd: "formatBlock", value: "<p>", label: "¶", title: "Normal text" },
  { sep: true },
  { cmd: "bold", label: "B", title: "Bold", style: { fontWeight: 800 } },
  { cmd: "italic", label: "I", title: "Italic", style: { fontStyle: "italic" } },
  { cmd: "underline", label: "U", title: "Underline", style: { textDecoration: "underline" } },
  { sep: true },
  { cmd: "insertUnorderedList", label: "• List", title: "Bulleted list" },
  { cmd: "insertOrderedList", label: "1. List", title: "Numbered list" },
  { sep: true },
  { cmd: "justifyLeft", label: "⇤", title: "Align left" },
  { cmd: "justifyCenter", label: "≡", title: "Align center" },
  { cmd: "justifyRight", label: "⇥", title: "Align right" },
  { sep: true },
  { cmd: "removeFormat", label: "Clear", title: "Clear formatting" },
];

function RichTextEditor({ html, onChange, placeholder = "Start typing…", minHeight = 220 }) {
  const ref = useRef(null);

  // Load incoming HTML only when it differs, so we don't clobber the caret on every keystroke.
  useEffect(() => {
    if (ref.current && ref.current.innerHTML !== (html || "")) {
      ref.current.innerHTML = html || "";
    }
  }, [html]);

  const exec = (cmd, value) => {
    ref.current.focus();
    try { document.execCommand(cmd, false, value); } catch { /* unsupported command */ }
    onChange(ref.current.innerHTML);
  };

  const isEmpty = !html || html === "<br>" || html.replace(/<[^>]*>/g, "").trim() === "";

  return (
    <div style={{ border: "1px solid " + C.border, borderRadius: 10, overflow: "hidden", background: C.surface }}>
      <div style={{ display: "flex", flexWrap: "wrap", gap: 2, padding: "6px 8px", background: C.surfaceAlt, borderBottom: "1px solid " + C.border }}>
        {RTE_TOOLS.map((t, i) => t.sep
          ? <div key={"sep" + i} style={{ width: 1, background: C.border, margin: "2px 4px" }} />
          : (
            <button
              key={t.label + i}
              type="button"
              title={t.title}
              // onMouseDown (not click) so the editor keeps its text selection.
              onMouseDown={e => { e.preventDefault(); exec(t.cmd, t.value); }}
              style={{ minWidth: 30, height: 28, padding: "0 8px", background: C.surface, border: "1px solid " + C.border, borderRadius: 6, cursor: "pointer", fontSize: 12, color: C.text, ...t.style }}
            >
              {t.label}
            </button>
          ))}
      </div>
      <div style={{ position: "relative" }}>
        {isEmpty && (
          <div style={{ position: "absolute", top: 14, left: 16, color: C.textMuted, fontSize: 14, pointerEvents: "none" }}>
            {placeholder}
          </div>
        )}
        <div
          ref={ref}
          contentEditable
          suppressContentEditableWarning
          onInput={e => onChange(e.currentTarget.innerHTML)}
          className="rte-surface"
          style={{ minHeight, padding: "12px 16px", fontSize: 14, lineHeight: 1.7, color: C.text, outline: "none" }}
        />
      </div>
    </div>
  );
}

// Reusable document templates: save the current scope write-up under a name,
// then drop it into any future quote. Stored in the "doctemplates" collection so
// it rides along in Settings → Export/Import backups.
function DocumentTemplates({ doc, update }) {
  const [templates, setTemplates] = useState(() => db.getAll("doctemplates").items);
  const [saveOpen, setSaveOpen] = useState(false);
  const [manageOpen, setManageOpen] = useState(false);
  const [name, setName] = useState("");
  const reload = () => setTemplates(db.getAll("doctemplates").items);

  const canSave = hasRichContent(doc.documentHtml);

  const insert = async (id) => {
    const t = db.getById("doctemplates", id);
    if (!t) return;
    if (hasRichContent(doc.documentHtml) &&
        !(await confirmDialog('Replace the current document with the template "' + t.name + '"?', { confirmLabel: "Replace", tone: "primary" }))) return;
    update({ documentTitle: t.title || doc.documentTitle, documentHtml: t.html || "" });
  };

  const commitSave = () => {
    if (!name.trim()) return;
    db.create("doctemplates", { name: name.trim(), title: doc.documentTitle || "Scope of Work", html: doc.documentHtml });
    setName("");
    setSaveOpen(false);
    reload();
  };

  const del = async (t) => {
    if (await confirmDialog('Delete template "' + t.name + '"?')) { db.remove("doctemplates", t._id); reload(); }
  };

  return (
    <div style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center", marginBottom: 10 }}>
      {templates.length > 0 && (
        <select
          value=""
          onChange={e => { if (e.target.value) insert(e.target.value); e.target.value = ""; }}
          style={{ ...inputCls, width: "auto", minWidth: 200, flex: "0 1 auto" }}
        >
          <option value="">Insert a saved template…</option>
          {templates.map(t => <option key={t._id} value={t._id}>{t.name}</option>)}
        </select>
      )}
      <button
        type="button"
        onClick={() => { setName(doc.documentTitle || ""); setSaveOpen(true); }}
        disabled={!canSave}
        title={canSave ? "Save this document as a reusable template" : "Type some content first"}
        style={{ ...btnOutline, opacity: canSave ? 1 : 0.5, cursor: canSave ? "pointer" : "not-allowed" }}
      >
        💾 Save as Template
      </button>
      {templates.length > 0 && (
        <button type="button" onClick={() => setManageOpen(true)} style={{ ...btnOutline, fontSize: 12, padding: "7px 12px" }}>
          Manage ({templates.length})
        </button>
      )}

      {saveOpen && (
        <Modal title="Save Document Template" width={440} onClose={() => setSaveOpen(false)}>
          <Field label="Template Name" required>
            <TextInput value={name} onChange={setName} placeholder="e.g. Standard Excavation Scope" />
          </Field>
          <p style={{ fontSize: 12, color: C.textMuted, margin: "0 0 16px" }}>
            Saves the current heading and formatted document so you can reuse it on future quotes.
          </p>
          <div style={{ display: "flex", gap: 10 }}>
            <button type="button" onClick={() => setSaveOpen(false)} style={{ ...btnOutline, flex: 1 }}>Cancel</button>
            <button type="button" onClick={commitSave} disabled={!name.trim()} style={{ ...btnSecondary, flex: 1, opacity: name.trim() ? 1 : 0.5 }}>Save Template</button>
          </div>
        </Modal>
      )}

      {manageOpen && (
        <Modal title="Document Templates" width={520} onClose={() => setManageOpen(false)}>
          {templates.length === 0
            ? <p style={{ color: C.textMuted, fontSize: 13 }}>No templates saved yet.</p>
            : templates.map(t => (
              <div key={t._id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 12, padding: "10px 12px", border: "1px solid " + C.border, borderRadius: 8, marginBottom: 8 }}>
                <div style={{ minWidth: 0 }}>
                  <div style={{ fontSize: 13, fontWeight: 700 }}>{t.name}</div>
                  <div style={{ fontSize: 11, color: C.textMuted, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
                    {t.title} — {(t.html || "").replace(/<[^>]*>/g, " ").replace(/\s+/g, " ").trim().slice(0, 60) || "empty"}
                  </div>
                </div>
                <div style={{ display: "flex", gap: 6, flexShrink: 0 }}>
                  <button type="button" onClick={() => { insert(t._id); setManageOpen(false); }} style={{ ...btnOutline, fontSize: 12, padding: "5px 10px" }}>Insert</button>
                  <button type="button" onClick={() => del(t)} style={{ ...btnDanger, padding: "5px 10px" }}>Delete</button>
                </div>
              </div>
            ))}
          <button type="button" onClick={() => setManageOpen(false)} style={{ ...btnOutline, width: "100%", marginTop: 8 }}>Done</button>
        </Modal>
      )}
    </div>
  );
}

function LogoUpload({ logo, onChange }) {
  const ref = useRef(null);
  const handleFile = e => {
    const file = e.target.files && e.target.files[0];

// Customer-facing photos for the printed quote: the images an owner/manager
// flagged "Show to customer" on the referenced job. Loaded as data URLs so they
// embed in the saved/printed PDF (no dependence on a signed URL that expires).
function AuthorizedPhotos({ jobReference }) {
  const [photos, setPhotos] = useState(null);
  useEffect(() => {
    let alive = true;
    (async () => {
      const ref = (jobReference || "").trim();
      const job = ref ? getCol("jobs").find(j => (j.jobTitle || "").trim() === ref) : null;
      if (!job) { if (alive) setPhotos([]); return; }
      const imgs = getCol("job_media").filter(m => m.jobId === job._id && m.type === "image" && m.customerVisible);
      if (!imgs.length) { if (alive) setPhotos([]); return; }
      const withData = await Promise.all(imgs.map(async m => ({ ...m, url: await bmbMedia.dataUrl(m.path) })));
      if (alive) setPhotos(withData.filter(p => p.url));
    })();
    return () => { alive = false; };
  }, [jobReference]);

  if (!photos || photos.length === 0) return null;
  return (
    <div style={{ paddingTop: 24, marginBottom: 8, borderTop: "1px solid #E2E8F0" }}>
      <div style={{ fontSize: 16, fontWeight: 800, color: "#0F172A", marginBottom: 12 }}>Job Photos</div>

function QuoteEditor({ docId, onClose, startPreview }) {
  const { company } = useCompany();
  const [doc, setDoc] = useState(() => (docId && db.getById("quotes", docId)) || defaultDoc(company));
  const [savedId, setSavedId] = useState(docId || null);
  const [preview, setPreview] = useState(!!startPreview);
  const [saved, setSaved] = useState(false);
  const clients = useMemo(() => db.getAll("clients").items, []);
  const jobs = useMemo(() => db.getAll("jobs").items, []);

  const update = patch => setDoc(d => ({ ...d, ...patch }));
  const updateFrom = patch => setDoc(d => ({ ...d, from: { ...d.from, ...patch } }));
  const updateTo = patch => setDoc(d => ({ ...d, to: { ...d.to, ...patch } }));
  const updateItems = items => setDoc(d => ({ ...d, items }));
  const updateItem = (id, field, val) => setDoc(d => ({ ...d, items: d.items.map(it => (it.id === id ? { ...it, [field]: val } : it)) }));

  const totals = calcTotals(doc);

  const handleSave = () => {
    const toSave = { ...doc, totalAmount: totals.total, clientReference: doc.to.name };
    if (savedId) {
      db.update("quotes", { ...toSave, _id: savedId });
    } else {
      const rec = db.create("quotes", toSave);
      setSavedId(rec._id);
    }
    setSaved(true);
    setTimeout(() => setSaved(false), 2000);
  };

  const pickClient = (name) => {
    const c = clients.find(x => x.clientName === name);
    if (!c) { updateTo({ name }); return; }
    updateTo({ name: c.clientName, email: c.emailAddress || "", phone: c.phoneNumber || "", address: c.billingAddress || "" });
  };

  const sectionTitle = t => (
    <div style={{ fontSize: 12, fontWeight: 700, color: C.accent, marginBottom: 12, paddingBottom: 6, borderBottom: "2px solid " + C.accent, textTransform: "uppercase", letterSpacing: "0.5px" }}>{t}</div>
  );

  if (preview) return <PreviewModal doc={doc} onClose={() => setPreview(false)} />;

  return (
    <div style={{ margin: "-28px -32px", background: C.bg, minHeight: "100vh" }}>
      <div style={{ position: "sticky", top: 0, zIndex: 50, background: C.surface, borderBottom: "1px solid " + C.border, padding: "12px 24px", display: "flex", alignItems: "center", justifyContent: "space-between", gap: 12, flexWrap: "wrap" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
          {onClose && <button type="button" onClick={onClose} style={{ ...btnOutline, fontSize: 12, padding: "5px 12px" }}>← Back</button>}
          <input value={doc.quoteId} onChange={e => update({ quoteId: e.target.value })} style={{ ...inputCls, width: 160, fontWeight: 700, fontSize: 15, border: "none", borderBottom: "2px solid " + C.border, borderRadius: 0 }} />
          <Select value={doc.status} onChange={v => update({ status: v })} options={QUOTE_STATUSES} style={{ width: 120 }} />
          <Select value={doc.currency} onChange={v => update({ currency: v })} options={CURRENCIES} style={{ width: 84 }} />
        </div>
        <div style={{ display: "flex", gap: 10, alignItems: "center" }}>
          {saved && <span style={{ color: C.green, fontSize: 13, fontWeight: 600 }}>✓ Saved</span>}
          <span style={{ fontSize: 16, fontWeight: 800, color: C.accent }}>{fmt(totals.total, doc.currency)}</span>
          <button type="button" onClick={handleSave} style={btnSecondary}>Save</button>
          <button type="button" onClick={() => setPreview(true)} style={btnPrimary}>Preview &amp; Print</button>
        </div>
      </div>

      <div style={{ padding: 24, maxWidth: 980, margin: "0 auto" }}>
        <div className="grid-3" style={{ marginBottom: 20 }}>
          <Field label="Issue Date"><input type="date" value={doc.issueDate} onChange={e => update({ issueDate: e.target.value })} style={inputCls} /></Field>
          <Field label="Due Date"><input type="date" value={doc.dueDate} onChange={e => update({ dueDate: e.target.value })} style={inputCls} /></Field>
          <Field label="Expiry Date"><input type="date" value={doc.expirationDate} onChange={e => update({ expirationDate: e.target.value })} style={inputCls} /></Field>
        </div>

        <div className="grid-2" style={{ marginBottom: 20 }}>
          <div style={{ ...card, marginBottom: 0 }}>
            {sectionTitle("From (Your Business)")}
            <LogoUpload logo={doc.from.logo} onChange={v => updateFrom({ logo: v })} />
            <Field label="Business Name"><TextInput value={doc.from.name} onChange={v => updateFrom({ name: v })} placeholder="Your Business" /></Field>
            <Field label="Email"><TextInput value={doc.from.email} onChange={v => updateFrom({ email: v })} placeholder="you@business.com" /></Field>
            <Field label="Phone"><TextInput value={doc.from.phone} onChange={v => updateFrom({ phone: v })} placeholder="+1 555 000 0000" /></Field>
            <Field label="Address"><TextInput value={doc.from.address} onChange={v => updateFrom({ address: v })} placeholder="123 Main St, City" rows={2} /></Field>
          </div>
          <div style={{ ...card, marginBottom: 0 }}>
            {sectionTitle("Bill To")}
            {clients.length > 0 && (
              <Field label="Load Saved Client">
                <select value="" onChange={e => e.target.value && pickClient(e.target.value)} style={inputCls}>
                  <option value="">Select a client…</option>
                  {clients.map(c => <option key={c._id} value={c.clientName}>{c.clientName}</option>)}
                </select>
              </Field>
            )}
            <Field label="Client Name"><TextInput value={doc.to.name} onChange={v => updateTo({ name: v })} placeholder="Client Name" /></Field>
            <Field label="Email"><TextInput value={doc.to.email} onChange={v => updateTo({ email: v })} placeholder="client@email.com" /></Field>
            <Field label="Phone"><TextInput value={doc.to.phone} onChange={v => updateTo({ phone: v })} placeholder="+1 555 000 0000" /></Field>
            <Field label="Address"><TextInput value={doc.to.address} onChange={v => updateTo({ address: v })} placeholder="Client address" rows={2} /></Field>
          </div>
        </div>

        <div style={{ ...card, marginBottom: 20 }}>
          <Field label="Job / Project Reference">
            {jobs.length > 0
              ? (
                <select value={doc.jobReference} onChange={e => update({ jobReference: e.target.value })} style={inputCls}>
                  <option value="">No job selected</option>
                  {jobsByClient(jobs).map(j => <option key={j._id} value={j.jobTitle}>{jobLabel(j)}</option>)}
                </select>
              )
              : <TextInput value={doc.jobReference} onChange={v => update({ jobReference: v })} placeholder="Job name, number, or ID" />}
          </Field>
        </div>

        <div style={{ ...card, marginBottom: 20 }}>
          {sectionTitle("Line Items")}
          <div className="scroll-x">
            <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13, minWidth: 620 }}>
              <thead>
                <tr style={{ background: C.surfaceAlt }}>
                  {["Description", "Unit", "Qty", "Rate", "Amount", "Tax?", ""].map((h, i) => (
                    <th key={i} style={{ padding: "8px 10px", textAlign: i >= 2 && i <= 4 ? "right" : "left", fontSize: 11, fontWeight: 700, color: C.textMuted, textTransform: "uppercase", letterSpacing: "0.5px", borderBottom: "2px solid " + C.border }}>{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {doc.items.map((item, i) => (
                  <tr key={item.id} style={{ background: i % 2 === 0 ? C.surface : "#FAFAFA" }}>
                    <td style={{ padding: "6px 8px" }}>
                      <input value={item.description} onChange={e => updateItem(item.id, "description", e.target.value)} placeholder="Description…" style={{ ...inputCls, border: "none", background: "transparent" }} />
                    </td>
                    <td style={{ padding: "6px 4px" }}>
                      <input value={item.unit} onChange={e => updateItem(item.id, "unit", e.target.value)} placeholder="hrs" style={{ ...inputCls, width: 64, border: "none", background: "transparent", textAlign: "center" }} />
                    </td>
                    <td style={{ padding: "6px 4px" }}>
                      <input type="number" min="0" step="any" value={item.qty} onChange={e => updateItem(item.id, "qty", num(e.target.value))} style={{ ...inputCls, width: 72, border: "none", background: "transparent", textAlign: "right" }} />

                    <td style={{ padding: "6px 4px", textAlign: "center" }}>
                      {doc.items.length > 1 && <button type="button" onClick={() => updateItems(doc.items.filter(it => it.id !== item.id))} style={{ background: "none", border: "none", color: C.textMuted, cursor: "pointer", fontSize: 16 }}>×</button>}

          <button type="button" onClick={() => updateItems([...doc.items, emptyItem()])} style={{ marginTop: 12, padding: "7px 14px", background: "#EEF2FF", color: C.accent, border: "1px dashed #A5B4FC", borderRadius: 7, cursor: "pointer", fontSize: 12, fontWeight: 600 }}>+ Add Line Item</button>

        <div style={{ display: "flex", justifyContent: "flex-end", marginBottom: 20 }}>
          <div style={{ width: 360, maxWidth: "100%", background: C.surfaceAlt, borderRadius: 12, padding: "16px 20px", border: "1px solid " + C.border }}>

        {/* Optional Word-style scope document */}

        <div className="grid-2">

          <div style={{ fontSize: 12, color: C.textMuted, margin: "2px 0 12px" }}>Spec sheets, reference PDFs, supplier quotes — kept with this quote for your team.</div>
          {savedId
            ? <DocsList ownerId={savedId} collection="quote_docs" idField="quoteId" folder={"quote-" + savedId} emptyHint="No attachments yet. Add supporting PDFs or reference files for this quote." />
            : <div style={{ fontSize: 13, color: C.textMuted, background: C.surfaceAlt, borderRadius: 8, padding: "14px", textAlign: "center" }}>Save the quote first (button below), then you can attach documents.</div>}
        </div>
      </div>
    </div>
  );

function QuotesPage({ startNew }) {
  const { navigate, params } = useRouter();
  const [quotes, setQuotes] = useState(() => db.getAll("quotes").items);
  // params.openId lets Quick Command drop you straight into one document.
  const [editing, setEditing] = useState(startNew ? "new" : (params.openId || null));

  const reload = () => setQuotes(db.getAll("quotes").items);
  const close = () => { setEditing(null); reload(); if (startNew) navigate("quotes"); };
  const del = async q => { if (await confirmDialog("Delete " + (q.quoteId || "this quote") + "? This can't be undone.")) { db.remove("quotes", q._id); reload(); } };

  if (editing !== null) return <QuoteEditor docId={editing === "new" ? null : editing} startPreview={!!params.preview && editing === params.openId} onClose={close} />;

  const outstanding = quotes
    .filter(q => q.status === "Invoice" || q.status === "Quote")
    .reduce((s, q) => s + num(q.totalAmount), 0);
  const paid = quotes.filter(q => q.status === "Paid").reduce((s, q) => s + num(q.totalAmount), 0);

  return (
    <div>
      <PageHeader
        title="Quotes & Invoices"
        subtitle="Create and manage quotes and invoices for your clients"
        action={<button type="button" onClick={() => setEditing("new")} style={btnSecondary}>+ New Quote</button>}
      />
      {quotes.length === 0
        ? <EmptyState icon="📄" title="No quotes yet" subtitle="Create your first quote to get started." action={<button type="button" onClick={() => setEditing("new")} style={btnSecondary}>Create Quote</button>} />
        : (
          <>
            <div className="grid-3" style={{ marginBottom: 20 }}>
              <StatCard label="Documents" value={quotes.length} icon="📄" />
              <StatCard label="Outstanding" value={fmt(outstanding)} icon="⏳" />
              <StatCard label="Paid" value={fmt(paid)} icon="✅" />
            </div>
            <div style={card}>
              <DataTable
                columns={[
                  { key: "quoteId", label: "ID" },
                  { key: "status", label: "Status", render: v => <StatusBadge status={v} /> },
                  { key: "clientReference", label: "Client" },
                  { key: "jobReference", label: "Job Ref" },
                  { key: "issueDate", label: "Date" },
                  { key: "totalAmount", label: "Total", render: (v, row) => fmt(v, row.currency) },
                ]}
                rows={quotes}
                onView={q => setEditing(q._id)}
                onDelete={del}
              />
            </div>
          </>
        )}
    </div>
  );
}

function useEmployeeOptions() {
  const { user } = useAuth();
  useDataVersion();   // the roster can gain rows mid-session (see syncTeamRoster)
  const employees = db.getAll("employees").items;
  const names = employees.filter(e => e.isActive !== false).map(e => e.fullName).filter(Boolean);
  const me = user?.name || user?.email || "Unknown";
  return names.some(n => sameName(n, me)) ? names : [me, ...names];
}
