function QuotesPage({ startNew }) {
  const { navigate } = useRouter();
  const [quotes, setQuotes] = useState(() => db.getAll("quotes").items);
  const [editing, setEditing] = useState(startNew ? "new" : null);

  const reload = () => setQuotes(db.getAll("quotes").items);
  const close = () => { setEditing(null); reload(); if (startNew) navigate("quotes"); };
  const del = q => { if (window.confirm("Delete " + (q.quoteId || "this quote") + "?")) { db.remove("quotes", q._id); reload(); } };

  if (editing !== null) return <QuoteEditor docId={editing === "new" ? null : editing} onClose={close} />;

  const outstanding = quotes
    .filter(q => q.status === "Invoice" || q.status === "Quote")
    .reduce((s, q) => s + num(q.totalAmount), 0);
  const paid = quotes.filter(q => q.status === "Paid").reduce((s, q) => s + num(q.totalAmount), 0);

  return (
    <div>
      <PageHeader
        title="Quotes & Invoices"
        subtitle="Create and manage quotes and invoices for your clients"
        action={<button type="button" onClick={() => setEditing("new")} style={btnSecondary}>+ New Quote</button>}
      />
      {quotes.length === 0
        ? <EmptyState icon="📄" title="No quotes yet" subtitle="Create your first quote to get started." action={<button type="button" onClick={() => setEditing("new")} style={btnSecondary}>Create Quote</button>} />
        : (
          <>
            <div className="grid-3" style={{ marginBottom: 20 }}>
              <StatCard label="Documents" value={quotes.length} icon="📄" />
              <StatCard label="Outstanding" value={fmt(outstanding)} icon="⏳" />
              <StatCard label="Paid" value={fmt(paid)} icon="✅" />
            </div>
            <div style={card}>
              <DataTable
                columns={[
                  { key: "quoteId", label: "ID" },
                  { key: "status", label: "Status", render: v => <StatusBadge status={v} /> },
                  { key: "clientReference", label: "Client" },
                  { key: "jobReference", label: "Job Ref" },
                  { key: "issueDate", label: "Date" },
                  { key: "totalAmount", label: "Total", render: (v, row) => fmt(v, row.currency) },
                ]}
                rows={quotes}
                onView={q => setEditing(q._id)}
                onDelete={del}
              />
            </div>
          </>
        )}
    </div>
  );
}

const newTimeRow = () => ({
  id: genId(), jobLocation: "", contract: "", workDone: "",
  startTime: "08:00", endTime: "17:00", equipment: "", notes: "", mileage: "",
});

function useEmployeeOptions() {
  const { user } = useAuth();
  const employees = useMemo(() => db.getAll("employees").items, []);
  const names = employees.map(e => e.fullName).filter(Boolean);
  const me = user?.name || user?.email || "Unknown";
  return names.includes(me) ? names : [me, ...names];
}

function TimeEntryPage() {
  const { user } = useAuth();
  const employeeOptions = useEmployeeOptions();
  const [employeeName, setEmployeeName] = useState(employeeOptions[0] || "Unknown");
  const [date, setDate] = useState(today());
  const [rows, setRows] = useState([newTimeRow()]);
  const [message, setMessage] = useState("");
  const [entries, setEntries] = useState(() => db.getAll("timeentries", {}, { limit: 20 }).items);
  const jobs = useMemo(() => db.getAll("jobs").items, []);
  const equipment = useMemo(() => db.getAll("equipment").items, []);

  const updRow = (id, k, v) => setRows(r => r.map(x => (x.id === id ? { ...x, [k]: v } : x)));
  const delRow = id => setRows(r => r.filter(x => x.id !== id));
  const totalHours = rows.reduce((t, r) => t + hoursBetween(r.startTime, r.endTime), 0);

  const refresh = () => setEntries(db.getAll("timeentries", {}, { limit: 20 }).items);

  const submit = () => {
    const valid = rows.filter(r => r.jobLocation || r.workDone);
    if (valid.length === 0) { window.alert("Add a job or a description of the work before submitting."); return; }
    valid.forEach(r => {
      const hrs = hoursBetween(r.startTime, r.endTime);
      db.create("timeentries", {
        employeeName,
        jobName: r.jobLocation,
        entryDate: date,
        hoursWorked: hrs,
        startTime: r.startTime,
        endTime: r.endTime,
        workDescription: r.workDone,
        notes: r.notes,
        equipmentUsed: r.equipment,
        mileageDriven: num(r.mileage),
      });
      // The equipment picked for a row is assumed to have run for that row's
      // hours — bills it and rolls the hours onto the equipment's total.
      if (r.equipment) logEquipmentUsage({ equipmentName: r.equipment, hours: hrs, employeeName, entryDate: date, jobName: r.jobLocation, source: "desktop-time-entry" });
    });
    setRows([newTimeRow()]);
    refresh();
    setMessage(valid.length + " time " + (valid.length === 1 ? "entry" : "entries") + " submitted!");
    setTimeout(() => setMessage(""), 3000);
  };

  return (
    <div>
      <PageHeader title="Time Tracking" subtitle="Log your daily work hours and activities" />
      <Toast message={message} />

      <div style={{ ...card, marginBottom: 20 }}>
        <div className="row-wrap" style={{ marginBottom: 16 }}>
          <Field label="Employee" style={{ marginBottom: 0 }}>
            <Select value={employeeName} onChange={setEmployeeName} options={employeeOptions} style={{ width: 200 }} />
          </Field>
          <Field label="Date" style={{ marginBottom: 0 }}>
            <input type="date" value={date} onChange={e => setDate(e.target.value)} style={inputCls} />
          </Field>
          <div style={{ fontSize: 14, color: C.textMuted, paddingBottom: 8 }}>
            Total: <strong style={{ color: C.accent }}>{totalHours.toFixed(2)} hrs</strong>
          </div>
          <div style={{ fontSize: 14, color: C.textMuted, paddingBottom: 8 }}>{rows.length}/10 rows</div>
        </div>

        <div className="scroll-x">
          <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 12, minWidth: 860 }}>
            <thead>
              <tr style={{ background: C.surfaceAlt }}>
                {["Job / Location", "Work Done", "Start", "End", "Hrs", "Equipment", "Miles", "Notes", ""].map(h => (
                  <th key={h} style={{ padding: "8px 10px", textAlign: "left", fontWeight: 700, fontSize: 11, color: C.textMuted, textTransform: "uppercase", letterSpacing: "0.5px", borderBottom: "2px solid " + C.border }}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {rows.map((r, i) => (
                <tr key={r.id} style={{ background: i % 2 === 0 ? C.surface : "#FAFAFA", borderBottom: "1px solid " + C.border }}>
                  <td style={{ padding: "6px 8px" }}>
                    {jobs.length > 0
                      ? (
                        <select value={r.jobLocation} onChange={e => updRow(r.id, "jobLocation", e.target.value)} style={{ ...inputCls, minWidth: 140 }}>
                          <option value="">Select job…</option>
                          {jobsByClient(jobs).map(j => <option key={j._id} value={j.jobTitle}>{jobLabel(j)}</option>)}
                        </select>
                      )
                      : <input value={r.jobLocation} onChange={e => updRow(r.id, "jobLocation", e.target.value)} placeholder="Site A" style={{ ...inputCls, minWidth: 130 }} />}
                  </td>
                  <td style={{ padding: "6px 8px" }}><input value={r.workDone} onChange={e => updRow(r.id, "workDone", e.target.value)} placeholder="Excavation…" style={{ ...inputCls, minWidth: 150 }} /></td>
                  <td style={{ padding: "6px 4px" }}><input type="time" value={r.startTime} onChange={e => updRow(r.id, "startTime", e.target.value)} style={{ ...inputCls, width: 110 }} /></td>
                  <td style={{ padding: "6px 4px" }}><input type="time" value={r.endTime} onChange={e => updRow(r.id, "endTime", e.target.value)} style={{ ...inputCls, width: 110 }} /></td>
                  <td style={{ padding: "6px 8px", fontWeight: 700, color: C.accent, whiteSpace: "nowrap" }}>{hoursBetween(r.startTime, r.endTime).toFixed(1)}h</td>
                  <td style={{ padding: "6px 4px" }}>

                        <select value={r.equipment} onChange={e => updRow(r.id, "equipment", e.target.value)} style={{ ...inputCls, minWidth: 120 }}>

      <div style={card}>
        <h3 style={{ fontSize: 15, fontWeight: 700, marginBottom: 16 }}>Recent Entries</h3>
        <DataTable
          columns={[
            { key: "entryDate", label: "Date" },
            { key: "employeeName", label: "Employee" },
            { key: "jobName", label: "Job" },
            { key: "hoursWorked", label: "Hours", render: v => num(v).toFixed(2) + "h" },
            { key: "equipmentUsed", label: "Equipment" },
            { key: "workDescription", label: "Work" },

          rows={entries}
          emptyMessage="No entries yet."
          onDelete={e => { if (window.confirm("Delete this entry?")) { db.remove("timeentries", e._id); refresh(); } }}
        />
      </div>
    </div>
  );
}

function TruckLogForm({ data, onSave, onCancel }) {
  const [form, setForm] = useState({ ...data });
  const [error, setError] = useState("");
  const set = (k, v) => setForm(p => ({ ...p, [k]: v }));
  const overall = !!(form.brakesChecked && form.lightsChecked && form.fluidsChecked);

  const submit = () => {
    if (!String(form.vehicleIdentifier || "").trim()) { setError("Vehicle ID is required."); return; }
    if (!String(form.employeeName || "").trim()) { setError("Employee name is required."); return; }
    onSave(form);
  };

  return (
    <div>
      {error && <div style={{ background: "#FEF2F2", color: "#DC2626", padding: "10px 14px", borderRadius: 8, marginBottom: 14, fontSize: 13 }}>{error}</div>}
      <Field label="Vehicle ID / Name" required><TextInput value={form.vehicleIdentifier} onChange={v => set("vehicleIdentifier", v)} placeholder="Truck 01, Excavator A…" /></Field>
      <Field label="Employee Name" required><TextInput value={form.employeeName} onChange={v => set("employeeName", v)} placeholder="John Doe" /></Field>
      <Field label="Odometer Reading"><TextInput type="number" value={form.odometerReading} onChange={v => set("odometerReading", v)} placeholder="0" /></Field>
      <div style={{ marginBottom: 12 }}>
        <label style={{ fontSize: 11, fontWeight: 700, color: C.textMuted, display: "block", marginBottom: 8, textTransform: "uppercase", letterSpacing: "0.5px" }}>Safety Checks</label>
        {[
          ["brakesChecked", "Brakes checked and operational"],
          ["lightsChecked", "Lights checked and operational"],
          ["fluidsChecked", "Fluid levels checked and adequate"],
        ].map(([k, l]) => (
          <div key={k} style={{ marginBottom: 8 }}>
            <Checkbox checked={form[k]} onChange={v => set(k, v)} label={l} />
          </div>
        ))}
      </div>
      <Field label="Defects / Notes"><TextInput value={form.notes} onChange={v => set("notes", v)} placeholder="Anything needing attention…" rows={2} /></Field>
      <div style={{ padding: "10px 14px", background: overall ? "#F0FDF4" : "#FEF2F2", borderRadius: 8, marginBottom: 16, textAlign: "center", fontWeight: 700, color: overall ? "#16A34A" : "#DC2626" }}>
        Overall Status: {overall ? "PASS" : "FAIL"}
      </div>
      <div style={{ display: "flex", gap: 10 }}>
        <button type="button" onClick={onCancel} style={{ ...btnOutline, flex: 1 }}>Cancel</button>
        <button type="button" onClick={submit} style={{ ...btnSecondary, flex: 1 }}>Save</button>
      </div>
    </div>
  );
}

function TruckLogBooksPage() {

  const rateFor = name => {
    const emp = employees.find(x => x.fullName === name);
    return emp ? num(emp.hourlyRate) : 0;
  };

  const byEmployee = filtered.reduce((acc, e) => {
    const n = e.employeeName || "Unknown";
    if (!acc[n]) acc[n] = { hours: 0, miles: 0, entries: 0 };
    acc[n].hours += num(e.hoursWorked);
    acc[n].miles += num(e.mileageDriven);
    acc[n].entries += 1;
    return acc;
  }, {});

  return (
    <div>
      <PageHeader title="Work Logs" subtitle="Per-employee productivity and hours tracked" />
      <div style={{ ...card, marginBottom: 20 }}>
        <Field label="Filter by Employee" style={{ marginBottom: 0 }}>
          <select value={selected} onChange={e => setSelected(e.target.value)} style={{ ...inputCls, maxWidth: 240 }}>
            <option value="">All Employees</option>
            {employees.map(emp => <option key={emp._id} value={emp.fullName}>{emp.fullName}</option>)}
          </select>
        </Field>
      </div>

      <div className="grid-auto" style={{ marginBottom: 24 }}>
        {Object.entries(byEmployee).map(([name, stats]) => (
          <div key={name} style={{ ...card, marginBottom: 0 }}>
            <div style={{ fontSize: 15, fontWeight: 700, marginBottom: 12 }}>{name}</div>
            {[
              ["Hours Worked", stats.hours.toFixed(2) + "h"],
              ["Miles Driven", stats.miles.toFixed(0) + " mi"],
              ["Log Entries", stats.entries],
              ["Labour Cost", fmt(stats.hours * rateFor(name))],
            ].map(([l, v]) => (
              <div key={l} style={{ display: "flex", justifyContent: "space-between", padding: "6px 0", borderBottom: "1px solid " + C.border }}>
                <span style={{ fontSize: 12, color: C.textMuted }}>{l}</span>
                <span style={{ fontSize: 13, fontWeight: 700, color: C.accent }}>{v}</span>
              </div>
            ))}
          </div>
        ))}
        {Object.keys(byEmployee).length === 0 && <p style={{ color: C.textMuted, gridColumn: "1/-1" }}>No time entries found.</p>}
      </div>

      <div style={card}>
        <h3 style={{ fontSize: 15, fontWeight: 700, marginBottom: 16 }}>All Time Entries</h3>
        <DataTable
          columns={[
            { key: "entryDate", label: "Date" },
            { key: "employeeName", label: "Employee" },
            { key: "jobName", label: "Job" },
            { key: "hoursWorked", label: "Hours", render: v => num(v).toFixed(2) + "h" },
            { key: "mileageDriven", label: "Miles", render: v => (num(v) ? num(v) + " mi" : "—") },
            { key: "equipmentUsed", label: "Equipment" },
          ]}
          rows={filtered}
          emptyMessage="No time entries yet."
        />
      </div>
    </div>
  );
}

/* ─── Crew locations (Owner/Manager only) ────────────────────────────────────
   Live location + trail for whoever is currently clocked in (backed by
   "activeclocks", which only exists while someone's on the clock), plus a
   "Recent Shifts" history where past shifts' routes can still be viewed —
   each shift keeps the `clockRecordId` linking it to its "locationpings", so
   the trail survives clock-out even though the "currently active" marker
   doesn't. Since other devices' writes aren't pushed to us in real time, this
   page polls the server directly. */
function useCrewLocationsPolling(pollMs = 20000) {
  useDataVersion();
  useEffect(() => {
    let cancelled = false;
    const refresh = () => { if (!cancelled) { db.refreshCollection("activeclocks"); db.refreshCollection("locationpings"); } };
    refresh();
    const id = setInterval(refresh, pollMs);
    return () => { cancelled = true; clearInterval(id); };
  }, [pollMs]);
}

function CrewMapModal({ session, pings, onClose, live }) {
  const containerRef = useRef(null);
  useEffect(() => {
    if (!containerRef.current || !window.L || pings.length === 0) return;
    const latlngs = pings.map(p => [p.lat, p.lng]);
    const map = L.map(containerRef.current).setView(latlngs[latlngs.length - 1], 15);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19, attribution: "&copy; OpenStreetMap contributors",
    }).addTo(map);
    if (latlngs.length > 1) {
      const trail = L.polyline(latlngs, { color: C.secondary, weight: 4 }).addTo(map);
      L.circleMarker(latlngs[0], { radius: 6, color: "#6B7280", fillColor: "#6B7280", fillOpacity: 1 }).addTo(map).bindPopup("Clocked in here");
      map.fitBounds(trail.getBounds(), { padding: [30, 30] });
    }
    L.marker(latlngs[latlngs.length - 1]).addTo(map).bindPopup(live ? "Current location" : "Clocked out here").openPopup();
    return () => map.remove();
  }, [session._id, pings.length]);

  return (
    <Modal title={session.employeeName + (live ? " — live location" : " — route")} width={720} onClose={onClose}>
      {pings.length === 0
        ? <p style={{ color: C.textMuted, fontSize: 13 }}>No location recorded for this shift.</p>
        : (
          <>
            <div ref={containerRef} style={{ height: 420, borderRadius: 10, overflow: "hidden" }} />
            <div style={{ fontSize: 12, color: C.textMuted, marginTop: 10 }}>
              {pings.length} location ping{pings.length === 1 ? "" : "s"}{live ? " since clock-in · updates automatically while they're on the clock" : " over this shift"}
            </div>
          </>
        )}
    </Modal>
  );
}

function CrewLocationsPage() {
  useCrewLocationsPolling();
  const [selected, setSelected] = useState(null);
  const [historySelected, setHistorySelected] = useState(null);
  const active = getCol("activeclocks").slice().sort((a, b) => (a.employeeName || "").localeCompare(b.employeeName || ""));

  const recentShifts = getCol("shifts")
    .filter(s => s.clockRecordId)
    .sort((a, b) => (b.clockOutAt || "").localeCompare(a.clockOutAt || ""))
    .slice(0, 30);

  return (
    <div>
      <PageHeader title="Crew Locations" subtitle="Live location while clocked in, plus routes from recent finished shifts — visible to owners and managers only" />
      {active.length === 0
        ? <EmptyState icon="🛰️" title="No one's clocked in" subtitle="Live locations show up here the moment someone clocks in on the field app." />
        : (
          <div className="grid-auto" style={{ marginBottom: 24 }}>
            {active.map(a => {
              const pings = pingsFor(a._id);
              const last = pings[pings.length - 1];
              return (
                <div key={a._id} style={card}>
                  <div style={{ fontSize: 15, fontWeight: 700 }}>{a.employeeName}</div>
                  <div style={{ fontSize: 12, color: C.textMuted, marginTop: 2 }}>Clocked in since {a.startISO ? new Date(a.startISO).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) : "—"}</div>
                  <div style={{ fontSize: 12, color: C.textMuted, marginTop: 2 }}>{last ? "Last seen " + timeAgo(last.at) : "Waiting for a location…"}</div>
                  <button type="button" onClick={() => setSelected(a)} disabled={!last} style={{ ...btnOutline, marginTop: 12, width: "100%", opacity: last ? 1 : .5 }}>📍 View live location</button>
                </div>
              );
            })}
          </div>
        )}

      <h3 style={{ fontSize: 15, fontWeight: 700, marginBottom: 12 }}>Recent Shifts</h3>
      {recentShifts.length === 0
        ? <p style={{ color: C.textMuted, fontSize: 13 }}>No finished shifts with a recorded route yet.</p>
        : (
          <div style={card}>
            <DataTable
              columns={[
                { key: "employeeName", label: "Employee" },
                { key: "entryDate", label: "Date" },
                { key: "startTime", label: "Start" },
                { key: "endTime", label: "End" },
                { key: "hours", label: "Hours", render: v => num(v).toFixed(2) + "h" },
              ]}
              rows={recentShifts}
              onView={s => setHistorySelected(s)}

            />
          </div>
        )}

      {selected && <CrewMapModal session={selected} pings={pingsFor(selected._id)} onClose={() => setSelected(null)} live />}
      {historySelected && <CrewMapModal session={historySelected} pings={pingsFor(historySelected.clockRecordId)} onClose={() => setHistorySelected(null)} />}
    </div>
  );
}

/* ─── Shift requests (Owner/Manager only) ─────────────────────────────────────
   Employees can't edit a clocked shift directly — they request a correction
   from "My Hours" on the field app (e.g. forgot to clock out, ended up with a
   23-hour shift). This is where owners/managers review it: approving patches
   the underlying `shifts` record directly; rejecting just closes the request.
   An email goes out to the owner + managers on submission (see
   supabase/migration_shift_requests.sql). */
function ShiftRequestsPage() {
  useDataVersion();
  const { user } = useAuth();
  const requests = getCol("shiftrequests");
  const pending = requests.filter(r => r.status === "Pending");
  const resolved = requests.filter(r => r.status !== "Pending");

  const approve = req => {
    const shift = getCol("shifts").find(s => s._id === req.shiftId);
    if (shift) {
      db.update("shifts", {
        ...shift, startTime: req.requestedStartTime, endTime: req.requestedEndTime,
        hours: hoursBetween(req.requestedStartTime, req.requestedEndTime),
      });
    }
    db.update("shiftrequests", { ...req, status: "Approved", reviewedBy: user?.name || "", reviewedAt: new Date().toISOString() });
    notifyData();
  };
  const reject = req => {
    db.update("shiftrequests", { ...req, status: "Rejected", reviewedBy: user?.name || "", reviewedAt: new Date().toISOString() });
    notifyData();
  };

  const requestCard = (req, editable) => {
    const context = dayWorkContext(req.employeeName, req.entryDate);
    return (
      <div key={req._id} style={{ ...card, marginBottom: 14 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 10, marginBottom: 10 }}>
          <div>
            <div style={{ fontWeight: 700, fontSize: 15 }}>{req.employeeName}</div>
            <div style={{ fontSize: 12, color: C.textMuted }}>{req.entryDate}</div>
          </div>
          <StatusBadge status={req.status} />
        </div>
        <div className="grid-2" style={{ gap: 8, marginBottom: 10 }}>
          <div>
            <div style={{ fontSize: 10, fontWeight: 700, color: C.textMuted, textTransform: "uppercase", letterSpacing: "0.5px" }}>Logged</div>
            <div style={{ fontSize: 14 }}>{req.originalStartTime || "?"}–{req.originalEndTime || "?"} ({num(req.originalHours).toFixed(2)}h)</div>
          </div>
          <div>
            <div style={{ fontSize: 10, fontWeight: 700, color: C.textMuted, textTransform: "uppercase", letterSpacing: "0.5px" }}>Requested</div>
            <div style={{ fontSize: 14, fontWeight: 700, color: C.accent }}>{req.requestedStartTime || "?"}–{req.requestedEndTime || "?"} ({hoursBetween(req.requestedStartTime, req.requestedEndTime).toFixed(2)}h)</div>
          </div>
        </div>
        {req.reason && <div style={{ fontSize: 13, marginBottom: 10 }}><strong>Reason:</strong> {req.reason}</div>}
        {context.length > 0 && (
          <div style={{ background: C.surfaceAlt, borderRadius: 8, padding: 10, marginBottom: 10 }}>
            <div style={{ fontSize: 11, fontWeight: 700, color: C.textMuted, textTransform: "uppercase", letterSpacing: "0.5px", marginBottom: 6 }}>Logged that day</div>
            {context.map(e => (
              <div key={e._id} style={{ fontSize: 12, marginBottom: 3 }}>
                {e.jobName || "Work"} · {e.startTime || "?"}–{e.endTime || "?"}{num(e.hoursWorked) ? " (" + num(e.hoursWorked).toFixed(2) + "h)" : ""}
              </div>
            ))}
          </div>
        )}
        {editable
          ? (
            <div style={{ display: "flex", gap: 10 }}>
              <button type="button" onClick={() => approve(req)} style={{ ...btnSecondary, flex: 1 }}>Approve</button>
              <button type="button" onClick={() => reject(req)} style={{ ...btnDanger, flex: 1 }}>Reject</button>
            </div>
          )
          : req.reviewedBy && (
            <div style={{ fontSize: 12, color: C.textMuted }}>Reviewed by {req.reviewedBy}{req.reviewedAt ? " · " + new Date(req.reviewedAt).toLocaleDateString() : ""}</div>
          )}
      </div>
    );
  };

  return (
    <div>
      <PageHeader title="Shift Requests" subtitle="Employee-requested corrections to clocked shifts — approving here updates the shift" />
      <h3 style={{ fontSize: 15, fontWeight: 700, marginBottom: 12 }}>Pending ({pending.length})</h3>
      {pending.length === 0
        ? <EmptyState icon="🕘" title="No pending requests" subtitle="When an employee requests a shift correction from “My Hours” on the field app, it shows up here." />
        : pending.map(r => requestCard(r, true))}
      {resolved.length > 0 && (
        <>
          <h3 style={{ fontSize: 15, fontWeight: 700, margin: "24px 0 12px" }}>History</h3>
          {resolved.map(r => requestCard(r, false))}
        </>
      )}
    </div>
  );
}

/* ─── Billing & reports ──────────────────────────────────────────────────── */
function BillingPage() {
  const entries = useMemo(() => db.getAll("timeentries", {}, { limit: 1000 }).items, []);
  const equipmentLogs = useMemo(() => db.getAll("equipmentlogs", {}, { limit: 1000 }).items, []);
  const employees = useMemo(() => db.getAll("employees").items, []);
  const [filters, setFilters] = useState({ startDate: "", endDate: "", employee: "", job: "" });

  const rateFor = name => {
    const emp = employees.find(x => x.fullName === name);
    return emp ? num(emp.hourlyRate) : 0;
  };

  const filtered = entries.filter(e => {
    if (filters.startDate && (e.entryDate || "") < filters.startDate) return false;
    if (filters.endDate && (e.entryDate || "") > filters.endDate) return false;
    if (filters.employee && e.employeeName !== filters.employee) return false;
    if (filters.job && !String(e.jobName || "").toLowerCase().includes(filters.job.toLowerCase())) return false;
    return true;
  });

  // Equipment hours billed alongside labour — logged from the daily log / time
  // tracking whenever equipment is picked, and rolled onto the equipment's
  // running total (see logEquipmentUsage).
  const filteredEquipment = equipmentLogs.filter(l => {
    if (filters.startDate && (l.entryDate || "") < filters.startDate) return false;
    if (filters.endDate && (l.entryDate || "") > filters.endDate) return false;
    if (filters.employee && l.employeeName !== filters.employee) return false;
    if (filters.job && !String(l.jobName || "").toLowerCase().includes(filters.job.toLowerCase())) return false;
    return true;
  });

  const totalHours = filtered.reduce((s, e) => s + num(e.hoursWorked), 0);
  const totalLabourCost = filtered.reduce((s, e) => s + num(e.hoursWorked) * rateFor(e.employeeName), 0);
  const totalMiles = filtered.reduce((s, e) => s + num(e.mileageDriven), 0);
  const totalEquipmentHours = filteredEquipment.reduce((s, l) => s + num(l.hoursUsed), 0);
  const totalEquipmentCost = filteredEquipment.reduce((s, l) => s + num(l.cost), 0);

  const exportCSV = () => {
    const rows = [
      ["Date", "Employee", "Job", "Hours", "Rate", "Labour Cost", "Miles", "Equipment", "Description"],
      ...filtered.map(e => [
        e.entryDate, e.employeeName, e.jobName, num(e.hoursWorked).toFixed(2),
        rateFor(e.employeeName).toFixed(2), (num(e.hoursWorked) * rateFor(e.employeeName)).toFixed(2),
        num(e.mileageDriven), e.equipmentUsed, e.workDescription,
      ]),
      [],
      ["", "", "TOTAL", totalHours.toFixed(2), "", totalLabourCost.toFixed(2), totalMiles],
      [],
      ["EQUIPMENT USAGE"],
      ["Date", "Equipment", "Employee", "Job", "Hours", "Rate", "Billed"],
      ...filteredEquipment.map(l => [l.entryDate, l.equipmentName, l.employeeName, l.jobName, num(l.hoursUsed).toFixed(2), num(l.billingRatePerHour).toFixed(2), num(l.cost).toFixed(2)]),
      [],
      ["", "", "", "TOTAL", totalEquipmentHours.toFixed(2), "", totalEquipmentCost.toFixed(2)],
      [],
      ["", "", "", "", "", "GRAND TOTAL", (totalLabourCost + totalEquipmentCost).toFixed(2)],
    ];
    downloadFile("billing_report_" + today() + ".csv", toCSV(rows), "text/csv;charset=utf-8");
  };

  return (
    <div>
      <PageHeader
        title="Billing & Reports"
        subtitle="Generate billing reports from logged time and equipment usage"
        action={<button type="button" onClick={exportCSV} style={btnSecondary}>📊 Export CSV</button>}
      />

      <div style={{ ...card, marginBottom: 20 }}>
        <div className="row-wrap">
          <Field label="Start Date" style={{ marginBottom: 0 }}><input type="date" value={filters.startDate} onChange={e => setFilters(f => ({ ...f, startDate: e.target.value }))} style={inputCls} /></Field>
          <Field label="End Date" style={{ marginBottom: 0 }}><input type="date" value={filters.endDate} onChange={e => setFilters(f => ({ ...f, endDate: e.target.value }))} style={inputCls} /></Field>
          <Field label="Employee" style={{ marginBottom: 0 }}>
            <select value={filters.employee} onChange={e => setFilters(f => ({ ...f, employee: e.target.value }))} style={{ ...inputCls, width: 180 }}>
              <option value="">All employees</option>
              {[...new Set(entries.map(e => e.employeeName).filter(Boolean))].map(n => <option key={n} value={n}>{n}</option>)}
            </select>
          </Field>
          <Field label="Job contains" style={{ marginBottom: 0 }}>
            <TextInput value={filters.job} onChange={v => setFilters(f => ({ ...f, job: v }))} placeholder="Job name…" style={{ width: 180 }} />
          </Field>
          <button type="button" onClick={() => setFilters({ startDate: "", endDate: "", employee: "", job: "" })} style={btnOutline}>Clear</button>
        </div>
      </div>

      <div className="grid-3" style={{ marginBottom: 20 }}>
        <StatCard label="Total Hours" value={totalHours.toFixed(2)} />
        <StatCard label="Labour Cost" value={fmt(totalLabourCost)} />
        <StatCard label="Entries" value={filtered.length} />
      </div>

      <div className="grid-3" style={{ marginBottom: 20 }}>
        <StatCard label="Equipment Hours" value={totalEquipmentHours.toFixed(2)} />
        <StatCard label="Equipment Cost" value={fmt(totalEquipmentCost)} />
        <StatCard label="Total Billed" value={fmt(totalLabourCost + totalEquipmentCost)} />
      </div>

      <div style={{ ...card, marginBottom: 20 }}>
        <DataTable
          columns={[
            { key: "entryDate", label: "Date" },
            { key: "employeeName", label: "Employee" },
            { key: "jobName", label: "Job" },
            { key: "hoursWorked", label: "Hours", render: v => num(v).toFixed(2) + "h" },

/* ─── Schedule ───────────────────────────────────────────────────────────── */
function SchedulePage() {
  const { navigate } = useRouter();
  const [cursor, setCursor] = useState(() => new Date());
  const jobs = useMemo(() => db.getAll("jobs").items, []);

  const year = cursor.getFullYear();
  const month = cursor.getMonth();
  const monthStart = new Date(year, month, 1);
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const days = Array.from({ length: daysInMonth }, (_, i) => new Date(year, month, i + 1));

  // A job occupies every day from its start date through its end date.
  const jobsForDay = day => jobs.filter(j => {
    if (!j.startDate) return false;
    const start = new Date(j.startDate + "T00:00:00");
    const end = j.endDate ? new Date(j.endDate + "T00:00:00") : start;
    return day >= start && day <= end;
  });

  return (
    <div>
      <PageHeader title="Schedule" subtitle="Jobs plotted across the calendar" />
      <div style={card}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 20, gap: 12, flexWrap: "wrap" }}>
          <button type="button" onClick={() => setCursor(new Date(year, month - 1, 1))} style={btnOutline}>← Previous</button>
          <h2 style={{ fontSize: 20, fontWeight: 700 }}>{cursor.toLocaleString("default", { month: "long", year: "numeric" })}</h2>
          <div style={{ display: "flex", gap: 8 }}>
            <button type="button" onClick={() => setCursor(new Date())} style={btnOutline}>Today</button>
            <button type="button" onClick={() => setCursor(new Date(year, month + 1, 1))} style={btnOutline}>Next →</button>
          </div>
        </div>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 4 }}>
          {["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"].map(d => (
            <div key={d} style={{ textAlign: "center", fontSize: 11, fontWeight: 700, color: C.textMuted, padding: "8px 4px", textTransform: "uppercase" }}>{d}</div>
          ))}
          {Array.from({ length: monthStart.getDay() }).map((_, i) => <div key={"pad" + i} />)}
          {days.map(day => {
            const dayJobs = jobsForDay(day);
            const isToday = day.toDateString() === new Date().toDateString();
            return (
              <div key={day.toISOString()} style={{ minHeight: 84, background: isToday ? "#EEF2FF" : C.surfaceAlt, borderRadius: 8, padding: 6, border: isToday ? "2px solid " + C.accent : "1px solid " + C.border }}>
                <div style={{ fontSize: 12, fontWeight: 700, color: isToday ? C.accent : C.textMuted, marginBottom: 4 }}>{day.getDate()}</div>
                {dayJobs.slice(0, 2).map(j => (
                  <div
                    key={j._id}
                    onClick={() => navigate("jobs")}
                    title={j.jobTitle}
                    style={{ background: C.primary, color: "#fff", borderRadius: 4, padding: "2px 5px", fontSize: 10, fontWeight: 600, marginBottom: 2, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", cursor: "pointer" }}
                  >
                    {j.jobTitle}
                  </div>
                ))}
                {dayJobs.length > 2 && <div style={{ fontSize: 10, color: C.textMuted }}>+{dayJobs.length - 2} more</div>}
              </div>
            );
          })}
        </div>
        {jobs.length === 0 && (
          <p style={{ color: C.textMuted, fontSize: 13, marginTop: 16, textAlign: "center" }}>
            No jobs scheduled yet — add jobs with a start date to see them here.
          </p>
        )}
      </div>
    </div>
  );
}

const PERMISSIONS = [

function AccessControlPage() {
  const employees = useMemo(() => db.getAll("employees").items, []);
  const [permissions, setPermissions] = useState(() => {
    try { return JSON.parse(storage.get("bmb_permissions") || "{}"); } catch { return {}; }
  });
  const [editingId, setEditingId] = useState(null);
  const [draft, setDraft] = useState({});

  const save = () => {
    const updated = { ...permissions, [editingId]: draft };
    setPermissions(updated);
    storage.set("bmb_permissions", JSON.stringify(updated));
    setEditingId(null);
  };

  return (
    <div>
      <PageHeader title="Access Control" subtitle="Manage user permissions and role-based access" />
      {employees.length === 0
        ? <EmptyState icon="🔒" title="No employees found" subtitle="Add employees first, then set their permissions here." />

          const perms = permissions[emp._id] || {};
          const isEditing = editingId === emp._id;
          return (
            <div key={emp._id} style={card}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16, gap: 12, flexWrap: "wrap" }}>

                  <div style={{ fontSize: 12, color: C.textMuted }}>{emp.role || "Unassigned"}{emp.email ? " — " + emp.email : ""}</div>
                </div>

                  ? <button type="button" onClick={() => { setEditingId(emp._id); setDraft({ ...perms }); }} style={btnOutline}>Edit Permissions</button>
                  : (
                    <div style={{ display: "flex", gap: 8 }}>
                      <button type="button" onClick={save} style={btnSecondary}>Save</button>
                      <button type="button" onClick={() => setEditingId(null)} style={btnOutline}>Cancel</button>
                    </div>
                  )}
              </div>
              <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(210px, 1fr))", gap: 8 }}>
                {PERMISSIONS.map(p => {
                  const val = isEditing ? draft[p.key] : perms[p.key];
                  return isEditing
                    ? <Checkbox key={p.key} checked={val} onChange={v => setDraft(d => ({ ...d, [p.key]: v }))} label={p.label} />

/* ─── Team (owner: join code, approvals, roles, permissions) ─────────────── */
function TeamPage() {
  const { user, fetchTeam, approveMember, removeMember, setMemberRole, setMemberPermissions } = useAuth();
  const { company, regenerateJoinCode } = useCompany();
  const [members, setMembers] = useState([]);
  const [loading, setLoading] = useState(true);
  const [editing, setEditing] = useState(null);
  const [draftPerms, setDraftPerms] = useState({});
  const [busyId, setBusyId] = useState(null);
  const [copied, setCopied] = useState(false);

  const load = async () => { setLoading(true); setMembers(await fetchTeam()); setLoading(false); };
  useEffect(() => { load(); }, []);

  if (!user?.isOwner) {
    return <EmptyState icon="🔒" title="Owners only" subtitle="Only the company owner can manage the team." />;
  }

  const pending = members.filter(m => m.status && m.status !== "active");
  const active = members.filter(m => !m.status || m.status === "active");
  const grantable = NAV.filter(n => GRANTABLE.includes(n.id));

  const doApprove = async (m) => { setBusyId(m.id); await approveMember(m.id); await load(); setBusyId(null); };
  const doRemove = async (m, verb) => {
    if (!window.confirm(verb + " " + (m.full_name || m.email) + "?")) return;
    setBusyId(m.id); await removeMember(m.id); await load(); setBusyId(null);
  };
  const doRole = async (m, role) => { setBusyId(m.id); await setMemberRole(m.id, role); await load(); setBusyId(null); };
  const openPerms = (m) => { setEditing(m.id); setDraftPerms({ ...(m.permissions || {}) }); };
  const savePerms = async (m) => { setBusyId(m.id); await setMemberPermissions(m.id, draftPerms); await load(); setEditing(null); setBusyId(null); };

  const copyCode = () => {
    if (navigator.clipboard) navigator.clipboard.writeText(company?.joinCode || "").then(() => { setCopied(true); setTimeout(() => setCopied(false), 1500); });
  };
  const regen = async () => { if (window.confirm("Generate a new join code? The current one stops working immediately.")) await regenerateJoinCode(); };

  return (
    <div>
      <PageHeader title="Team" subtitle="Invite people to your company and control what each person can see" action={<button type="button" onClick={load} style={{ ...btnOutline, fontSize: 12, padding: "6px 12px" }}>↻ Refresh</button>} />

      {/* Join code */}
      <div style={card}>
        <h3 style={{ fontSize: 15, fontWeight: 700, marginBottom: 8 }}>Company Join Code</h3>
        <p style={{ color: C.textMuted, fontSize: 13, marginBottom: 16, lineHeight: 1.6 }}>
          Share this private code with people you want on your team. They choose <strong>“Join a company”</strong> when signing up and enter it — then you approve them below. Keep it private; regenerate anytime.
        </p>
        <div style={{ display: "flex", gap: 12, alignItems: "center", flexWrap: "wrap" }}>
          <div style={{ fontSize: 30, fontWeight: 800, letterSpacing: "6px", fontFamily: "monospace", background: C.surfaceAlt, padding: "10px 20px", borderRadius: 10, border: "1px solid " + C.border }}>
            {company?.joinCode || "——————"}
          </div>
          <button type="button" onClick={copyCode} style={btnSecondary}>{copied ? "Copied ✓" : "Copy"}</button>
          <button type="button" onClick={regen} style={btnOutline}>Regenerate</button>
        </div>
      </div>

      {/* Pending approvals */}
      <div style={card}>
        <h3 style={{ fontSize: 15, fontWeight: 700, marginBottom: 12 }}>
          Pending Requests {pending.length > 0 && <Badge color="#FEFCE8" textColor="#CA8A04">{pending.length}</Badge>}
        </h3>
        {loading
          ? <p style={{ color: C.textMuted, fontSize: 13 }}>Loading…</p>
          : pending.length === 0
            ? <p style={{ color: C.textMuted, fontSize: 13 }}>No one is waiting to join right now.</p>
            : pending.map(m => (
              <div key={m.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 12, padding: "12px 14px", border: "1px solid " + C.border, borderRadius: 8, marginBottom: 8, flexWrap: "wrap" }}>
                <div>
                  <div style={{ fontWeight: 700, fontSize: 14 }}>{m.full_name || "(no name)"}</div>
                  <div style={{ fontSize: 12, color: C.textMuted }}>{m.email}</div>
                </div>
                <div style={{ display: "flex", gap: 8 }}>
                  <button type="button" disabled={busyId === m.id} onClick={() => doApprove(m)} style={btnSecondary}>Approve</button>
                  <button type="button" disabled={busyId === m.id} onClick={() => doRemove(m, "Deny the request from")} style={btnDanger}>Deny</button>
                </div>
              </div>
            ))}
      </div>

      {/* Active members */}
      <div style={card}>
        <h3 style={{ fontSize: 15, fontWeight: 700, marginBottom: 12 }}>Team Members</h3>
        {active.length === 0 && <p style={{ color: C.textMuted, fontSize: 13 }}>No active members yet.</p>}
        {active.map(m => {
          const isMe = m.id === user.id;
          const isOwnerRow = m.role === "Owner";
          const isEditing = editing === m.id;
          return (
            <div key={m.id} style={{ border: "1px solid " + C.border, borderRadius: 10, padding: 14, marginBottom: 10 }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 12, flexWrap: "wrap" }}>
                <div>
                  <div style={{ fontWeight: 700, fontSize: 14 }}>{m.full_name || "(no name)"} {isMe && <span style={{ fontSize: 11, color: C.textMuted }}>(you)</span>}</div>
                  <div style={{ fontSize: 12, color: C.textMuted }}>{m.email}</div>
                </div>
                <div style={{ display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap" }}>
                  {isOwnerRow
                    ? <Badge color="#EDE9FE" textColor="#7C3AED">Owner</Badge>
                    : (
                      <>
                        <Select value={m.role} onChange={v => doRole(m, v)} options={["Employee", "Manager", "Owner"]} style={{ width: 130 }} />
                        {!isEditing
                          ? <button type="button" onClick={() => openPerms(m)} style={{ ...btnOutline, fontSize: 12, padding: "6px 12px" }}>Edit Access</button>
                          : (
                            <>
                              <button type="button" disabled={busyId === m.id} onClick={() => savePerms(m)} style={{ ...btnSecondary, fontSize: 12, padding: "6px 12px" }}>Save</button>
                              <button type="button" onClick={() => setEditing(null)} style={{ ...btnOutline, fontSize: 12, padding: "6px 12px" }}>Cancel</button>
                            </>
                          )}
                        {!isMe && <button type="button" disabled={busyId === m.id} onClick={() => doRemove(m, "Remove")} style={btnDanger}>Remove</button>}
                      </>
                    )}
                </div>
              </div>

              {!isOwnerRow && (
                <div style={{ marginTop: 12 }}>
                  <div style={{ fontSize: 11, fontWeight: 700, color: C.textMuted, textTransform: "uppercase", letterSpacing: "0.5px", marginBottom: 8 }}>
                    Can access {isEditing ? "(tick to allow)" : ""}
                  </div>
                  <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(190px, 1fr))", gap: 8 }}>
                    {grantable.map(g => {
                      const on = isEditing ? draftPerms[g.id] : (m.permissions && m.permissions[g.id]);
                      return isEditing
                        ? <Checkbox key={g.id} checked={!!on} onChange={v => setDraftPerms(d => ({ ...d, [g.id]: v }))} label={g.label} />
                        : (
                          <div key={g.id} style={{ display: "flex", alignItems: "center", gap: 8, padding: "8px 12px", background: on ? "#F0FDF4" : C.surfaceAlt, borderRadius: 8, border: "1px solid " + (on ? "#BBF7D0" : C.border) }}>
                            <span>{on ? "✅" : "🔒"}</span>
                            <span style={{ fontSize: 12, fontWeight: 600 }}>{g.label}</span>
                          </div>
                        );
                    })}
                  </div>
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

function SettingsPage() {
  const { company, updateCompany } = useCompany();
  const { user } = useAuth();
  const importRef = useRef(null);
  const [form, setForm] = useState({
    companyName: company?.companyName || "",
    address: company?.address || "",
    phone: company?.phone || "",
    email: company?.email || "",
    website: company?.website || "",
    logoUrl: company?.logoUrl || "",
    primaryColor: company?.primaryColor || DEFAULT_PRIMARY,
    secondaryColor: company?.secondaryColor || DEFAULT_SECONDARY,
    shopAddress: company?.shopAddress || "",
    geofenceRadiusM: company?.geofenceRadiusM || 300,
  });
  const [message, setMessage] = useState("");
  const [lookupShop, setLookupShop] = useState(false);
  const [saving, setSaving] = useState(false);

  const save = async () => {
    setSaving(true);
    const ll = form.shopAddress ? await resolveLatLng(form.shopAddress) : null;
    await updateCompany({ ...form, shopLat: ll ? ll.lat : null, shopLng: ll ? ll.lng : null });
    setSaving(false);
    setMessage(form.shopAddress && !ll ? "Settings saved — couldn't pin the shop address, so the clock-in alert won't trigger." : "Settings saved.");
    setTimeout(() => setMessage(""), form.shopAddress && !ll ? 5000 : 2500);
  };

  const exportAll = () => {
    const data = { exportedAt: new Date().toISOString(), company, collections: {} };
    COLLECTIONS.forEach(c => { data.collections[c] = getCol(c); });
    downloadFile("buildmybill_backup_" + today() + ".json", JSON.stringify(data, null, 2), "application/json");
  };

  const [busy, setBusy] = useState("");

  const importAll = e => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async ev => {
      let parsed;
      try {
        parsed = JSON.parse(ev.target.result);
      } catch { window.alert("That file doesn't look like a BuildMyBill backup."); return; }
      const cols = parsed.collections || parsed;
      if (!cols || typeof cols !== "object") { window.alert("That file doesn't look like a BuildMyBill backup."); return; }
      if (!window.confirm("This REPLACES all of your company's current data with the backup. Continue?")) return;
      setBusy("Importing…");
      try {
        await db.deleteAllForCompany();
        const rowsByCol = {};
        COLLECTIONS.forEach(c => { if (Array.isArray(cols[c])) rowsByCol[c] = cols[c]; });
        await db.bulkInsert(rowsByCol);
        if (parsed.company) await updateCompany(parsed.company);
        window.location.reload();
      } catch (err) {
        setBusy("");
        window.alert("Import failed: " + (err.message || err));
      }
    };
    reader.readAsText(file);
    e.target.value = "";
  };

function LoginPage() {
  const { login, signup, checkCompanyCode } = useAuth();
  const [showModal, setShowModal] = useState(false);
  const [isRegister, setIsRegister] = useState(false);
  const [joinMode, setJoinMode] = useState(false);          // register: join existing vs create new
  const [form, setForm] = useState({ name: "", email: "", password: "", companyName: "", joinCode: "", remember: true });
  const [codeCompany, setCodeCompany] = useState(null);     // verified company name for the code
  const [verifying, setVerifying] = useState(false);
  const [error, setError] = useState("");
  const [info, setInfo] = useState("");
  const [submitting, setSubmitting] = useState(false);

  const f = k => v => setForm(p => ({ ...p, [k]: v }));
  const open = register => { setIsRegister(register); setJoinMode(false); setCodeCompany(null); setError(""); setInfo(""); setShowModal(true); };
  const switchJoin = (join) => { setJoinMode(join); setCodeCompany(null); setError(""); };

  const verifyCode = async () => {
    setError(""); setCodeCompany(null);
    const code = form.joinCode.trim();
    if (!/^\d{6}$/.test(code)) { setError("Enter the 6-digit code from your company owner."); return; }
    setVerifying(true);
    const r = await checkCompanyCode(code);
    setVerifying(false);
    if (!r.ok) { setError(r.error || "Couldn't check that code right now."); return; }
    if (!r.companyName) { setError("That code doesn't match any company — double-check it with your owner."); return; }
    setCodeCompany(r.companyName);
  };

  const handleSubmit = async e => {
    e.preventDefault();
    setError(""); setInfo("");
    if (!form.email.trim() || !form.password) { setError("Email and password are required."); return; }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(form.email.trim())) { setError("Enter a valid email address."); return; }
    if (isRegister && form.password.length < 6) { setError("Password must be at least 6 characters."); return; }
    if (isRegister && joinMode && !codeCompany) { setError("Verify your company code first."); return; }
    if (isRegister && !joinMode && !form.companyName.trim()) { setError("Company name is required."); return; }

    setSubmitting(true);
    let result;
    const name = form.name.trim() || form.email.split("@")[0];
    if (!isRegister) result = await login({ email: form.email, password: form.password, remember: form.remember });
    else if (joinMode) result = await signup({ name, email: form.email, password: form.password, joinCode: form.joinCode.trim() });
    else result = await signup({ name, email: form.email, password: form.password, companyName: form.companyName.trim() });
    setSubmitting(false);

    if (!result.ok) { setError(result.error || "Something went wrong. Please try again."); return; }
    if (result.needsConfirm) {
      setInfo(result.joined
        ? "Account created! Confirm your email, then sign in — your owner will approve your access."
        : "Account created! Check your email to confirm it, then sign in.");
      setIsRegister(false); setJoinMode(false);
      return;
    }
    // On success the auth listener swaps the whole app to the dashboard (or the pending screen).
  };

    heroH1: { fontSize: "clamp(34px, 6vw, 68px)", fontWeight: 900, margin: "0 0 20px", lineHeight: 1.05, letterSpacing: "-2px" },
    heroSub: { fontSize: "clamp(15px, 2vw, 19px)", opacity: 0.7, maxWidth: 580, margin: "0 auto 40px", lineHeight: 1.6 },
    btnGreen: { padding: "14px 32px", background: C.secondary, color: "#fff", border: "none", borderRadius: 10, fontWeight: 700, fontSize: 15, cursor: "pointer" },
    btnGhost: { padding: "14px 32px", background: "transparent", color: "#fff", border: "2px solid rgba(255,255,255,0.4)", borderRadius: 10, fontWeight: 700, fontSize: 15, cursor: "pointer" },
    section: { padding: "72px 5%" },
    sectionAlt: { padding: "72px 5%", background: "#F9FAFB" },
    sectionTag: { fontSize: 12, fontWeight: 700, color: C.secondary, textTransform: "uppercase", letterSpacing: "0.8px", marginBottom: 12 },

// Every signed-in member sees these; owner-only areas are admin.
const ALWAYS_VISIBLE = ["dashboard", "profile"];
const OWNER_ONLY = ["team", "settings", "subscriptions"];
// Live employee location — not owner-employee-grantable like other sections;
// only owners and managers ever see it, full stop.
const MANAGER_PLUS_ONLY = ["crew-locations", "shift-requests"];
// Nav items an owner can grant to employees (everything not always/owner-only).
const GRANTABLE = NAV.map(n => n.id).filter(id => !ALWAYS_VISIBLE.includes(id) && !OWNER_ONLY.includes(id) && !MANAGER_PLUS_ONLY.includes(id));

function canAccess(navId, user) {
  if (!user) return false;
  if (user.isOwner) return true;                    // owner sees everything
  if (ALWAYS_VISIBLE.includes(navId)) return true;
  if (OWNER_ONLY.includes(navId)) return false;
  if (MANAGER_PLUS_ONLY.includes(navId)) return user.role === "Manager";
  return !!(user.permissions && user.permissions[navId]);
}

const FORCE_DESKTOP_KEY = "bmb_force_desktop";
const FORCE_MOBILE_KEY = "bmb_force_mobile";
const ACTIVE_CLOCK_KEY = "bmb_active_clock";

function useIsMobile() {
  const q = "(max-width: 820px)";
  // Force-mobile lets you preview the field app on a computer (and adds "?mobile=1").
  const forced = () => storage.get(FORCE_MOBILE_KEY) === "1" || /[?&]mobile=1/.test(window.location.href);
  const val = () => forced() || (storage.get(FORCE_DESKTOP_KEY) !== "1" && window.matchMedia(q).matches);
  const [mobile, setMobile] = useState(val);
  useEffect(() => {
    const mq = window.matchMedia(q);
    const on = () => setMobile(val());
    mq.addEventListener ? mq.addEventListener("change", on) : mq.addListener(on);
    return () => { mq.removeEventListener ? mq.removeEventListener("change", on) : mq.removeListener(on); };
  }, []);
  return mobile;
}

// Current position as "lat, lng", or null. Never blocks the caller for long.
function getGeo(timeout = 8000) {
  return new Promise(resolve => {
    if (!navigator.geolocation) return resolve(null);
    navigator.geolocation.getCurrentPosition(
      p => resolve(p.coords.latitude.toFixed(6) + ", " + p.coords.longitude.toFixed(6)),
      () => resolve(null),
      { enableHighAccuracy: true, timeout, maximumAge: 60000 }
    );
  });
}

const timeHM = d => { const p = n => String(n).padStart(2, "0"); return p(d.getHours()) + ":" + p(d.getMinutes()); };
const fmtDur = ms => {
  const s = Math.max(0, Math.floor(ms / 1000));
  const p = n => String(n).padStart(2, "0");
  return Math.floor(s / 3600) + ":" + p(Math.floor((s % 3600) / 60)) + ":" + p(s % 60);
};

function isStandalone() {
  return window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
}
function isIOS() {
  return /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
}
// The captured beforeinstallprompt event (Android/Chrome), tracked reactively.
function useInstallPrompt() {
  const [evt, setEvt] = useState(() => window.__bmbInstall || null);
  useEffect(() => {
    const on = () => setEvt(window.__bmbInstall || null);
    window.addEventListener("bmb-installready", on);
    return () => window.removeEventListener("bmb-installready", on);
  }, []);
  return evt;
}

// 📊 My Hours — an employee's own clocked-shift history, grouped by month, with
// a way to request a correction on a shift instead of editing it directly
// (e.g. forgot to clock out and ended up with a 23-hour shift). Requests go to
// the owner/managers for approval — see ShiftRequestsPage and
// supabase/migration_shift_requests.sql for the email side.
function MyHoursSheet({ employee, onClose }) {
  useDataVersion();
  const shifts = getCol("shifts").filter(s => s.employeeName === employee).sort((a, b) => (b.entryDate || "").localeCompare(a.entryDate || ""));
  const requests = getCol("shiftrequests").filter(r => r.employeeName === employee);

  const oneYearAgo = dateStr(new Date(Date.now() - 366 * 86400000));
  const recent = shifts.filter(s => (s.entryDate || "") >= oneYearAgo);
  const totalHours = recent.reduce((s, x) => s + num(x.hours), 0);

  const months = {};
  recent.forEach(s => { const k = (s.entryDate || "").slice(0, 7); if (!months[k]) months[k] = []; months[k].push(s); });
  const monthKeys = Object.keys(months).sort((a, b) => b.localeCompare(a));
  const monthLabel = k => { const [y, m] = k.split("-").map(Number); return new Date(y, m - 1, 1).toLocaleDateString(undefined, { month: "long", year: "numeric" }); };

  const [expanded, setExpanded] = useState(() => today().slice(0, 7));
  const [editingId, setEditingId] = useState(null);
  const [form, setForm] = useState({ start: "", end: "", reason: "" });
  const [msg, setMsg] = useState("");

  const openEdit = s => { setEditingId(s._id); setForm({ start: s.startTime || "", end: s.endTime || "", reason: "" }); setMsg(""); };
  const submitRequest = s => {
    if (!form.start || !form.end || !form.reason.trim()) { setMsg("Fill in the corrected times and a reason."); return; }
    db.create("shiftrequests", {
      employeeName: employee, shiftId: s._id, entryDate: s.entryDate,
      originalStartTime: s.startTime, originalEndTime: s.endTime, originalHours: s.hours,
      requestedStartTime: form.start, requestedEndTime: form.end, reason: form.reason.trim(),
      status: "Pending",
    });
    notifyData();
    setEditingId(null);
    setMsg("Request sent — your owner/manager will get an email.");
    setTimeout(() => setMsg(""), 4000);
  };

  return (
    <MobileSheet title="My Hours" onClose={onClose}>
      <div style={{ padding: 16 }}>
        <div style={{ fontSize: 12, color: C.textMuted, marginBottom: 16 }}>{totalHours.toFixed(1)} hours clocked over the last 12 months</div>

        {monthKeys.length === 0 && <div style={{ textAlign: "center", color: C.textMuted, padding: "20px 0" }}>No clocked shifts yet.</div>}

        {monthKeys.map(k => {
          const rows = months[k];
          const monthTotal = rows.reduce((s, x) => s + num(x.hours), 0);
          const isOpen = expanded === k;
          return (
            <div key={k} style={{ marginBottom: 10 }}>
              <button type="button" onClick={() => setExpanded(isOpen ? null : k)} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", width: "100%", background: C.surfaceAlt, border: "none", borderRadius: 10, padding: "12px 14px", cursor: "pointer", textAlign: "left" }}>
                <span style={{ fontWeight: 700, fontSize: 14 }}>{isOpen ? "▾" : "▸"} {monthLabel(k)}</span>
                <span style={{ fontSize: 13, color: C.textMuted }}>{monthTotal.toFixed(1)} h · {rows.length} shift{rows.length === 1 ? "" : "s"}</span>
              </button>
              {isOpen && rows.map(s => {
                const req = requests.find(r => r.shiftId === s._id && r.status !== "Rejected");
                return (
                  <div key={s._id} style={{ ...mCard, marginTop: 8, padding: 14 }}>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 10 }}>
                      <div>
                        <div style={{ fontWeight: 700, fontSize: 14 }}>{s.entryDate}</div>
                        <div style={{ fontSize: 12, color: C.textMuted }}>{s.startTime || "?"}–{s.endTime || "?"}</div>
                      </div>
                      <div style={{ fontWeight: 800, color: C.accent }}>{hmm(num(s.hours))}</div>
                    </div>
                    {req
                      ? <div style={{ marginTop: 8 }}><StatusBadge status={req.status} /></div>
                      : editingId === s._id
                        ? (
                          <div style={{ marginTop: 10, borderTop: "1px solid " + C.border, paddingTop: 10 }}>
                            {dayWorkContext(employee, s.entryDate).length > 0 && (
                              <div style={{ background: C.surfaceAlt, borderRadius: 8, padding: 10, marginBottom: 10, fontSize: 12 }}>
                                <div style={{ fontWeight: 700, marginBottom: 4 }}>You logged that day:</div>
                                {dayWorkContext(employee, s.entryDate).map(e => (
                                  <div key={e._id}>{e.jobName || "Work"} · {e.startTime || "?"}–{e.endTime || "?"}</div>
                                ))}
                              </div>
                            )}
                            <div style={{ display: "flex", gap: 10 }}>
                              <div style={{ flex: 1 }}><label style={mLbl}>Actually started</label><input type="time" value={form.start} onChange={e => setForm(f => ({ ...f, start: e.target.value }))} style={mInput} /></div>
                              <div style={{ flex: 1 }}><label style={mLbl}>Actually ended</label><input type="time" value={form.end} onChange={e => setForm(f => ({ ...f, end: e.target.value }))} style={mInput} /></div>
                            </div>
                            <label style={mLbl}>Reason</label>
                            <input value={form.reason} onChange={e => setForm(f => ({ ...f, reason: e.target.value }))} placeholder="Forgot to clock out, left around 5pm…" style={mInput} />
                            {msg && <div style={{ fontSize: 12, color: msg.includes("sent") ? C.green : "#DC2626", marginTop: 8 }}>{msg}</div>}
                            <div style={{ display: "flex", gap: 10, marginTop: 10 }}>
                              <button type="button" onClick={() => setEditingId(null)} style={{ ...btnOutline, flex: 1 }}>Cancel</button>
                              <button type="button" onClick={() => submitRequest(s)} style={{ ...btnSecondary, flex: 1 }}>Send request</button>
                            </div>
                          </div>
                        )
                        : <button type="button" onClick={() => openEdit(s)} style={{ background: "none", border: "none", color: C.accent, fontSize: 12, fontWeight: 700, cursor: "pointer", padding: 0, marginTop: 8 }}>Request a correction</button>}
                  </div>
                );
              })}
            </div>
          );
        })}
      </div>
    </MobileSheet>
  );
}

function EffBadge({ pct, size = 44 }) {

  );
  const over = pct > 100;
  const color = over ? "#2563EB" : pct >= 85 ? C.green : pct >= 65 ? "#D97706" : "#DC2626";
  const label = pct > 999 ? "999+" : (pct + "%");
  const fs = label.length >= 5 ? (size > 48 ? 12 : 10) : (size > 40 ? 14 : 12);
  return (
    <div title={over ? "Over 100% — more job time logged than clocked; check clock-ins" : undefined}
      style={{ width: size, height: size, borderRadius: "50%", border: "3px solid " + color, display: "flex", alignItems: "center", justifyContent: "center", fontWeight: 900, fontSize: fs, color, flexShrink: 0 }}>
      {label}
    </div>
  );
}
