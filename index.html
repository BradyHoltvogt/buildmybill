/* ─── Printable timesheets (payroll) ─────────────────────────────────────────
   A hand-off document for the accountant: a summary page of everyone's hours
   for a pay period, then one signed sheet per person behind it.

   The hours come from `shifts` — the clocked in/out envelope, which is what
   actually gets paid — NOT from `timeentries`, which is job time for billing
   and efficiency and routinely doesn't add up to a paid day. Anyone who logs
   job time but never clocks in would silently print as zero hours, so the sheet
   says which basis it used, can be switched to logged time, and calls out by
   name anyone who has hours on the other basis but none on this one.

   Days are subtotalled by week rather than run together, because overtime rules
   differ by province and by employment agreement — this gives the accountant the
   weekly figure their own rule needs instead of encoding a guess about it here. */

const TS_DOW = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];

function tsWeekStart(iso) {
  const d = new Date(iso + "T00:00:00");
  if (isNaN(d)) return iso;
  d.setDate(d.getDate() - d.getDay());
  return dateStr(d);
}

function tsFriendly(iso) {
  const d = new Date(iso + "T00:00:00");
  if (isNaN(d)) return iso || "";
  return d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
}

// Pay periods people actually run. Each returns [start, end] as YYYY-MM-DD.
function tsPresets() {
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth();
  const mk = (a, b) => [dateStr(a), dateStr(b)];
  const sunday = new Date(now); sunday.setDate(sunday.getDate() - sunday.getDay());
  const lastSun = new Date(sunday); lastSun.setDate(lastSun.getDate() - 7);
  const lastSat = new Date(sunday); lastSat.setDate(lastSat.getDate() - 1);
  const twoWeeks = new Date(now); twoWeeks.setDate(twoWeeks.getDate() - 13);
  return [
    { id: "this-month", label: "This month", range: () => mk(new Date(y, m, 1), new Date(y, m + 1, 0)) },
    { id: "last-month", label: "Last month", range: () => mk(new Date(y, m - 1, 1), new Date(y, m, 0)) },
    { id: "this-week", label: "This week", range: () => mk(sunday, now) },
    { id: "last-week", label: "Last week", range: () => mk(lastSun, lastSat) },
    { id: "last-14", label: "Last 14 days", range: () => mk(twoWeeks, now) },
  ];
}

// One flat list of "a person worked these hours on this day", from whichever
// basis is selected. Attribution is by plain-text name, same as everywhere else
// time gets tied to a person in this app.
function tsRows(basis, start, end) {
  const inRange = d => (!start || (d || "") >= start) && (!end || (d || "") <= end);
  if (basis === "logged") {
    return getCol("timeentries")
      .filter(e => e.source !== "mobile-clock" && inRange(e.entryDate))
      .map(e => ({
        date: e.entryDate || "", name: e.employeeName || "Unknown",
        start: e.startTime || "", end: e.endTime || "",
        hours: num(e.hoursWorked), note: e.jobName || "",
      }));
  }
  return getCol("shifts")
    .filter(s => inRange(s.entryDate))
    .map(s => ({
      date: s.entryDate || "", name: s.employeeName || "Unknown",
      start: s.startTime || "", end: s.endTime || "",
      hours: num(s.hours), note: "",
    }));
}

function tsGroup(rows) {
  const by = {};
  rows.forEach(r => { (by[r.name] = by[r.name] || []).push(r); });
  return Object.keys(by).sort((a, b) => a.localeCompare(b)).map(name => {
    const list = by[name].slice().sort((a, b) => (a.date || "").localeCompare(b.date || "") || (a.start || "").localeCompare(b.start || ""));
    const weeks = {};
    list.forEach(r => { const k = tsWeekStart(r.date); (weeks[k] = weeks[k] || []).push(r); });
    return {
      name,
      rows: list,
      hours: list.reduce((s, r) => s + r.hours, 0),
      days: new Set(list.map(r => r.date)).size,
      weeks: Object.keys(weeks).sort().map(k => ({ start: k, rows: weeks[k], hours: weeks[k].reduce((s, r) => s + r.hours, 0) })),
    };
  });
}

const tsTd = { fontSize: 12, padding: "6px 8px", borderBottom: "1px solid " + tsLine, color: tsInk };
const tsNum = { ...tsTd, textAlign: "right", fontVariantNumeric: "tabular-nums" };

/* ─── Crew locations (Owner/Manager only) ────────────────────────────────────
   Live location + trail for whoever is currently clocked in (backed by
   "activeclocks", which only exists while someone's on the clock), plus a
   "Recent Shifts" history where past shifts' routes can still be viewed —
   each shift keeps the `clockRecordId` linking it to its "locationpings", so
   the trail survives clock-out even though the "currently active" marker
   doesn't. Since other devices' writes aren't pushed to us in real time, this
   page polls the server directly. */
function useCrewLocationsPolling(pollMs = 20000) {
  useDataVersion();
  useEffect(() => {
    let cancelled = false;
    const refresh = () => { if (!cancelled) { db.refreshCollection("activeclocks"); db.refreshCollection("locationpings"); } };
    refresh();
    const id = setInterval(refresh, pollMs);
    return () => { cancelled = true; clearInterval(id); };
  }, [pollMs]);
}

function CrewMapModal({ session, pings, onClose, live }) {
  const containerRef = useRef(null);
  useEffect(() => {
    if (!containerRef.current || !window.L || pings.length === 0) return;
    const latlngs = pings.map(p => [p.lat, p.lng]);
    const map = L.map(containerRef.current).setView(latlngs[latlngs.length - 1], 15);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19, attribution: "&copy; OpenStreetMap contributors",
    }).addTo(map);
    if (latlngs.length > 1) {
      const trail = L.polyline(latlngs, { color: C.secondary, weight: 4 }).addTo(map);
      L.circleMarker(latlngs[0], { radius: 6, color: "#6B7280", fillColor: "#6B7280", fillOpacity: 1 }).addTo(map).bindPopup("Clocked in here");
      map.fitBounds(trail.getBounds(), { padding: [30, 30] });
    }
    L.marker(latlngs[latlngs.length - 1]).addTo(map).bindPopup(live ? "Current location" : "Clocked out here").openPopup();
    return () => map.remove();
  }, [session._id, pings.length]);

  return (
    <Modal title={session.employeeName + (live ? " — live location" : " — route")} width={720} onClose={onClose}>
      {pings.length === 0
        ? <p style={{ color: C.textMuted, fontSize: 13 }}>No location recorded for this shift.</p>
        : (
          <>
            <div ref={containerRef} style={{ height: 420, borderRadius: 10, overflow: "hidden" }} />
            <div style={{ fontSize: 12, color: C.textMuted, marginTop: 10 }}>
              {pings.length} location ping{pings.length === 1 ? "" : "s"}{live ? " since clock-in · updates automatically while they're on the clock" : " over this shift"}
            </div>
          </>
        )}
    </Modal>
  );
}

                </div>
              );
            })}
          </div>
        )}

      <h3 style={{ fontSize: 15, fontWeight: 700, marginBottom: 12 }}>Recent Shifts</h3>
      {recentShifts.length === 0
        ? <p style={{ color: C.textMuted, fontSize: 13 }}>No finished shifts with a recorded route yet.</p>
        : (
          <div style={card}>
            <DataTable
              columns={[
                { key: "employeeName", label: "Employee" },
                { key: "entryDate", label: "Date" },
                { key: "startTime", label: "Start" },
                { key: "endTime", label: "End" },
                { key: "hours", label: "Hours", render: v => num(v).toFixed(2) + "h" },
              ]}
              rows={recentShifts}
              onView={s => setHistorySelected(s)}
              emptyMessage="No finished shifts yet."
            />
          </div>
        )}

      {selected && <CrewMapModal session={selected} pings={pingsFor(selected._id)} onClose={() => setSelected(null)} live />}
      {historySelected && <CrewMapModal session={historySelected} pings={pingsFor(historySelected.clockRecordId)} onClose={() => setHistorySelected(null)} />}
    </div>
  );
}

/* ─── Shift requests (Owner/Manager only) ─────────────────────────────────────
   Employees can't edit a clocked shift directly — they request a correction
   from "My Hours" on the field app (e.g. forgot to clock out, ended up with a
   23-hour shift). This is where owners/managers review it: approving patches
   the underlying `shifts` record directly; rejecting just closes the request.
   An email goes out to the owner + managers on submission (see
   supabase/migration_shift_requests.sql). */
function ShiftRequestsPage() {
  useDataVersion();
  const { user } = useAuth();
  const requests = getCol("shiftrequests");
  const pending = requests.filter(r => r.status === "Pending");
  const resolved = requests.filter(r => r.status !== "Pending");

  const approve = req => {
    const shift = getCol("shifts").find(s => s._id === req.shiftId);
    if (shift) {
      db.update("shifts", {
        ...shift, startTime: req.requestedStartTime, endTime: req.requestedEndTime,
        hours: hoursBetween(req.requestedStartTime, req.requestedEndTime),
      });
    }
    db.update("shiftrequests", { ...req, status: "Approved", reviewedBy: user?.name || "", reviewedAt: new Date().toISOString() });
    notifyData();
  };
  const reject = req => {
    db.update("shiftrequests", { ...req, status: "Rejected", reviewedBy: user?.name || "", reviewedAt: new Date().toISOString() });
    notifyData();
  };

  const requestCard = (req, editable) => {
    const context = dayWorkContext(req.employeeName, req.entryDate);
    return (
      <div key={req._id} style={{ ...card, marginBottom: 14 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 10, marginBottom: 10 }}>
          <div>
            <div style={{ fontWeight: 700, fontSize: 15 }}>{req.employeeName}</div>
            <div style={{ fontSize: 12, color: C.textMuted }}>{req.entryDate}</div>
          </div>
          <StatusBadge status={req.status} />
        </div>
        <div className="grid-2" style={{ gap: 8, marginBottom: 10 }}>
          <div>
            <div style={{ fontSize: 10, fontWeight: 700, color: C.textMuted, textTransform: "uppercase", letterSpacing: "0.5px" }}>Logged</div>
            <div style={{ fontSize: 14 }}>{req.originalStartTime || "?"}–{req.originalEndTime || "?"} ({num(req.originalHours).toFixed(2)}h)</div>
          </div>
          <div>
            <div style={{ fontSize: 10, fontWeight: 700, color: C.textMuted, textTransform: "uppercase", letterSpacing: "0.5px" }}>Requested</div>
            <div style={{ fontSize: 14, fontWeight: 700, color: C.accent }}>{req.requestedStartTime || "?"}–{req.requestedEndTime || "?"} ({hoursBetween(req.requestedStartTime, req.requestedEndTime).toFixed(2)}h)</div>
          </div>
        </div>
        {req.reason && <div style={{ fontSize: 13, marginBottom: 10 }}><strong>Reason:</strong> {req.reason}</div>}
        {context.length > 0 && (
          <div style={{ background: C.surfaceAlt, borderRadius: 8, padding: 10, marginBottom: 10 }}>
            <div style={{ fontSize: 11, fontWeight: 700, color: C.textMuted, textTransform: "uppercase", letterSpacing: "0.5px", marginBottom: 6 }}>Logged that day</div>
            {context.map(e => (
              <div key={e._id} style={{ fontSize: 12, marginBottom: 3 }}>
                {e.jobName || "Work"} · {e.startTime || "?"}–{e.endTime || "?"}{num(e.hoursWorked) ? " (" + num(e.hoursWorked).toFixed(2) + "h)" : ""}
              </div>
            ))}
          </div>
        )}
        {editable
          ? (
            <div style={{ display: "flex", gap: 10 }}>
              <button type="button" onClick={() => approve(req)} style={{ ...btnSecondary, flex: 1 }}>Approve</button>
              <button type="button" onClick={() => reject(req)} style={{ ...btnDanger, flex: 1 }}>Reject</button>
            </div>
          )
          : req.reviewedBy && (
            <div style={{ fontSize: 12, color: C.textMuted }}>Reviewed by {req.reviewedBy}{req.reviewedAt ? " · " + new Date(req.reviewedAt).toLocaleDateString() : ""}</div>
          )}
      </div>
    );
  };

  return (
    <div>
      <PageHeader title="Shift Requests" subtitle="Employee-requested corrections to clocked shifts — approving here updates the shift" />
      <h3 style={{ fontSize: 15, fontWeight: 700, marginBottom: 12 }}>Pending ({pending.length})</h3>
      {pending.length === 0
        ? <EmptyState icon="🕘" title="No pending requests" subtitle="When an employee requests a shift correction from “My Hours” on the field app, it shows up here." />
        : pending.map(r => requestCard(r, true))}
      {resolved.length > 0 && (
        <>
          <h3 style={{ fontSize: 15, fontWeight: 700, margin: "24px 0 12px" }}>History</h3>
          {resolved.map(r => requestCard(r, false))}
        </>
      )}
    </div>
  );
}

/* ─── Billing & reports ──────────────────────────────────────────────────── */
function BillingPage() {
  const entries = useMemo(() => db.getAll("timeentries", {}, { limit: 1000 }).items, []);
  const equipmentLogs = useMemo(() => db.getAll("equipmentlogs", {}, { limit: 1000 }).items, []);
  const employees = useMemo(() => db.getAll("employees").items, []);
  const [filters, setFilters] = useState({ startDate: "", endDate: "", employee: "", job: "" });

  const rateFor = name => {
    const emp = employees.find(x => sameName(x.fullName, name));
    return emp ? num(emp.hourlyRate) : 0;
  };

  const filtered = entries.filter(e => {
    if (filters.startDate && (e.entryDate || "") < filters.startDate) return false;
    if (filters.endDate && (e.entryDate || "") > filters.endDate) return false;
    if (filters.employee && e.employeeName !== filters.employee) return false;
    if (filters.job && !String(e.jobName || "").toLowerCase().includes(filters.job.toLowerCase())) return false;
    return true;
  });

  // Equipment hours billed alongside labour — logged from the daily log / time
  // tracking whenever equipment is picked, and rolled onto the equipment's
  // running total (see logEquipmentUsage).
  const filteredEquipment = equipmentLogs.filter(l => {
    if (filters.startDate && (l.entryDate || "") < filters.startDate) return false;
    if (filters.endDate && (l.entryDate || "") > filters.endDate) return false;
    if (filters.employee && l.employeeName !== filters.employee) return false;
    if (filters.job && !String(l.jobName || "").toLowerCase().includes(filters.job.toLowerCase())) return false;
    return true;
  });

  const totalHours = filtered.reduce((s, e) => s + num(e.hoursWorked), 0);
  const totalLabourCost = filtered.reduce((s, e) => s + num(e.hoursWorked) * rateFor(e.employeeName), 0);
  const totalMiles = filtered.reduce((s, e) => s + num(e.mileageDriven), 0);
  const totalEquipmentHours = filteredEquipment.reduce((s, l) => s + num(l.hoursUsed), 0);
  const totalEquipmentCost = filteredEquipment.reduce((s, l) => s + num(l.cost), 0);

  const exportCSV = () => {
    const rows = [
      ["Date", "Employee", "Job", "Hours", "Rate", "Labour Cost", "Miles", "Equipment", "Description"],
      ...filtered.map(e => [
        e.entryDate, e.employeeName, e.jobName, num(e.hoursWorked).toFixed(2),
        rateFor(e.employeeName).toFixed(2), (num(e.hoursWorked) * rateFor(e.employeeName)).toFixed(2),
        num(e.mileageDriven), e.equipmentUsed, e.workDescription,
      ]),
      [],
      ["", "", "TOTAL", totalHours.toFixed(2), "", totalLabourCost.toFixed(2), totalMiles],
      [],
      ["EQUIPMENT USAGE"],
      ["Date", "Equipment", "Employee", "Job", "Hours", "Rate", "Billed"],
      ...filteredEquipment.map(l => [l.entryDate, l.equipmentName, l.employeeName, l.jobName, num(l.hoursUsed).toFixed(2), num(l.billingRatePerHour).toFixed(2), num(l.cost).toFixed(2)]),
      [],
      ["", "", "", "TOTAL", totalEquipmentHours.toFixed(2), "", totalEquipmentCost.toFixed(2)],
      [],
      ["", "", "", "", "", "GRAND TOTAL", (totalLabourCost + totalEquipmentCost).toFixed(2)],
    ];
    downloadFile("billing_report_" + today() + ".csv", toCSV(rows), "text/csv;charset=utf-8");
  };

  return (
    <div>
      <PageHeader
        title="Billing & Reports"
        subtitle="Generate billing reports from logged time and equipment usage"
        action={<button type="button" onClick={exportCSV} style={btnSecondary}>📊 Export CSV</button>}

      <div style={{ ...card, marginBottom: 20 }}>

          <Field label="Employee" style={{ marginBottom: 0 }}>
            <select value={filters.employee} onChange={e => setFilters(f => ({ ...f, employee: e.target.value }))} style={{ ...inputCls, width: 180 }}>
              <option value="">All employees</option>
              {[...new Set(entries.map(e => e.employeeName).filter(Boolean))].map(n => <option key={n} value={n}>{n}</option>)}
            </select>
          </Field>
          <Field label="Job contains" style={{ marginBottom: 0 }}>
            <TextInput value={filters.job} onChange={v => setFilters(f => ({ ...f, job: v }))} placeholder="Job name…" style={{ width: 180 }} />
          </Field>
          <button type="button" onClick={() => setFilters({ startDate: "", endDate: "", employee: "", job: "" })} style={btnOutline}>Clear</button>
        </div>
      </div>

      <div className="grid-3" style={{ marginBottom: 20 }}>
        <StatCard label="Total Hours" value={totalHours.toFixed(2)} />
        <StatCard label="Labour Cost" value={fmt(totalLabourCost)} />
        <StatCard label="Entries" value={filtered.length} />
      </div>

      <div className="grid-3" style={{ marginBottom: 20 }}>
        <StatCard label="Equipment Hours" value={totalEquipmentHours.toFixed(2)} />
        <StatCard label="Equipment Cost" value={fmt(totalEquipmentCost)} />
        <StatCard label="Total Billed" value={fmt(totalLabourCost + totalEquipmentCost)} />
      </div>

      <div style={{ ...card, marginBottom: 20 }}>
        <DataTable
          columns={[
            { key: "entryDate", label: "Date" },
            { key: "employeeName", label: "Employee" },
            { key: "jobName", label: "Job" },
            { key: "hoursWorked", label: "Hours", render: v => num(v).toFixed(2) + "h" },
            { key: "cost", label: "Labour Cost", render: (_v, row) => fmt(num(row.hoursWorked) * rateFor(row.employeeName)) },
            { key: "mileageDriven", label: "Miles", render: v => (num(v) ? num(v) + " mi" : "—") },
            { key: "equipmentUsed", label: "Equipment" },
          ]}
          rows={filtered}
          emptyMessage="No entries match your filters."
        />
      </div>

      <div style={card}>
        <h3 style={{ fontSize: 15, fontWeight: 700, marginBottom: 16 }}>Equipment Usage</h3>
        <DataTable
          columns={[
            { key: "entryDate", label: "Date" },
            { key: "equipmentName", label: "Equipment" },
            { key: "employeeName", label: "Employee" },
            { key: "jobName", label: "Job" },
            { key: "hoursUsed", label: "Hours", render: v => num(v).toFixed(2) + "h" },
            { key: "cost", label: "Billed", render: v => fmt(num(v)) },
          ]}
          rows={filteredEquipment}
          emptyMessage="No equipment usage in range — pick equipment on the daily log or time tracking to bill it here."
        />
      </div>
    </div>
  );
}

/* ─── Schedule ───────────────────────────────────────────────────────────── */
/* ─── Schedule ───────────────────────────────────────────────────────────────
   Shared by the desktop calendar and the field app's calendar. Both show the
   same month grid off the same rules, so "what's on Thursday" is one answer
   whichever device is asking.
   ────────────────────────────────────────────────────────────────────────── */

// Stage names that mean the work is finished. Stages are company-defined in
// Workspace setup, so there's no structural flag to read — this is every
// "done" name the shipped industry presets use, matched case-insensitively.
// A company that invents its own final stage name keeps seeing those jobs on
// the calendar, which is the safe direction to be wrong in.
const DONE_STAGES = ["completed", "complete", "done", "closed", "delivered", "picked up", "finished", "cancelled", "canceled"];
const jobIsDone = j => DONE_STAGES.indexOf(String(j.jobStatus || "").trim().toLowerCase()) > -1;

// The days a job occupies, as YYYY-MM-DD strings — they compare and sort
// correctly as plain text, so there's no Date arithmetic and no timezone edge.
//
// An unfinished job does NOT drop off the calendar when its end date passes:
// it carries forward onto every day since, through today. Work that ran long
// is still work someone has to do, and it belongs on today's square rather
// than buried back on the day it was once meant to end. It never runs past
// today — tomorrow's square is for what's actually planned.
function jobSpan(job, t) {
  if (!job.startDate) return null;
  const start = job.startDate;
  const planned = job.endDate && job.endDate > start ? job.endDate : start;
  const carried = !jobIsDone(job) && planned < t;
  return { start, planned, end: carried ? t : planned, carried };
}

const spanMap = (jobs, t) => {
  const m = {};
  jobs.forEach(j => { const s = jobSpan(j, t); if (s) m[j._id] = s; });
  return m;
};
const jobsOnDay = (jobs, spans, ds) => jobs.filter(j => {
  const s = spans[j._id];
  return s && ds >= s.start && ds <= s.end;
});
// True only on the days a job has spilled PAST its planned end — the days it
// was legitimately booked for aren't "carried over".
const isCarryDay = (spans, id, ds) => !!spans[id] && spans[id].carried && ds > spans[id].planned;

// Every square of a month view, including enough of the neighbouring months to
// finish the first and last week rows — so the grid is always a clean
// rectangle instead of trailing off mid-row.
function monthGrid(year, month) {
  const cells = [];
  for (let i = new Date(year, month, 1).getDay(); i > 0; i--) cells.push({ date: new Date(year, month, 1 - i), inMonth: false });
  const total = new Date(year, month + 1, 0).getDate();
  for (let d = 1; d <= total; d++) cells.push({ date: new Date(year, month, d), inMonth: true });
  for (let d = 1; cells.length % 7; d++) cells.push({ date: new Date(year, month, total + d), inMonth: false });
  return cells;
}

const WEEKDAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const monthLabel = d => d.toLocaleString("default", { month: "long", year: "numeric" });
const longDay = ds => new Date(ds + "T00:00:00").toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric", year: "numeric" });

// What's on one day, in full. The calendar squares are deliberately too small
// for a whole job title, so this is where the truncated text goes to be read.
function ScheduleDayList({ dayStr, jobs, spans, onOpenJob }) {
  if (!jobs.length) {
    return <p style={{ color: C.textMuted, fontSize: 13, textAlign: "center", padding: "20px 0" }}>Nothing scheduled for this day.</p>;
  }
  return (
    <div>
      {jobs.map(j => {
        const s = spans[j._id] || {};
        return (
          <div key={j._id} style={{ border: "1px solid " + C.border, borderRadius: 10, padding: 12, marginBottom: 8, background: C.surface }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 10 }}>
              <div style={{ fontWeight: 700, fontSize: 14, minWidth: 0 }}>{j.jobTitle}</div>
              <StatusBadge status={j.jobStatus} />
            </div>
            {j.clientName && <div style={{ fontSize: 12.5, color: C.textMuted, marginTop: 3 }}>{j.clientName}</div>}
            <div style={{ fontSize: 12, color: C.textMuted, marginTop: 4 }}>
              {j.startDate}{s.planned && s.planned !== j.startDate ? " → " + s.planned : ""}
            </div>
            {isCarryDay(spans, j._id, dayStr) && (
              <div style={{ fontSize: 12, color: "#92400E", background: "#FFFBEB", border: "1px solid #FDE68A", borderRadius: 6, padding: "5px 8px", marginTop: 6 }}>
                ↻ Carried over — was due {s.planned} and isn't finished yet.
              </div>
            )}
            {Array.isArray(j.assignedEmployees) && j.assignedEmployees.length > 0 && (
              <div style={{ fontSize: 12, color: C.textMuted, marginTop: 4 }}>👷 {j.assignedEmployees.join(", ")}</div>
            )}
            <div style={{ display: "flex", gap: 12, alignItems: "center", marginTop: 8, flexWrap: "wrap" }}>
              {j.jobAddress && <MapLink query={j.jobAddress} label="Directions" />}
              {onOpenJob && (
                <button type="button" onClick={() => onOpenJob(j)} style={{ background: "none", border: "none", color: C.accent, fontWeight: 700, fontSize: 12.5, cursor: "pointer", padding: 0 }}>
                  {relabel("Open job")} →
                </button>
              )}
            </div>
          </div>
        );
      })}
    </div>
  );
}

// Fixed, so every square in the month is identical and no week row ends up
// taller than its neighbours just because someone booked three jobs that day.
const CAL_CELL_H = 124;
const CAL_CHIPS = 3;   // chips that fit above the "+N more" line

function SchedulePage() {
  const { navigate } = useRouter();
  const t = today();
  const [cursor, setCursor] = useState(() => new Date());
  const [showDone, setShowDone] = useState(false);
  const [openDay, setOpenDay] = useState(null);

  const dated = useMemo(() => db.getAll("jobs").items.filter(j => j.startDate), []);
  const jobs = useMemo(() => showDone ? dated : dated.filter(j => !jobIsDone(j)), [dated, showDone]);
  const spans = useMemo(() => spanMap(jobs, t), [jobs, t]);
  const doneCount = useMemo(() => dated.filter(jobIsDone).length, [dated]);

  const year = cursor.getFullYear();
  const month = cursor.getMonth();
  const cells = useMemo(() => monthGrid(year, month), [year, month]);

  return (
    <div>
      <PageHeader title="Schedule" subtitle="Jobs plotted across the calendar" />
      <div style={card}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 16, gap: 12, flexWrap: "wrap" }}>
          <button type="button" onClick={() => setCursor(new Date(year, month - 1, 1))} style={btnOutline}>← Previous</button>
          <h2 style={{ fontSize: 20, fontWeight: 700 }}>{monthLabel(cursor)}</h2>
          <div style={{ display: "flex", gap: 8 }}>
            <button type="button" onClick={() => setCursor(new Date())} style={btnOutline}>Today</button>
            <button type="button" onClick={() => setCursor(new Date(year, month + 1, 1))} style={btnOutline}>Next →</button>
          </div>
        </div>

        {/* minmax(0, 1fr) — not a plain 1fr — is what actually holds the seven
            columns to the same width. A bare 1fr floors at its content's
            minimum size, so one long job title widens its own column and
            squeezes the other six. With the floor at 0 the columns are always
            equal and the title inside a chip is what gives, via an ellipsis. */}
        <div style={{ display: "grid", gridTemplateColumns: "repeat(7, minmax(0, 1fr))", gap: 4 }}>
          {WEEKDAYS.map(d => (
            <div key={d} style={{ textAlign: "center", fontSize: 11, fontWeight: 700, color: C.textMuted, padding: "8px 4px", textTransform: "uppercase" }}>{d}</div>
          ))}
          {cells.map(({ date, inMonth }) => {
            const ds = dateStr(date);
            const dayJobs = jobsOnDay(jobs, spans, ds);
            const isToday = ds === t;
            return (
              <div
                key={ds}
                onClick={() => setOpenDay(ds)}
                title={dayJobs.length ? dayJobs.length + " scheduled — click to see them all" : "Nothing scheduled"}
                style={{
                  height: CAL_CELL_H, overflow: "hidden", display: "flex", flexDirection: "column", cursor: "pointer",
                  background: isToday ? "#EEF2FF" : inMonth ? C.surfaceAlt : C.surface,
                  opacity: inMonth ? 1 : 0.5,
                  borderRadius: 8, padding: 6,
                  border: isToday ? "2px solid " + C.accent : "1px solid " + C.border,
                }}
              >
                <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 4 }}>
                  <span style={{ fontSize: 12, fontWeight: 700, color: isToday ? C.accent : C.textMuted }}>{date.getDate()}</span>
                  {dayJobs.length > 0 && <span style={{ fontSize: 10, fontWeight: 700, color: C.textMuted }}>{dayJobs.length}</span>}
                </div>
                <div style={{ flex: 1, minWidth: 0, minHeight: 0, overflow: "hidden" }}>
                  {dayJobs.slice(0, CAL_CHIPS).map(j => {
                    const carry = isCarryDay(spans, j._id, ds);
                    return (
                      <div
                        key={j._id}
                        title={j.jobTitle + (carry ? " (carried over)" : "")}
                        style={{
                          background: carry ? "#FEF3C7" : C.primary, color: carry ? "#92400E" : "#fff",
                          borderRadius: 4, padding: "2px 5px", fontSize: 10, fontWeight: 600, marginBottom: 2,
                          overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap",
                        }}
                      >
                        {carry ? "↻ " : ""}{j.jobTitle}
                      </div>
                    );
                  })}
                  {dayJobs.length > CAL_CHIPS && (
                    <div style={{ fontSize: 10, fontWeight: 700, color: C.accent, padding: "1px 5px" }}>+{dayJobs.length - CAL_CHIPS} more</div>
                  )}
                </div>
              </div>
            );
          })}
        </div>

        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 12, flexWrap: "wrap", marginTop: 14 }}>
          <div style={{ fontSize: 12, color: C.textMuted, display: "flex", gap: 16, flexWrap: "wrap", alignItems: "center" }}>
            <span>
              <span style={{ display: "inline-block", width: 10, height: 10, borderRadius: 3, background: "#FEF3C7", border: "1px solid #FDE68A", marginRight: 6, verticalAlign: -1 }} />
              ↻ carried over — past its end date, still unfinished
            </span>
            <span>Click any day to read the full list.</span>
          </div>
          <Checkbox
            checked={showDone}
            onChange={setShowDone}
            label={"Show completed jobs" + (!showDone && doneCount ? " (" + doneCount + " hidden)" : "")}
          />
        </div>

        {dated.length === 0 && (
          <p style={{ color: C.textMuted, fontSize: 13, marginTop: 16, textAlign: "center" }}>
            No jobs scheduled yet — add jobs with a start date to see them here.
          </p>
        )}
      </div>

      {openDay && (
        <Modal title={longDay(openDay)} onClose={() => setOpenDay(null)} width={560}>
          <ScheduleDayList
            dayStr={openDay}
            jobs={jobsOnDay(jobs, spans, openDay)}
            spans={spans}
            onOpenJob={() => { setOpenDay(null); navigate("jobs"); }}
          />
        </Modal>
      )}
    </div>
  );
}

/* ─── Access control & roles ─────────────────────────────────────────────── */
const PERMISSIONS = [
  { key: "canViewReports", label: "View Reports" },
  { key: "canEditQuotes", label: "Edit Quotes" },
  { key: "canManageSubcontractors", label: "Manage Subcontractors" },
  { key: "canViewManagerLogs", label: "View Manager Logs" },
  { key: "canEditSettings", label: "Edit Settings" },
  { key: "canDeleteEntries", label: "Delete Entries" },
];

function AccessControlPage() {
  const employees = useMemo(() => db.getAll("employees").items, []);
  const [permissions, setPermissions] = useState(() => {
    try { return JSON.parse(storage.get("bmb_permissions") || "{}"); } catch { return {}; }
  });
  const [editingId, setEditingId] = useState(null);
  const [draft, setDraft] = useState({});

  const save = () => {
    const updated = { ...permissions, [editingId]: draft };
    setPermissions(updated);
    storage.set("bmb_permissions", JSON.stringify(updated));
    setEditingId(null);
  };

  return (
    <div>
      <PageHeader title="Access Control" subtitle="Manage user permissions and role-based access" />
      {employees.length === 0
        ? <EmptyState icon="🔒" title="No employees found" subtitle="Add employees first, then set their permissions here." />
        : employees.map(emp => {
          const perms = permissions[emp._id] || {};
          const isEditing = editingId === emp._id;
          return (
            <div key={emp._id} style={card}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16, gap: 12, flexWrap: "wrap" }}>
                <div>
                  <div style={{ fontWeight: 700, fontSize: 15 }}>{emp.fullName}</div>
                  <div style={{ fontSize: 12, color: C.textMuted }}>{emp.role || "Unassigned"}{emp.email ? " — " + emp.email : ""}</div>
                </div>
                {!isEditing
                  ? <button type="button" onClick={() => { setEditingId(emp._id); setDraft({ ...perms }); }} style={btnOutline}>Edit Permissions</button>
                  : (
                    <div style={{ display: "flex", gap: 8 }}>
                      <button type="button" onClick={save} style={btnSecondary}>Save</button>
                      <button type="button" onClick={() => setEditingId(null)} style={btnOutline}>Cancel</button>
                    </div>
                  )}
              </div>
              <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(210px, 1fr))", gap: 8 }}>
                {PERMISSIONS.map(p => {
                  const val = isEditing ? draft[p.key] : perms[p.key];
                  return isEditing
                    ? <Checkbox key={p.key} checked={val} onChange={v => setDraft(d => ({ ...d, [p.key]: v }))} label={p.label} />
                    : (
                      <div key={p.key} style={{ display: "flex", alignItems: "center", gap: 8, padding: "9px 12px", background: val ? "#F0FDF4" : C.surfaceAlt, borderRadius: 8, border: "1px solid " + (val ? "#BBF7D0" : C.border) }}>
                        <span style={{ fontSize: 14 }}>{val ? "✅" : "🔒"}</span>
                        <span style={{ fontSize: 12, fontWeight: 600 }}>{p.label}</span>
                      </div>
                    );
                })}
              </div>
            </div>
          );
        })}
    </div>
  );
}

/* ─── Team (owner: join code, approvals, roles, permissions) ─────────────── */
function TeamPage() {
  const { user, fetchTeam, approveMember, removeMember, setMemberRole, setMemberPermissions } = useAuth();
  const { company, regenerateJoinCode } = useCompany();
  const [members, setMembers] = useState([]);
  const [loading, setLoading] = useState(true);
  const [editing, setEditing] = useState(null);
  const [draftPerms, setDraftPerms] = useState({});
  const [busyId, setBusyId] = useState(null);
  const [copied, setCopied] = useState(false);
  const [rosterNote, setRosterNote] = useState("");

  // Loading the team is also the moment the roster catches up: anyone approved
  // since the last look gets their employees row here (see syncTeamRoster).
  const load = async () => {
    setLoading(true);
    const rows = await fetchTeam();
    setMembers(rows);
    const added = syncTeamRoster(rows);
    if (added > 0) { notifyData(); setRosterNote(added + " team " + (added === 1 ? "member was" : "members were") + " added to your Employees list."); }
    setLoading(false);
  };
  useEffect(() => { load(); }, []);

  if (!user?.isOwner) {
    return <EmptyState icon="🔒" title="Owners only" subtitle="Only the company owner can manage the team." />;
  }

  const pending = members.filter(m => m.status && m.status !== "active");
  const active = members.filter(m => !m.status || m.status === "active");
  const grantable = NAV.filter(n => GRANTABLE.includes(n.id));

  const doApprove = async (m) => { setBusyId(m.id); await approveMember(m.id); await load(); setBusyId(null); };
  const doRemove = async (m, verb) => {
    if (!(await confirmDialog(verb + " " + (m.full_name || m.email) + "?"))) return;
    setBusyId(m.id); await removeMember(m.id); await load(); setBusyId(null);
  };
  const doRole = async (m, role) => { setBusyId(m.id); await setMemberRole(m.id, role); await load(); setBusyId(null); };
  const openPerms = (m) => { setEditing(m.id); setDraftPerms({ ...(m.permissions || {}) }); };
  const savePerms = async (m) => { setBusyId(m.id); await setMemberPermissions(m.id, draftPerms); await load(); setEditing(null); setBusyId(null); };

  const copyCode = () => {
    if (navigator.clipboard) navigator.clipboard.writeText(company?.joinCode || "").then(() => { setCopied(true); setTimeout(() => setCopied(false), 1500); });
  };
  const regen = async () => { if (await confirmDialog("Generate a new join code? The current one stops working immediately.", { confirmLabel: "Generate", tone: "primary" })) await regenerateJoinCode(); };

  return (
    <div>
      <PageHeader title="Team" subtitle="Invite people to your company and control what each person can see" action={<button type="button" onClick={load} style={{ ...btnOutline, fontSize: 12, padding: "6px 12px" }}>↻ Refresh</button>} />

      {/* Join code */}
      <div style={card}>
        <h3 style={{ fontSize: 15, fontWeight: 700, marginBottom: 8 }}>Company Join Code</h3>
        <p style={{ color: C.textMuted, fontSize: 13, marginBottom: 16, lineHeight: 1.6 }}>
          Share this private code with people you want on your team. They choose <strong>“Join a company”</strong> when signing up and enter it — then you approve them below. Keep it private; regenerate anytime.
        </p>
        <div style={{ display: "flex", gap: 12, alignItems: "center", flexWrap: "wrap" }}>
          <div style={{ fontSize: 30, fontWeight: 800, letterSpacing: "6px", fontFamily: "monospace", background: C.surfaceAlt, padding: "10px 20px", borderRadius: 10, border: "1px solid " + C.border }}>
            {company?.joinCode || "——————"}
          </div>
          <button type="button" onClick={copyCode} style={btnSecondary}>{copied ? "Copied ✓" : "Copy"}</button>
          <button type="button" onClick={regen} style={btnOutline}>Regenerate</button>
        </div>
      </div>

      {/* Pending approvals */}
      <div style={card}>
        <h3 style={{ fontSize: 15, fontWeight: 700, marginBottom: 12 }}>
          Pending Requests {pending.length > 0 && <Badge color="#FEFCE8" textColor="#CA8A04">{pending.length}</Badge>}
        </h3>
        {loading
          ? <p style={{ color: C.textMuted, fontSize: 13 }}>Loading…</p>
          : pending.length === 0
            ? <p style={{ color: C.textMuted, fontSize: 13 }}>No one is waiting to join right now.</p>
            : pending.map(m => (
              <div key={m.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 12, padding: "12px 14px", border: "1px solid " + C.border, borderRadius: 8, marginBottom: 8, flexWrap: "wrap" }}>
                <div>
                  <div style={{ fontWeight: 700, fontSize: 14 }}>{m.full_name || "(no name)"}</div>
                  <div style={{ fontSize: 12, color: C.textMuted }}>{m.email}</div>
                </div>
                <div style={{ display: "flex", gap: 8 }}>
                  <button type="button" disabled={busyId === m.id} onClick={() => doApprove(m)} style={btnSecondary}>Approve</button>
                  <button type="button" disabled={busyId === m.id} onClick={() => doRemove(m, "Deny the request from")} style={btnDanger}>Deny</button>
                </div>
              </div>
            ))}
      </div>

      {/* Active members */}
      <div style={card}>
        <h3 style={{ fontSize: 15, fontWeight: 700, marginBottom: 12 }}>Team Members</h3>
        <p style={{ color: C.textMuted, fontSize: 12, marginBottom: 12, lineHeight: 1.6 }}>
          Everyone here is also on your <strong>Employees</strong> list, so their clocked shifts and logged
          hours land under a real person. Set each one's pay rate there.
        </p>
        {rosterNote && <p style={{ fontSize: 12, color: C.textMuted, marginBottom: 12 }}>✅ {rosterNote}</p>}
        {active.length === 0 && <p style={{ color: C.textMuted, fontSize: 13 }}>No active members yet.</p>}
        {active.map(m => {
          const isMe = m.id === user.id;
          const isOwnerRow = m.role === "Owner";
          const isEditing = editing === m.id;
          return (
            <div key={m.id} style={{ border: "1px solid " + C.border, borderRadius: 10, padding: 14, marginBottom: 10 }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 12, flexWrap: "wrap" }}>
                <div>
                  <div style={{ fontWeight: 700, fontSize: 14 }}>{m.full_name || "(no name)"} {isMe && <span style={{ fontSize: 11, color: C.textMuted }}>(you)</span>}</div>
                  <div style={{ fontSize: 12, color: C.textMuted }}>{m.email}</div>
                </div>
                <div style={{ display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap" }}>
                  {isOwnerRow
                    ? <Badge color="#EDE9FE" textColor="#7C3AED">Owner</Badge>
                    : (
                      <>
                        <Select value={m.role} onChange={v => doRole(m, v)} options={["Employee", "Manager", "Owner"]} style={{ width: 130 }} />
                        {!isEditing
                          ? <button type="button" onClick={() => openPerms(m)} style={{ ...btnOutline, fontSize: 12, padding: "6px 12px" }}>Edit Access</button>
                          : (
                            <>
                              <button type="button" disabled={busyId === m.id} onClick={() => savePerms(m)} style={{ ...btnSecondary, fontSize: 12, padding: "6px 12px" }}>Save</button>
                              <button type="button" onClick={() => setEditing(null)} style={{ ...btnOutline, fontSize: 12, padding: "6px 12px" }}>Cancel</button>
                            </>
                          )}
                        {!isMe && <button type="button" disabled={busyId === m.id} onClick={() => doRemove(m, "Remove")} style={btnDanger}>Remove</button>}
                      </>
                    )}
                </div>
              </div>

              {!isOwnerRow && (
                <div style={{ marginTop: 12 }}>
                  <div style={{ fontSize: 11, fontWeight: 700, color: C.textMuted, textTransform: "uppercase", letterSpacing: "0.5px", marginBottom: 8 }}>
                    Can access {isEditing ? "(tick to allow)" : ""}
                  </div>
                  <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(190px, 1fr))", gap: 8 }}>
                    {grantable.map(g => {
                      const on = isEditing ? draftPerms[g.id] : (m.permissions && m.permissions[g.id]);
                      return isEditing
                        ? <Checkbox key={g.id} checked={!!on} onChange={v => setDraftPerms(d => ({ ...d, [g.id]: v }))} label={g.label} />
                        : (
                          <div key={g.id} style={{ display: "flex", alignItems: "center", gap: 8, padding: "8px 12px", background: on ? "#F0FDF4" : C.surfaceAlt, borderRadius: 8, border: "1px solid " + (on ? "#BBF7D0" : C.border) }}>
                            <span>{on ? "✅" : "🔒"}</span>
                            <span style={{ fontSize: 12, fontWeight: 600 }}>{g.label}</span>
                          </div>
                        );
                    })}
                  </div>
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* ─── Settings ───────────────────────────────────────────────────────────── */
function SettingsPage() {
  const { company, updateCompany } = useCompany();
  const { user } = useAuth();
  const { navigate } = useRouter();
  const importRef = useRef(null);
  const [form, setForm] = useState({
    companyName: company?.companyName || "",
    address: company?.address || "",
    phone: company?.phone || "",
    email: company?.email || "",
    website: company?.website || "",
    logoUrl: company?.logoUrl || "",
    primaryColor: company?.primaryColor || DEFAULT_PRIMARY,
    secondaryColor: company?.secondaryColor || DEFAULT_SECONDARY,
    shopAddress: company?.shopAddress || "",
    geofenceRadiusM: company?.geofenceRadiusM || 300,
  });
  const [message, setMessage] = useState("");
  const [lookupShop, setLookupShop] = useState(false);
  const [saving, setSaving] = useState(false);

  const save = async () => {
    setSaving(true);
    const ll = form.shopAddress ? await resolveLatLng(form.shopAddress) : null;
    await updateCompany({ ...form, shopLat: ll ? ll.lat : null, shopLng: ll ? ll.lng : null });
    setSaving(false);
    setMessage(form.shopAddress && !ll ? "Settings saved — couldn't pin the shop address, so the clock-in alert won't trigger." : "Settings saved.");
    setTimeout(() => setMessage(""), form.shopAddress && !ll ? 5000 : 2500);
  };

  const exportAll = () => {
    const data = { exportedAt: new Date().toISOString(), company, collections: {} };
    COLLECTIONS.forEach(c => { data.collections[c] = getCol(c); });
    downloadFile("buildmybill_backup_" + today() + ".json", JSON.stringify(data, null, 2), "application/json");
  };

  const [busy, setBusy] = useState("");

  const importAll = e => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async ev => {
      let parsed;
      try {
        parsed = JSON.parse(ev.target.result);
      } catch { window.alert("That file doesn't look like a BuildMyBill backup."); return; }
      const cols = parsed.collections || parsed;
      if (!cols || typeof cols !== "object") { window.alert("That file doesn't look like a BuildMyBill backup."); return; }
      if (!(await confirmDialog("This REPLACES all of your company's current data with the backup. Continue?", { confirmLabel: "Replace" }))) return;
      setBusy("Importing…");
      try {
        await db.deleteAllForCompany();
        const rowsByCol = {};
        COLLECTIONS.forEach(c => { if (Array.isArray(cols[c])) rowsByCol[c] = cols[c]; });
        await db.bulkInsert(rowsByCol);
        if (parsed.company) await updateCompany(parsed.company);
        window.location.reload();
      } catch (err) {
        setBusy("");
        window.alert("Import failed: " + (err.message || err));
      }
    };
    reader.readAsText(file);
    e.target.value = "";
  };

  const loadDemo = async () => {
    if (!(await confirmDialog("Add sample clients, jobs, employees, equipment, and an invoice to your account?", { confirmLabel: "Add sample data", tone: "primary" }))) return;
    setBusy("Adding sample data…");
    try { await seedDemoData(company); window.location.reload(); }
    catch (err) { setBusy(""); window.alert("Couldn't add sample data: " + (err.message || err)); }
  };

  const clearAll = async () => {
    if (!(await confirmDialog("Delete ALL of your company's records? Export a backup first — this cannot be undone."))) return;
    if (!(await confirmDialog("Really delete everything? There is no undo.", { confirmLabel: "Yes, delete everything" }))) return;
    setBusy("Deleting…");
    try { await db.deleteAllForCompany(); window.location.reload(); }
    catch (err) { setBusy(""); window.alert("Delete failed: " + (err.message || err)); }
  };

  const colorField = (label, key) => (
    <Field label={label}>
      <div style={{ display: "flex", gap: 8 }}>
        <input type="color" value={form[key]} onChange={e => setForm(f => ({ ...f, [key]: e.target.value }))} style={{ width: 48, height: 38, borderRadius: 6, cursor: "pointer", border: "1px solid " + C.border, padding: 2 }} />
        <TextInput value={form[key]} onChange={v => setForm(f => ({ ...f, [key]: v }))} style={{ fontFamily: "monospace" }} />
      </div>
    </Field>
  );

  return (
    <div>
      <PageHeader title="Settings" subtitle="Company details, branding, and your data" />
      <Toast message={message} />

      <div className="grid-2">
        <div style={card}>
          <h3 style={{ fontSize: 15, fontWeight: 700, marginBottom: 16 }}>Company Information</h3>
          <Field label="Company Name"><TextInput value={form.companyName} onChange={v => setForm(f => ({ ...f, companyName: v }))} placeholder="My Construction Company" /></Field>
          <Field label="Address"><TextInput value={form.address} onChange={v => setForm(f => ({ ...f, address: v }))} placeholder="123 Main St, City, Province" /></Field>
          <Field label="Phone"><TextInput value={form.phone} onChange={v => setForm(f => ({ ...f, phone: v }))} placeholder="+1 555 000 0000" /></Field>
          <Field label="Email"><TextInput type="email" value={form.email} onChange={v => setForm(f => ({ ...f, email: v }))} placeholder="info@company.com" /></Field>
          <Field label="Website"><TextInput value={form.website} onChange={v => setForm(f => ({ ...f, website: v }))} placeholder="https://yourcompany.com" /></Field>
        </div>

        <div style={card}>
          <h3 style={{ fontSize: 15, fontWeight: 700, marginBottom: 16 }}>Branding</h3>
          <Field label="Logo URL"><TextInput value={form.logoUrl} onChange={v => setForm(f => ({ ...f, logoUrl: v }))} placeholder="https://…/logo.png" /></Field>
          {form.logoUrl && <img src={form.logoUrl} alt="Logo preview" style={{ maxHeight: 60, maxWidth: 200, objectFit: "contain", marginBottom: 12, borderRadius: 6, border: "1px solid " + C.border }} />}
          {colorField("Primary Color", "primaryColor")}
          {colorField("Secondary Color", "secondaryColor")}
          <div style={{ padding: 12, background: C.surfaceAlt, borderRadius: 8, fontSize: 12, color: C.textMuted }}>
            Preview:{" "}
            <span style={{ background: form.primaryColor, color: "#fff", padding: "3px 10px", borderRadius: 4, marginRight: 6 }}>Primary</span>
            <span style={{ background: form.secondaryColor, color: "#fff", padding: "3px 10px", borderRadius: 4 }}>Secondary</span>
          </div>
        </div>
      </div>

      <div style={{ ...card }}>
        <h3 style={{ fontSize: 15, fontWeight: 700, marginBottom: 4 }}>Workspace setup</h3>
        <p style={{ color: C.textMuted, fontSize: 13, marginBottom: 16, lineHeight: 1.6 }}>
          How this app is shaped for your business — the wording it uses, the stages your work moves through,
          and which sections your team sees. Change any of it any time; your records are never rewritten.
        </p>
        <div className="grid-2">
          <div>
            <div style={{ fontSize: 11, fontWeight: 700, color: C.textMuted, textTransform: "uppercase", letterSpacing: "0.5px", marginBottom: 4 }}>Trade</div>
            <div style={{ fontSize: 14, fontWeight: 600, marginBottom: 12 }}>
              {presetById(company?.industry).icon} {presetById(company?.industry).label}
              {company?.setupSkipped && <span style={{ fontSize: 12, color: C.textMuted, fontWeight: 400 }}> · standard setup</span>}
            </div>
            <div style={{ fontSize: 11, fontWeight: 700, color: C.textMuted, textTransform: "uppercase", letterSpacing: "0.5px", marginBottom: 4 }}>Sections switched on</div>
            <div style={{ fontSize: 14, fontWeight: 600 }}>
              {optionalModules().filter(m => moduleEnabled(m.id)).length} of {optionalModules().length}
            </div>
          </div>
          <div>
            <div style={{ fontSize: 11, fontWeight: 700, color: C.textMuted, textTransform: "uppercase", letterSpacing: "0.5px", marginBottom: 6 }}>Your workflow</div>
            <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
              {workflowStages().map((st, i) => (
                <span key={st + i} style={{
                  fontSize: 11.5, fontWeight: 700, padding: "4px 10px", borderRadius: 20,
                  background: STAGE_FALLBACK[i % STAGE_FALLBACK.length][0], color: STAGE_FALLBACK[i % STAGE_FALLBACK.length][1],
                }}>{st}</span>
              ))}
            </div>
          </div>
        </div>
        <button type="button" onClick={() => navigate("setup")} style={{ ...btnSecondary, marginTop: 16 }}>
          {company?.setupComplete && !company?.setupSkipped ? "Change my setup" : "Set up my workspace"}
        </button>
      </div>

      <div style={{ ...card }}>
        <h3 style={{ fontSize: 15, fontWeight: 700, marginBottom: 4 }}>Shop location &amp; clock-in alert</h3>
        <p style={{ color: C.textMuted, fontSize: 13, marginBottom: 16, lineHeight: 1.6 }}>
          Pin your shop's location and the field app will prompt crew to clock in when they open it near the shop.
          This only works while the app is open on their phone — phones don't allow location tracking while a web app is closed or the screen is locked.
        </p>
        <Field label="Shop Location">
          <div style={{ display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap" }}>
            <input value={form.shopAddress} onChange={e => setForm(f => ({ ...f, shopAddress: e.target.value }))} placeholder="Shop address, or look it up →" style={{ ...inputCls, flex: "1 1 180px" }} />
            <button type="button" onClick={() => setLookupShop(true)} style={{ ...btnSecondary, whiteSpace: "nowrap" }}>🔍 Look up</button>
          </div>
        </Field>
        <Field label="Alert radius (meters)">
          <input type="number" min="50" value={form.geofenceRadiusM} onChange={e => setForm(f => ({ ...f, geofenceRadiusM: e.target.value }))} style={{ ...inputCls, width: 120 }} />
        </Field>
        {lookupShop && <LocationPicker onClose={() => setLookupShop(false)} onPick={v => { setForm(f => ({ ...f, shopAddress: v })); setLookupShop(false); }} />}
      </div>

      <div style={{ display: "flex", gap: 10, alignItems: "center", marginBottom: 20 }}>
        <button type="button" onClick={save} disabled={saving} style={btnSecondary}>{saving ? "Saving…" : "Save Settings"}</button>
      </div>

      <div className="grid-2">
        <div style={card}>
          <h3 style={{ fontSize: 15, fontWeight: 700, marginBottom: 12 }}>Account</h3>
          {[["Name", user?.name || "—"], ["Email", user?.email || "—"]].map(([l, v]) => (
            <div key={l} style={{ marginBottom: 12 }}>
              <div style={{ fontSize: 11, fontWeight: 700, color: C.textMuted, textTransform: "uppercase", marginBottom: 4 }}>{l}</div>
              <div style={{ fontSize: 14, fontWeight: 600 }}>{v}</div>
            </div>
          ))}
          <div style={{ fontSize: 11, fontWeight: 700, color: C.textMuted, textTransform: "uppercase", marginBottom: 4 }}>Role</div>
          <Badge color="#EEF2FF" textColor={C.accent}>{user?.role || "Owner"}</Badge>
        </div>

        <div style={card}>
          <h3 style={{ fontSize: 15, fontWeight: 700, marginBottom: 12 }}>Data Management</h3>
          <p style={{ color: C.textMuted, fontSize: 13, marginBottom: 16, lineHeight: 1.6 }}>
            Your data is stored securely in your company's private database. Export any time for your own backup.
          </p>
          <input ref={importRef} type="file" accept="application/json" style={{ display: "none" }} onChange={importAll} />
          <div style={{ display: "flex", gap: 10, flexWrap: "wrap", alignItems: "center" }}>
            <button type="button" onClick={exportAll} disabled={!!busy} style={btnOutline}>📤 Export All Data</button>
            <button type="button" onClick={() => importRef.current.click()} disabled={!!busy} style={btnOutline}>📥 Import Backup</button>
            <button type="button" onClick={loadDemo} disabled={!!busy} style={btnOutline}>✨ Load Sample Data</button>
            <button type="button" onClick={clearAll} disabled={!!busy} style={btnDanger}>Delete All Data</button>
            {busy && <span style={{ fontSize: 13, color: C.textMuted, fontWeight: 600 }}>{busy}</span>}
          </div>
        </div>
      </div>
    </div>
  );
}

/* ─── Guided workspace setup ───────────────────────────────────────────────
   Three stages — the business, the way it works, then review — and on launch
   the answers are written to the company record, where syncWorkspace() picks
   them up and the whole app re-labels itself. Owners only; everyone else in the
   company just gets the finished workspace. */

const SETUP_STEPS = [
  { key: "business", label: "Your business", hint: "Trade, name and branding" },
  { key: "workflow", label: "How you work", hint: "Wording, stages and sections" },
  { key: "review", label: "Review & launch", hint: "Check it over, then go" },
];

function setupFormFromCompany(company) {
  const preset = presetById(company?.industry || "construction");
  const terms = {};
  Object.keys(BASE_TERMS).forEach(k => {
    const saved = (company?.terms || {})[k] || {};
    const fromPreset = (preset.terms || {})[k] || {};
    terms[k] = {
      one: saved.one || fromPreset.one || BASE_TERMS[k].one,
      many: saved.many || fromPreset.many || BASE_TERMS[k].many,
    };
  });
  return {
    industry: company?.industry || "construction",
    industryDetail: company?.industryDetail || "",
    companyName: company?.companyName || "",
    logoUrl: company?.logoUrl || "",
    primaryColor: company?.primaryColor || preset.colors.primary,
    secondaryColor: company?.secondaryColor || preset.colors.secondary,
    terms,
    stages: (Array.isArray(company?.stages) && company.stages.length ? company.stages : preset.stages).slice(),
    modules: { ...modulesFromPreset(preset), ...(company?.modules || {}) },
  };
}

// Everything a trade suggests, dropped into the form. Called when the trade
// changes, so the next two stages start from something sensible.
function applyPresetToForm(form, presetId) {
  const preset = presetById(presetId);
  const terms = {};
  Object.keys(BASE_TERMS).forEach(k => {
    const p = (preset.terms || {})[k] || {};
    terms[k] = { one: p.one || BASE_TERMS[k].one, many: p.many || BASE_TERMS[k].many };
  });
  return {
    ...form,
    industry: presetId,
    terms,
    stages: preset.stages.slice(),
    modules: modulesFromPreset(preset),
    primaryColor: preset.colors.primary,
    secondaryColor: preset.colors.secondary,
  };
}

function SetupStepper({ step }) {
  return (
    <div style={{ display: "flex", gap: 8, marginBottom: 26, flexWrap: "wrap" }}>
      {SETUP_STEPS.map((s, i) => {
        const done = i < step, now = i === step;
        return (
          <div key={s.key} style={{
            flex: "1 1 180px", padding: "10px 14px", borderRadius: 10,
            background: now ? C.surface : "transparent",
            border: "1px solid " + (now ? C.secondary : C.border),
            opacity: done || now ? 1 : 0.55,
          }}>
            <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
              <span style={{
                width: 20, height: 20, borderRadius: "50%", fontSize: 11, fontWeight: 800,
                display: "flex", alignItems: "center", justifyContent: "center",
                background: done ? C.green : now ? C.secondary : C.border,
                color: done || now ? "#fff" : C.textMuted,
              }}>{done ? "✓" : i + 1}</span>
              <span style={{ fontSize: 13, fontWeight: 700 }}>{s.label}</span>
            </div>
            <div style={{ fontSize: 11, color: C.textMuted, marginTop: 3, marginLeft: 28 }}>{s.hint}</div>
          </div>
        );
      })}
    </div>
  );
}

function IndustryPicker({ value, onPick }) {
  return (
    <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(215px, 1fr))", gap: 10 }}>
      {INDUSTRY_PRESETS.map(p => {
        const on = value === p.id;
        return (
          <button key={p.id} type="button" onClick={() => onPick(p.id)} style={{
            textAlign: "left", padding: "12px 14px", borderRadius: 10, cursor: "pointer",
            background: on ? "#F0FDF4" : C.surface,

          </button>
        );
      })}
    </div>
  );
}

function StageEditor({ stages, onChange, noun = "job" }) {
  const set = (i, v) => { const next = stages.slice(); next[i] = v; onChange(next); };
  const move = (i, d) => {
    const j = i + d;
    if (j < 0 || j >= stages.length) return;
    const next = stages.slice();
    next.splice(j, 0, next.splice(i, 1)[0]);
    onChange(next);
  };
  const remove = i => onChange(stages.filter((_, k) => k !== i));

  return (
    <div>
      {stages.map((st, i) => (
        <div key={i} style={{ display: "flex", gap: 6, alignItems: "center", marginBottom: 6 }}>
          <span style={{ fontSize: 11, fontWeight: 800, color: C.textMuted, width: 18 }}>{i + 1}</span>
          <input value={st} onChange={e => set(i, e.target.value)} style={{ ...inputCls, flex: 1 }} placeholder="Stage name" />
          <button type="button" onClick={() => move(i, -1)} disabled={i === 0} aria-label="Move up"
            style={{ ...btnOutline, padding: "6px 9px", opacity: i === 0 ? 0.4 : 1 }}>↑</button>
          <button type="button" onClick={() => move(i, 1)} disabled={i === stages.length - 1} aria-label="Move down"
            style={{ ...btnOutline, padding: "6px 9px", opacity: i === stages.length - 1 ? 0.4 : 1 }}>↓</button>
          <button type="button" onClick={() => remove(i)} disabled={stages.length <= 2} aria-label="Remove stage"
            style={{ ...btnDanger, padding: "6px 9px", opacity: stages.length <= 2 ? 0.4 : 1 }}>×</button>
        </div>
      ))}
      <button type="button" onClick={() => onChange(stages.concat("New stage"))} style={{ ...btnOutline, marginTop: 6 }}>+ Add stage</button>
      <p style={{ fontSize: 12, color: C.textMuted, marginTop: 10, lineHeight: 1.6 }}>
        These are the stages a {noun.toLowerCase()} moves through, in order. Existing records keep whatever stage they
        were saved with, so nothing breaks if you rename one later.
      </p>
    </div>
  );
}

    setForm(f => applyPresetToForm(f, id));
    setError("");

  const setTerm = (key, part, value) => setForm(f => {
    const t = { ...f.terms, [key]: { ...f.terms[key] } };
    t[key][part] = value;
    // Typing the singular fills the plural in for you, unless you've written
    // your own plural already.
    if (part === "one") {
      const wasAuto = !t[key].many || t[key].many === pluralOf(f.terms[key].one) || t[key].many === BASE_TERMS[key].many;
      if (wasAuto) t[key].many = BASE_TERMS[key].one === BASE_TERMS[key].many ? value : pluralOf(value);
    }
    return { ...f, terms: t };
  });

  const toggleModule = id => setForm(f => ({ ...f, modules: { ...f.modules, [id]: f.modules[id] === false } }));

  const next = () => {
    if (step === 0 && !form.companyName.trim()) { setError("Add your business name so it shows on your quotes and invoices."); return; }

    setStep(s => Math.min(s + 1, SETUP_STEPS.length - 1));

  const back = () => { setError(""); setStep(s => Math.max(s - 1, 0)); };

  const launch = async () => {
    const stages = form.stages.map(s => s.trim()).filter(Boolean);

// The review screen previews wording that hasn't been saved yet, so it can't go
// through relabel() (which reads the live company config).
function relabelWith(terms, text) {
  const before = { terms: WS.terms, re: TERM_RE, map: TERM_MAP };
  compileTerms(terms);
  const out = relabel(text);
  compileTerms(before.terms);
  return out;
}
