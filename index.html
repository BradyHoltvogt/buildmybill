  .sidebar {
    width: 220px; min-width: 220px; background: var(--brand-primary); color: #fff;

    /* dvh, not vh: on a phone 100vh is the height with the browser's URL bar
       retracted, so a 100vh sidebar hangs its own footer (Sign Out) off the
       bottom of the screen — and being fixed, you can't scroll down to it.
       vh stays first as the fallback for anything without dvh. */
    height: 100vh; height: 100dvh;
    position: sticky; top: 0; flex-shrink: 0;

  .sidebar-backdrop { display: none; }
  .topbar { display: none; }

  @media (max-width: 900px) {

      transform: translateX(-100%); transition: transform .2s ease;
      /* As an overlay it has to clear the notch and the home indicator on its

      display: flex; align-items: center; gap: 12px;
      padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 10px; background: var(--brand-primary); color: #fff;
      position: sticky; top: 0; z-index: 100;

    /* The bar carries a menu button, the page name and two actions. On a phone
       that's more than the width holds, and anything that overflows here drags

    .topbar .tb-menu, .topbar .tb-btn { flex: 0 0 auto; }

  @media (max-width: 600px) {

  .row-wrap { display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-end; }
  .scroll-x { overflow-x: auto; }

  .mshell { display: flex; flex-direction: column; min-height: 100vh; min-height: 100dvh; background: #F3F4F6; }
  .mtopbar {

    padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 12px;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    position: sticky; top: 0; z-index: 20;

  /* Installed on an iPhone: extra room so the header clears the status bar / notch. */
  .ios-standalone .mtopbar { padding-top: calc(20px + env(safe-area-inset-top, 0px)); }
  .mmain { flex: 1; padding: 16px 14px calc(88px + env(safe-area-inset-bottom)); }
  .mtabbar {
    position: fixed; left: 0; right: 0; bottom: 0; display: flex;
    background: #fff; border-top: 1px solid #E5E7EB;
    padding-bottom: env(safe-area-inset-bottom); z-index: 40;

  .mtab {

  /* Rich-text editor + printed document: restore heading/list styling the reset removes */

<body>
  <div id="boot">
    <div class="logo">B</div>
    <div class="msg">Starting BuildMyBill…</div>
  </div>
  <div id="root"></div>

  <script src="vendor/react.production.min.js"></script>
  <script src="vendor/react-dom.production.min.js"></script>
  <script src="vendor/supabase.js"></script>
  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="config.js"></script>
  <script src="vendor/babel.min.js"></script>
  <script type="text/babel" data-presets="react">
/* ═══════════════════════════════════════════════════════════════════════════
   BuildMyBill — single-file React app. Sections are marked with banners.
   ═══════════════════════════════════════════════════════════════════════════ */

const { useState, useEffect, useRef, useMemo, createContext, useContext } = React;

/* ─── Supabase client ────────────────────────────────────────────────────── */
const CFG = window.BMB_CONFIG || {};
/* ─── Session persistence ("Remember me") ────────────────────────────────────
   Remember me ON  → the login lives in localStorage: you stay signed in across
                     browser restarts (until you sign out). This is the default,
                     so you're not re-typing your password all the time.
   Remember me OFF → the login lives in sessionStorage: it's wiped when you close
                     the browser, which is safer on a shared/public computer.
   The preference itself is a tiny flag; the adapter below reads it to decide
   where the real session token is written. Reads check both stores, so flipping
   the setting never drops the session you already have. */
const REMEMBER_KEY = "bmb-remember";
const rememberOn = () => localStorage.getItem(REMEMBER_KEY) !== "0"; // default: remember
function setRememberPref(on) { try { localStorage.setItem(REMEMBER_KEY, on ? "1" : "0"); } catch (e) {} }

const authStorage = {
  getItem(k) {
    try { const v = localStorage.getItem(k); if (v !== null) return v; return sessionStorage.getItem(k); }
    catch (e) { return null; }
  },
  setItem(k, v) {
    try {
      if (rememberOn()) { localStorage.setItem(k, v); sessionStorage.removeItem(k); }
      else { sessionStorage.setItem(k, v); localStorage.removeItem(k); }
    } catch (e) {}
  },
  removeItem(k) { try { localStorage.removeItem(k); sessionStorage.removeItem(k); } catch (e) {} },
};

const supa = window.supabase.createClient(CFG.url, CFG.anonKey, {
  auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, storage: authStorage },
});

// Leaflet's default marker icons are served relative to the page, not to
// leaflet.css — point them at our vendored copies explicitly.
if (window.L) {
  L.Icon.Default.mergeOptions({
    iconUrl: "vendor/leaflet/images/marker-icon.png",
    iconRetinaUrl: "vendor/leaflet/images/marker-icon-2x.png",
    shadowUrl: "vendor/leaflet/images/marker-shadow.png",
  });
}

// Transient client-only ids (React keys, line items) — never hit the DB.
const genId = () => Math.random().toString(36).slice(2) + Date.now().toString(36);
// Real UUID for DB rows, generated client-side so optimistic updates keep a stable id.
function uuid() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, c => {
    const r = Math.random() * 16 | 0;
    return (c === "x" ? r : (r & 0x3 | 0x8)).toString(16);
  });
}

// Small localStorage helper — used ONLY for per-browser UI prefs (never company data).
const storage = {
  get(key) { try { return localStorage.getItem(key); } catch { return null; } },
  set(key, v) { try { localStorage.setItem(key, v); return true; } catch { return false; } },
  remove(key) { try { localStorage.removeItem(key); } catch {} },
};

const COLLECTIONS = [
  "quotes", "clients", "jobs", "employees", "subcontractors", "equipment",
  "inventory", "timeentries", "contracts", "safetychecks", "trucklogbooks",
  "warehouses", "managerlogs", "doctemplates", "job_media", "shifts", "job_docs", "quote_docs",
  "sites", "loads", "activeclocks", "locationpings", "equipmentlogs", "shiftrequests",
  "inventorylogs", "zones", "formtemplates", "formsubmissions", "certifications",
];

/* ─── Secure data layer (Supabase-backed) ────────────────────────────────────
   All company data lives in the `records` table, isolated per company by the
   database's Row Level Security. We keep an in-memory mirror of the current
   company's records so the UI can read synchronously (as it always has); writes
   go to the database and update the mirror optimistically, rolling back + warning
   on failure. CURRENT_COMPANY_ID is set at login and stamped on every insert;
   even so, the DB independently rejects any cross-company access. */
let CURRENT_COMPANY_ID = null;
const store = {};
COLLECTIONS.forEach(c => { store[c] = []; });

// Subscribers (the shell) re-render when a background write rolls back.
const dataListeners = new Set();
function notifyData() { dataListeners.forEach(fn => { try { fn(); } catch {} }); }
function useDataVersion() {
  const [v, setV] = useState(0);
  useEffect(() => {
    const fn = () => setV(x => x + 1);
    dataListeners.add(fn);
    return () => dataListeners.delete(fn);
  }, []);
  return v;
}

const rowToRecord = row => ({ ...(row.data || {}), _id: row.id, _createdDate: row.created_at, _updatedDate: row.updated_at });
const stripMeta = rec => { const { _id, _createdDate, _updatedDate, ...data } = rec; return data; };

async function loadAllRecords() {
  COLLECTIONS.forEach(c => { store[c] = []; });
  const { data, error } = await supa
    .from("records")
    .select("id,collection,data,created_at,updated_at")
    .order("created_at", { ascending: false });
  if (error) throw error;
  (data || []).forEach(row => {
    if (!store[row.collection]) store[row.collection] = [];
    store[row.collection].push(rowToRecord(row));
  });
}

function clearStore() { COLLECTIONS.forEach(c => { store[c] = []; }); }

function warnWrite(error) {
  console.error("Save failed:", error);
  window.alert("Couldn't save to the server — check your connection and try again.\n\n" + (error?.message || error));
}

// Read helpers used across the app (and by getCol below).
function getCol(name) { return (store[name] || []).slice(); }

const db = {
  getAll(col, filters = {}, opts = {}) {
    let items = (store[col] || []).slice();
    Object.entries(filters).forEach(([k, v]) => {
      if (v !== undefined && v !== null && v !== "") items = items.filter(i => i[k] === v);
    });
    const total = items.length;
    const skip = opts.skip || 0;
    const limit = opts.limit || 1000;
    return { items: items.slice(skip, skip + limit), hasNext: total > skip + limit, total };
  },
  getById(col, id) { return (store[col] || []).find(i => i._id === id) || null; },

  create(col, data) {
    const id = uuid();
    const now = new Date().toISOString();
    const payload = stripMeta(data);
    const rec = { ...payload, _id: id, _createdDate: now, _updatedDate: now };
    if (!store[col]) store[col] = [];
    store[col].unshift(rec); // optimistic
    supa.from("records").insert({ id, company_id: CURRENT_COMPANY_ID, collection: col, data: payload })
      .then(({ error }) => { if (error) { store[col] = (store[col] || []).filter(r => r._id !== id); warnWrite(error); notifyData(); } });
    return rec;
  },

  update(col, data) {
    const arr = store[col] || [];
    const idx = arr.findIndex(i => i._id === data._id);
    if (idx === -1) return null;
    const prev = arr[idx];
    const merged = { ...prev, ...data, _updatedDate: new Date().toISOString() };
    arr[idx] = merged; // optimistic
    supa.from("records").update({ data: stripMeta(merged) }).eq("id", data._id)
      .then(({ error }) => { if (error) { const a = store[col] || []; const i = a.findIndex(r => r._id === data._id); if (i > -1) a[i] = prev; warnWrite(error); notifyData(); } });
    return merged;
  },

  remove(col, id) {
    const arr = store[col] || [];
    const idx = arr.findIndex(i => i._id === id);
    const prev = idx > -1 ? arr[idx] : null;
    if (idx > -1) arr.splice(idx, 1); // optimistic
    supa.from("records").delete().eq("id", id)
      .then(({ error }) => { if (error && prev) { (store[col] || []).splice(Math.min(idx, (store[col] || []).length), 0, prev); warnWrite(error); notifyData(); } });
    return true;
  },

  // Awaited bulk ops — used by seed / import / wipe, which reload right after and
  // therefore must not race the network.
  async bulkInsert(rowsByCol) {
    const payload = [];
    Object.entries(rowsByCol).forEach(([col, rows]) => {
      (rows || []).forEach(r => payload.push({ id: uuid(), company_id: CURRENT_COMPANY_ID, collection: col, data: stripMeta(r) }));
    });
    if (payload.length === 0) return;
    // Insert in chunks to stay well under any request-size limits.
    for (let i = 0; i < payload.length; i += 200) {
      const { error } = await supa.from("records").insert(payload.slice(i, i + 200));
      if (error) throw error;
    }
  },
  async deleteAllForCompany() {
    const { error } = await supa.from("records").delete().eq("company_id", CURRENT_COMPANY_ID);
    if (error) throw error;
    clearStore();
  },

  // Re-fetches just one collection from the server and replaces the local mirror.
  // Used for polling data other devices are writing (e.g. crew locations) that
  // wouldn't otherwise show up until a full reload.
  async refreshCollection(col) {
    const { data, error } = await supa.from("records").select("id,collection,data,created_at,updated_at").eq("collection", col).order("created_at", { ascending: false });
    if (error) { console.error("Refresh failed:", error); return; }
    store[col] = (data || []).map(rowToRecord);
    notifyData();
  },
};

/* ─── Team accounts ↔ the employee roster ────────────────────────────────────
   Two separate lists describe the same people. `profiles` is the sign-in side:
   someone enters the company join code, the owner approves them on the Team
   page, and from then on everything they do — clocked shifts, logged job time,
   daily logs, safety forms — is filed under their account name. The `employees`
   collection is the office side: the roster that carries the pay rate and fills
   every crew picker, work-log filter, and printed timesheet.

   Nothing connected the two, so a person who joined and worked all week never
   showed up on the roster (their hours had no rate, and the Employees count only
   ever showed rows typed by hand), while a hand-typed row sat there matching
   nobody. syncTeamRoster() closes the gap: every active member gets exactly one
   roster row, matched to an existing one wherever possible instead of doubling
   the person up.

   It only ever creates and links. Nothing is deleted or deactivated here — the
   roster also holds people who will never have a login (a casual hand, a
   seasonal hire), and those rows must keep working exactly as they do today. */
const normName = s => String(s || "").trim().replace(/\s+/g, " ").toLowerCase();
const sameName = (a, b) => !!normName(a) && normName(a) === normName(b);
const normEmail = s => String(s || "").trim().toLowerCase();

// The roster row belonging to a team member, or null. Match order matters: the
// account id is exact, the email survives a name change, and the name is the
// last resort (case- and spacing-insensitive) so a hand-typed "john doe" adopts
// the account instead of becoming a second person on the payroll.
function employeeForMember(member, roster) {
  const rows = roster || getCol("employees");
  return rows.find(e => e.userId && e.userId === member.id)
    || rows.find(e => normEmail(e.email) && normEmail(e.email) === normEmail(member.email))
    || rows.find(e => !e.userId && sameName(e.fullName, member.full_name))
    || null;
}

// Give every active team member a roster row. Returns how many were created.
function syncTeamRoster(members) {
  let created = 0;
  (members || []).forEach(m => {
    if (!m || !m.id) return;
    if (m.status && m.status !== "active") return;   // still waiting on approval
    const name = String(m.full_name || "").trim() || String(m.email || "").split("@")[0];
    if (!name) return;
    // Re-read the roster each pass so a row created moments ago (the store is
    // updated synchronously) is matched instead of created twice.
    const row = employeeForMember(m, getCol("employees"));
    if (!row) {
      db.create("employees", {
        fullName: name,
        email: m.email || "",
        role: m.role || "Employee",
        userId: m.id,
        isActive: true,
        startDate: String(m.created_at || "").slice(0, 10),
      });
      created++;
      return;
    }
    const patch = {};
    if (row.userId !== m.id) patch.userId = m.id;
    if (!row.email && m.email) patch.email = m.email;
    // Adopt the account's spelling of the name. That spelling is what every
    // shift and time entry is filed under, so the roster has to agree with it
    // or the person's hours look like they belong to someone else.
    if (row.fullName !== name && sameName(row.fullName, name)) patch.fullName = name;
    if (Object.keys(patch).length) db.update("employees", { ...row, ...patch });
  });
  return created;
}

// Records a chunk of billable equipment usage (from any daily log / time entry
// form) and rolls the hours onto the equipment's running total — the one place
// "what equipment, how long" turns into both a billing record and an updated
// odometer/engine-hour total, so Equipment, Billing, and the daily logs all
// agree with each other.
function logEquipmentUsage({ equipmentName, hours, employeeName, entryDate, jobId, jobName, source }) {
  const name = String(equipmentName || "").trim();
  const h = num(hours);
  if (!name || h <= 0) return;
  const eq = getCol("equipment").find(e => (e.equipmentName || "").trim() === name);
  const rate = eq ? num(eq.billingRatePerHour) : 0;
  db.create("equipmentlogs", {
    employeeName: employeeName || "", entryDate: entryDate || today(), jobId: jobId || "", jobName: jobName || "",
    equipmentId: eq ? eq._id : "", equipmentName: name, hoursUsed: h, billingRatePerHour: rate, cost: h * rate,
    source: source || "",
  });
  if (eq) db.update("equipment", { ...eq, totalHours: num(eq.totalHours) + h });
}

// Records a stock movement (received or used) against an inventory item and
// keeps its running currentStock in sync — the one place "what happened to
// this material" turns into both an audit trail and an updated stock count,
// instead of currentStock being a number someone just overwrites by hand.
function logInventoryMovement({ inventoryId, materialName, type, quantity, note, entryDate, loggedBy }) {
  const item = inventoryId
    ? db.getById("inventory", inventoryId)
    : getCol("inventory").find(i => (i.materialName || "").trim() === String(materialName || "").trim());
  const q = num(quantity);
  if (!item || !(q > 0)) return null;
  const kind = type === "Used" ? "Used" : "Received";
  const delta = kind === "Used" ? -q : q;
  db.create("inventorylogs", {
    inventoryId: item._id, materialName: item.materialName, type: kind, quantity: q,
    note: note || "", entryDate: entryDate || today(), loggedBy: loggedBy || "",
  });
  db.update("inventory", { ...item, currentStock: Math.max(0, num(item.currentStock) + delta) });
  return kind;
}

// A material is flagged low the moment its stock reaches (or drops under) the
// reorder point someone set for it — no reorder point means no alert.
const isLowStock = i => i && i.reorderPoint !== undefined && i.reorderPoint !== "" && num(i.currentStock) <= num(i.reorderPoint);

/* ─── Warehouse layout & storage zones ───────────────────────────────────────
   A warehouse's floor plan is a coarse grid of cells (cols × rows). Every rack
   / bin / pile on that plan is its own `zones` record carrying its own x/y/w/h
   in grid cells, plus a capacity.

   The spec sketched the zone rectangles BOTH as a layout blob on the warehouse
   AND as coordinates on the zone. Storing them twice guarantees drift, so the
   zone record is the single source of truth for its own rectangle, and the
   warehouse's `layout` field holds the genuinely warehouse-level part: the size
   of the grid those zones sit on. Reading a layout = warehouse.layout + its
   zones, which is exactly what LayoutCanvas takes.
──────────────────────────────────────────────────────────────────────────────*/
const DEFAULT_LAYOUT = { cols: 20, rows: 12 };
const whLayout = wh => {
  const l = (wh && wh.layout) || {};
  return {
    cols: Math.max(4, Math.min(60, num(l.cols) || DEFAULT_LAYOUT.cols)),
    rows: Math.max(4, Math.min(60, num(l.rows) || DEFAULT_LAYOUT.rows)),
  };
};

const ZONE_KINDS = ["Rack", "Shelf", "Bin", "Bulk Pile", "Cold Storage", "Staging", "Yard", "Other"];
const ZONE_FILL = {
  Rack: "#DBEAFE", Shelf: "#E0E7FF", Bin: "#FEF3C7", "Bulk Pile": "#DCFCE7",
  "Cold Storage": "#CFFAFE", Staging: "#FCE7F3", Yard: "#ECFCCB", Other: "#F3F4F6",
};
const ZONE_EDGE = {
  Rack: "#93C5FD", Shelf: "#A5B4FC", Bin: "#FCD34D", "Bulk Pile": "#86EFAC",
  "Cold Storage": "#67E8F9", Staging: "#F9A8D4", Yard: "#BEF264", Other: "#D1D5DB",
};

// Zones belong to a warehouse by id; warehouseName is kept alongside it so the
// plain-text matching the rest of the app uses (equipment/inventory → warehouse)
// still works for rows that predate ids or come from an import.
function zonesForWarehouse(wh) {
  if (!wh) return [];
  return getCol("zones")
    .filter(z => (z.warehouseId && z.warehouseId === wh._id) || (!z.warehouseId && z.warehouseName === wh.warehouseName))
    .sort((a, b) => String(a.label || "").localeCompare(String(b.label || ""), undefined, { numeric: true }));
}

// An inventory item sits in a zone by zoneId. Items created before zones existed
// (or restored from an export) fall back to warehouse-name + zone-label text.
const itemInZone = (item, zone) => (item && zone) ? (
  item.zoneId ? item.zoneId === zone._id
    : !!(item.zoneLabel && String(item.warehouse || "") === String(zone.warehouseName || "") && item.zoneLabel === zone.label)
) : false;

const stockForWarehouse = wh => getCol("inventory").filter(i => String(i.warehouse || "") === String(wh.warehouseName || ""));
const itemsInZone = zone => getCol("inventory").filter(i => itemInZone(i, zone));
const zoneUsed = zone => itemsInZone(zone).reduce((s, i) => s + num(i.currentStock), 0);

// Everything the dashboard and detail page need about one warehouse, derived
// live from zones + inventory — there is no stored rollup to go stale.
function warehouseStats(wh) {
  const zones = zonesForWarehouse(wh);
  const stock = stockForWarehouse(wh);
  const capacity = zones.reduce((s, z) => s + num(z.capacity), 0);
  const used = zones.reduce((s, z) => s + zoneUsed(z), 0);
  const low = stock.filter(isLowStock);
  const zoned = new Set();
  zones.forEach(z => itemsInZone(z).forEach(i => zoned.add(i._id)));
  return {
    zones, stock, capacity, used, low,
    pct: capacity > 0 ? Math.round((used / capacity) * 100) : null,
    unassigned: stock.filter(i => !zoned.has(i._id)),
    value: stock.reduce((s, i) => s + num(i.currentStock) * num(i.unitPrice), 0),
    footprint: zones.reduce((s, z) => s + num(z.w) * num(z.h), 0),
  };
}

/* ─── Job media (photos & videos) ────────────────────────────────────────────
   Files live in a PRIVATE Supabase Storage bucket, foldered by company then job:
     {company_id}/{job_id}/{uuid}.{ext}
   The bucket's security policies only let a company touch its own folder, so
   media is isolated exactly like the rest of a company's data. A lightweight
   record in the `job_media` collection tracks each file (path, type, whether
   it's authorized to show the customer on a quote). */
const MEDIA_BUCKET = "job-media";
const MEDIA_MAX_BYTES = 50 * 1024 * 1024; // 50 MB per file — keeps storage in check

// Downscale a phone photo before upload. Full-res 12MP landscape shots can spike
// memory on iOS (the "glitch" that bounced you out); shrinking to a sane max and
// honoring EXIF orientation fixes both the crash and sideways landscape photos.
// Returns a Blob (jpeg) on success, or the original file if anything goes wrong.
async function downscaleImage(file, maxDim = 2200, quality = 0.85) {
  if (!(file.type || "").startsWith("image")) return file;
  try {
    let bmp;
    if (window.createImageBitmap) {
      try { bmp = await createImageBitmap(file, { imageOrientation: "from-image" }); }
      catch (e) { bmp = await createImageBitmap(file); }
    } else {
      bmp = await new Promise((res, rej) => {
        const img = new Image(); const url = URL.createObjectURL(file);
        img.onload = () => { URL.revokeObjectURL(url); res(img); };
        img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("decode")); };
        img.src = url;
      });
    }
    const w = bmp.width, h = bmp.height;
    const scale = Math.min(1, maxDim / Math.max(w, h));
    if (scale >= 1 && file.size < 1.5 * 1024 * 1024) { if (bmp.close) bmp.close(); return file; } // already small
    const cw = Math.max(1, Math.round(w * scale)), ch = Math.max(1, Math.round(h * scale));
    const canvas = document.createElement("canvas");
    canvas.width = cw; canvas.height = ch;
    canvas.getContext("2d").drawImage(bmp, 0, 0, cw, ch);
    if (bmp.close) bmp.close();
    const blob = await new Promise(res => canvas.toBlob(res, "image/jpeg", quality));
    canvas.width = canvas.height = 0; // release
    return blob && blob.size > 0 ? blob : file;
  } catch (e) { return file; }
}

const bmbMedia = {
  async upload(jobId, file, uploader) {
    if (file.size > MEDIA_MAX_BYTES) {
      throw new Error("File is too large (" + (file.size / 1048576).toFixed(0) + " MB). Max is 50 MB — try a shorter video or a smaller photo.");
    }
    const isImage = (file.type || "").startsWith("image");
    const body = isImage ? await downscaleImage(file) : file;
    // Downscaled photos are always jpeg; videos keep their real extension.
    const ext = isImage ? "jpg" : ((file.name.split(".").pop() || "bin").toLowerCase().replace(/[^a-z0-9]/g, ""));
    const contentType = isImage ? "image/jpeg" : (file.type || undefined);
    const path = CURRENT_COMPANY_ID + "/" + jobId + "/" + uuid() + "." + ext;
    const { error } = await supa.storage.from(MEDIA_BUCKET).upload(path, body, { contentType, upsert: false });
    if (error) throw error;
    const type = (file.type || "").startsWith("video") ? "video" : "image";
    return db.create("job_media", {
      jobId, path, type, name: file.name, size: body.size || file.size,
      customerVisible: false, uploadedBy: uploader?.id || null, uploadedByName: uploader?.name || "",
    });
  },
  async signedUrl(path, expires = 3600) {
    const { data, error } = await supa.storage.from(MEDIA_BUCKET).createSignedUrl(path, expires);
    return error || !data ? null : data.signedUrl;
  },
  // Full data URL — used for the printed quote so photos are embedded in the PDF
  // (and don't depend on a signed URL that could expire after saving).
  async dataUrl(path) {
    const { data, error } = await supa.storage.from(MEDIA_BUCKET).download(path);
    if (error || !data) return null;
    return await new Promise(res => {
      const r = new FileReader();
      r.onload = () => res(r.result);
      r.onerror = () => res(null);
      r.readAsDataURL(data);
    });
  },
  async remove(rec) {
    try { await supa.storage.from(MEDIA_BUCKET).remove([rec.path]); } catch (e) {}
    db.remove("job_media", rec._id);
  },
};

/* ─── Documents (PDFs of locates, permits, etc.) — kept SEPARATE from photos.
   Private bucket, foldered by company. Used for jobs (job_docs) AND quotes
   (quote_docs) — both live in the same bucket, isolated per company. */
const DOCS_BUCKET = "job-docs";
const DOC_MAX_BYTES = 25 * 1024 * 1024; // 25 MB per file
const bmbDocs = {
  // ownerId = the job or quote id; opts.collection/idField/folder parameterize it.
  async upload(ownerId, file, uploader, opts = {}) {
    if (file.size > DOC_MAX_BYTES) {
      throw new Error("File is too large (" + (file.size / 1048576).toFixed(0) + " MB). Max is 25 MB.");
    }
    const collection = opts.collection || "job_docs";
    const idField = opts.idField || "jobId";
    const folder = opts.folder || ownerId;
    const ext = (file.name.split(".").pop() || "bin").toLowerCase().replace(/[^a-z0-9]/g, "");
    const path = CURRENT_COMPANY_ID + "/" + folder + "/" + uuid() + "." + ext;
    const { error } = await supa.storage.from(DOCS_BUCKET).upload(path, file, { contentType: file.type || undefined, upsert: false });
    if (error) throw error;
    return db.create(collection, {
      [idField]: ownerId, path, name: file.name, size: file.size, mime: file.type || "",
      uploadedBy: uploader?.id || null, uploadedByName: uploader?.name || "",
    });
  },
  async signedUrl(path, expires = 3600) {
    const { data, error } = await supa.storage.from(DOCS_BUCKET).createSignedUrl(path, expires);
    return error || !data ? null : data.signedUrl;
  },
  async remove(rec, collection = "job_docs") {
    try { await supa.storage.from(DOCS_BUCKET).remove([rec.path]); } catch (e) {}
    db.remove(collection, rec._id);
  },
};

/* ─── Safety & compliance ────────────────────────────────────────────────────
   Digital safety forms (templates → submissions), worker certifications, and an
   offline-first submit path for crews with no signal on site.

   Three collections carry it, in the same company-isolated `records` table as
   everything else (see supabase/migration_safety.sql for the row-level rules
   that keep a worker's submissions their own):
     formtemplates   — what a form asks: title, category, repeat schedule, fields
     formsubmissions — one filled-out form: answers, signature, photos
     certifications  — a worker's ticket/card with an expiry date

   Files (signature PNGs and job-site photos) live in the existing private
   `job-media` bucket under {company_id}/safety/, so they're isolated per company
   by the same storage policy as job photos. Only the path is stored on the row. */

const SAFETY_FIELD_TYPES = [
  { value: "text", label: "Short text" },
  { value: "choice", label: "Multiple choice" },
  { value: "checkbox", label: "Checkbox" },
  { value: "signature", label: "Signature" },
  { value: "photo", label: "Photo" },
];
const SAFETY_CATEGORIES = ["Hazard Assessment", "Toolbox Talk", "Equipment Inspection", "Incident Report", "Site Orientation"];
const REPEAT_SCHEDULES = [
  { value: "none", label: "No schedule — fill out any time" },
  { value: "daily", label: "Daily — once per worker, per job, per day" },
  { value: "weekly", label: "Weekly — once per worker, per job, per week" },
];

const SAFETY_FOLDER = "safety";
const bmbSafetyFiles = {
  async upload(blob, ext, contentType) {
    const path = CURRENT_COMPANY_ID + "/" + SAFETY_FOLDER + "/" + uuid() + "." + ext;
    const { error } = await supa.storage.from(MEDIA_BUCKET).upload(path, blob, { contentType, upsert: false });
    if (error) throw error;
    return path;
  },
  signedUrl: (path, expires = 3600) => bmbMedia.signedUrl(path, expires),
};

const blobToDataUrl = blob => new Promise(res => {
  const r = new FileReader();
  r.onload = () => res(r.result);
  r.onerror = () => res(null);
  r.readAsDataURL(blob);
});
const dataUrlToBlob = async dataUrl => (await fetch(dataUrl)).blob();

/* ── Offline submit queue ────────────────────────────────────────────────────
   A crew in a gravel pit has no signal, and a safety form they filled out is not
   allowed to evaporate. So EVERY submission takes the same path: it's written to
   this localStorage queue first (status "pending"), then pushed to the server as
   soon as there's a connection — on submit, when the browser fires `online`, and
   on a slow timer in between.

   The row id is generated here, client-side, and reused on every retry. That's
   what makes a retry safe: if a push actually landed but the response never came
   back, the retry hits the primary key and Postgres returns 23505 (duplicate),
   which we treat as "already synced" rather than writing a second copy.

   Photos and signatures ride along as data URLs (already downscaled) and are
   uploaded to storage during the flush, before the row is inserted. Each upload
   is written back into the queue as it succeeds, so a flush interrupted halfway
   doesn't re-upload the files it already got through. */
const SAFETY_QUEUE_KEY = "bmb_safety_queue";
const SAFETY_QUEUE_MAX_BYTES = 4 * 1024 * 1024; // localStorage is ~5 MB in most browsers

const safetyListeners = new Set();
function notifySafetyQueue() { safetyListeners.forEach(fn => { try { fn(); } catch (e) {} }); }
function readSafetyQueue() { try { return JSON.parse(storage.get(SAFETY_QUEUE_KEY) || "[]"); } catch (e) { return []; } }
function writeSafetyQueue(q) {
  const ok = storage.set(SAFETY_QUEUE_KEY, JSON.stringify(q));
  notifySafetyQueue();
  return ok;
}
// The pending submissions for THIS company — what the UI shows as "not synced yet".
function pendingSubmissions() { return readSafetyQueue().filter(i => i.companyId === CURRENT_COMPANY_ID); }

// Re-renders a component whenever the queue changes (submit, sync, retry).
function useSafetyQueue() {
  const [, setV] = useState(0);
  useEffect(() => {
    const fn = () => setV(x => x + 1);
    safetyListeners.add(fn);
    return () => safetyListeners.delete(fn);
  }, []);
  return pendingSubmissions();
}

// Queue a submission and try to push it right away. Returns { queued, synced }.
async function submitSafetyForm({ data, files }) {
  const item = {
    id: uuid(),
    companyId: CURRENT_COMPANY_ID,
    queuedAt: new Date().toISOString(),
    data: { ...data, syncStatus: "pending" },
    files: (files || []).map(f => ({ ...f })),
  };
  const q = readSafetyQueue().concat([item]);
  if (JSON.stringify(q).length > SAFETY_QUEUE_MAX_BYTES) {
    throw new Error("There are too many un-synced forms stored on this device. Get back in range so they can upload, then try again.");
  }
  if (!writeSafetyQueue(q)) throw new Error("Couldn't save this form on the device. Free up some storage and try again.");
  await flushSafetyQueue();
  return { queued: true, synced: !readSafetyQueue().some(x => x.id === item.id) };
}

let safetyFlushing = false;
async function flushSafetyQueue() {
  if (safetyFlushing || !CURRENT_COMPANY_ID) return;
  if (navigator.onLine === false) return;
  const queued = readSafetyQueue().filter(i => i.companyId === CURRENT_COMPANY_ID);
  if (!queued.length) return;
  safetyFlushing = true;
  try {
    for (const item of queued) {
      try {
        // 1. Upload any file that hasn't made it to storage yet, recording each
        //    path back into the queue so a later retry doesn't upload it twice.
        for (const f of item.files || []) {
          if (f.path) continue;
          const blob = await dataUrlToBlob(f.dataUrl);
          f.path = await bmbSafetyFiles.upload(blob, f.ext || "jpg", f.mime || "image/jpeg");
          f.dataUrl = ""; // uploaded — drop the heavy copy from local storage
          writeSafetyQueue(readSafetyQueue().map(x => (x.id === item.id ? item : x)));
        }
        // 2. Insert the row under its client-generated id.
        const sig = (item.files || []).find(f => f.kind === "signature");
        const data = {
          ...item.data,
          signaturePath: sig ? sig.path : "",
          photoPaths: (item.files || []).filter(f => f.kind === "photo").map(f => f.path).filter(Boolean),
          syncStatus: "synced",
          syncedAt: new Date().toISOString(),
        };
        const { error } = await supa.from("records").insert({ id: item.id, company_id: item.companyId, collection: "formsubmissions", data });
        if (error && error.code !== "23505") throw error; // 23505 → a previous try already landed it
        writeSafetyQueue(readSafetyQueue().filter(x => x.id !== item.id));
        if (!(store.formsubmissions || []).some(r => r._id === item.id)) {
          const now = new Date().toISOString();
          store.formsubmissions.unshift({ ...data, _id: item.id, _createdDate: item.queuedAt || now, _updatedDate: now });
        }
        notifyData();
      } catch (e) {
        // Still offline, or the upload failed — leave everything queued and stop;
        // the next online event or timer tick picks up where this left off. The
        // reason is kept on the item: retrying forever in silence is fine when
        // it's just no signal, but a server that keeps REFUSING the row has to
        // be visible to somebody rather than looking like a slow upload.
        const why = (e && (e.message || e.error_description)) || String(e);
        console.warn("Safety form still pending sync:", why);
        writeSafetyQueue(readSafetyQueue().map(x => (x.id === item.id
          ? { ...x, attempts: (x.attempts || 0) + 1, lastError: why, lastTriedAt: new Date().toISOString() }
          : x)));
        break;
      }
    }
  } finally {
    safetyFlushing = false;
    notifySafetyQueue();
  }
}

// Keeps the queue draining for as long as the app is open.
function startSafetySync() {
  if (window.__bmbSafetySync) return;
  window.__bmbSafetySync = true;
  window.addEventListener("online", () => { flushSafetyQueue(); });
  setInterval(() => { flushSafetyQueue(); }, 45000);
  flushSafetyQueue();
}

/* ── Certifications ────────────────────────────────────────────────────────── */
const CERT_WARN_DAYS = 30; // "expiring soon" window

function certState(cert) {
  const exp = (cert && cert.expiryDate) || "";
  if (!exp) return { state: "none", days: null };
  const days = Math.round((new Date(exp + "T00:00:00") - new Date(today() + "T00:00:00")) / 86400000);
  if (days < 0) return { state: "expired", days };
  if (days <= CERT_WARN_DAYS) return { state: "expiring", days };
  return { state: "valid", days };
}
// Everything expired or inside the warning window, soonest first — the list the
// admin dashboard flags on sign-in.
function certAlerts() {
  return getCol("certifications")
    .map(c => ({ cert: c, ...certState(c) }))
    .filter(x => x.state === "expired" || x.state === "expiring")
    .sort((a, b) => a.days - b.days);
}
function workersWithExpiredCerts() {
  const names = new Set();
  getCol("certifications").forEach(c => {
    if (certState(c).state === "expired") names.add(String(c.workerName || "").trim());
  });
  return names;
}

/* ── Templates ─────────────────────────────────────────────────────────────── */
// An empty assignedJobs list means "every job" — the common case.
const templateAppliesToJob = (t, jobId) =>
  !Array.isArray(t.assignedJobs) || t.assignedJobs.length === 0 || t.assignedJobs.includes(jobId);

// Which repeat window a timestamp falls in. Two submissions share a key when the
// schedule considers them the same round ("already done today" / "…this week").
function schedulePeriodKey(schedule, iso) {
  const d = iso ? new Date(iso) : new Date();
  if (schedule === "daily") return dateStr(d);
  if (schedule === "weekly") {
    const monday = new Date(d);
    monday.setDate(monday.getDate() - ((monday.getDay() + 6) % 7));
    return "W" + dateStr(monday);
  }
  return ""; // no schedule → never counts as already done
}

// Has this worker already filed this form for this job in the current window?
function submissionDoneThisPeriod(template, jobId, workerName, extraPending) {
  if (!template.repeatSchedule || template.repeatSchedule === "none") return null;
  const key = schedulePeriodKey(template.repeatSchedule);
  const all = getCol("formsubmissions").concat((extraPending || []).map(p => p.data));
  return all.find(s =>
    s.templateId === template._id &&
    s.jobId === jobId &&
    s.workerName === workerName &&
    schedulePeriodKey(template.repeatSchedule, s.submittedAt) === key
  ) || null;
}

/* ─── Shared helpers ─────────────────────────────────────────────────────── */
function fmt(n, currency = "CAD") {
  const val = Number(n);
  return new Intl.NumberFormat("en-CA", {
    style: "currency", currency: currency || "CAD", minimumFractionDigits: 2,
  }).format(Number.isFinite(val) ? val : 0);
}

function num(v, fallback = 0) {
  const n = parseFloat(v);
  return Number.isFinite(n) ? n : fallback;
}

// Local calendar date as YYYY-MM-DD. toISOString() would return the UTC day,
// which is wrong for anyone west of Greenwich in the evening.
function dateStr(d = new Date()) {
  const pad = n => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
}
function today() { return dateStr(); }

function downloadFile(filename, content, mime) {
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function toCSV(rows) {
  // Prefix BOM so Excel reads UTF-8 correctly; escape embedded quotes.
  return "﻿" + rows
    .map(r => r.map(c => '"' + String(c === undefined || c === null ? "" : c).replace(/"/g, '""') + '"').join(","))
    .join("\r\n");
}

function hoursBetween(start, end) {
  if (!start || !end) return 0;
  const [sh, sm] = start.split(":").map(Number);
  const [eh, em] = end.split(":").map(Number);
  if (![sh, sm, eh, em].every(Number.isFinite)) return 0;
  return Math.max(0, (eh * 60 + em - sh * 60 - sm) / 60);
}

// The job work someone logged on a given day — shown alongside a shift-edit
// request as corroborating evidence ("you logged work on X until 5:47pm") so
// both the employee and the approver have something more concrete than memory.
function dayWorkContext(employeeName, entryDate) {
  return getCol("timeentries").filter(e => e.employeeName === employeeName && e.entryDate === entryDate && e.source !== "mobile-clock");
}

// Decimal hours → "h.mm" clock-style string, where the part after the dot is
// MINUTES, not a fraction. e.g. 2.75 h (2 h 45 m) → "2.45". This is a display
// convenience for crews; payroll/reports keep true decimal hours.
function hmm(hoursDecimal) {
  let h = Math.floor(num(hoursDecimal));
  let m = Math.round((num(hoursDecimal) - h) * 60);
  if (m === 60) { h += 1; m = 0; }
  return h + "." + String(m).padStart(2, "0");
}

// Efficiency = job-logged work hours ÷ clocked (shift) hours. Work entries are
// timeentries; the legacy mobile-clock envelope entries are excluded so they
// don't double-count as work. Returns { clocked, logged, pct|null }.
function loggedHoursFor(entries) {
  return entries.filter(e => e.source !== "mobile-clock").reduce((t, e) => t + num(e.hoursWorked), 0);
}
function efficiencyStats(shiftRows, workRows) {
  const clocked = shiftRows.reduce((t, s) => t + num(s.hours), 0);
  const logged = loggedHoursFor(workRows);
  return { clocked, logged, pct: clocked > 0 ? Math.round((logged / clocked) * 100) : null };
}

/* ─── Workspace configuration (per-company customization) ──────────────────
   BuildMyBill ships written for construction, but every company reshapes it to
   their own trade in the guided setup (Settings → Workspace setup). Their
   answers live in the company's `settings` row and are applied here, at the UI
   layer only:
     · relabel()        — rewrites app copy: "Job" → "Work Order", "Client" → "Customer"
     · workflowStages() — the stage list a job moves through
     · moduleEnabled()  — which sections this company has at all
   Records are never rewritten, so a company can change its wording or turn a
   section back on later without touching a single row of their data. */

// The words the stock UI is written in — each one is replaceable per company.
