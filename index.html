// Watches GPS while mounted (i.e. while the Track tab is open) and reports
// whether the phone is currently within range of the shop. Watches whether
// clocked in or not — arrival matters when off the clock (prompt to check in),
// departure matters when on the clock (prompt to check out). Foreground-only —
// stops the moment the tab is switched away from (component unmount); phones
// don't let a web app watch location in the background.
function useNearShop(company, enabled) {
  const [near, setNear] = useState(false);
  useEffect(() => {
    if (!enabled || company?.shopLat == null || company?.shopLng == null || !navigator.geolocation) { setNear(false); return; }
    const id = navigator.geolocation.watchPosition(
      pos => setNear(distanceMeters(pos.coords.latitude, pos.coords.longitude, company.shopLat, company.shopLng) <= (num(company.geofenceRadiusM) || 300)),
      () => {},
      { enableHighAccuracy: true, maximumAge: 15000, timeout: 20000 }
    );
    return () => navigator.geolocation.clearWatch(id);
  }, [enabled, company?.shopLat, company?.shopLng, company?.geofenceRadiusM]);
  return near;
}

// A real phone notification (via the service worker, which mobile browsers
// require) rather than just an in-app banner — best-effort only: it can only
// fire while this tab/app is actually open, since phones don't allow a web
// app to run or be woken up in the background.
async function showLocalNotification(title, body, tag) {
  if (!("Notification" in window) || Notification.permission !== "granted") return;
  try {
    const reg = navigator.serviceWorker && await navigator.serviceWorker.getRegistration();
    if (reg) { reg.showNotification(title, { body, tag, renotify: true, icon: "icon-192.png", badge: "icon-192.png" }); return; }
    new Notification(title, { body, tag });
  } catch (e) { /* some mobile browsers restrict the Notification constructor without a SW — best effort */ }
}

// Reactive wrapper around the browser's notification permission, since
// Notification.permission itself isn't observable.
function useNotifyPermission() {
  const [perm, setPerm] = useState(() => ("Notification" in window ? Notification.permission : "unsupported"));
  const request = async () => {
    if (!("Notification" in window)) return;
    setPerm(await Notification.requestPermission());
  };
  return [perm, request];
}

function MobileTimeClock({ onLogWork }) {
  const { user } = useAuth();
  const { company } = useCompany();
  useDataVersion();
  const employeeOptions = useEmployeeOptions();
  const canManage = user?.isOwner || user?.role === "Manager";
  const canLogWork = canAccess("daily-log", user);

  const [employee, setEmployee] = useState(user?.name || employeeOptions[0] || "Me");
  const [active, setActive] = useState(() => { try { return JSON.parse(storage.get(ACTIVE_CLOCK_KEY) || "null"); } catch (e) { return null; } });
  const [nowTs, setNowTs] = useState(Date.now());
  const [busy, setBusy] = useState(false);
  const [alertDismissed, setAlertDismissed] = useState(false);
  const [checkOutDismissed, setCheckOutDismissed] = useState(false);
  const [notifyPerm, requestNotify] = useNotifyPermission();
  const nearShop = useNearShop(company, true);
  useEffect(() => { if (!nearShop) setAlertDismissed(false); }, [nearShop]);

  // Remembers "were they near the shop at some point while clocked in" so a
  // later departure can be recognized as *leaving the shop*, not just "not
  // currently at the shop" (which would be true nearly all day, every day).
  const [wasNearShop, setWasNearShop] = useState(false);
  useEffect(() => {
    if (active && nearShop) setWasNearShop(true);
    if (!active) setWasNearShop(false);
  }, [active, nearShop]);
  const leavingShop = active && wasNearShop && !nearShop;
  useEffect(() => { if (!leavingShop) setCheckOutDismissed(false); }, [leavingShop]);

  // Real phone notifications alongside the in-app banners below — best effort,
  // only fires while the app is actually open (see useNearShop).
  useEffect(() => {
    if (!active && nearShop && !alertDismissed) showLocalNotification("BuildMyBill", "You're near the shop — want to clock in?", "bmb-clock-in");
  }, [nearShop]);
  useEffect(() => {
    if (leavingShop && !checkOutDismissed) showLocalNotification("BuildMyBill", "Leaving the shop — want to clock out?", "bmb-clock-out");
  }, [leavingShop]);

  useEffect(() => {
    if (!active) return;
    const id = setInterval(() => setNowTs(Date.now()), 1000);
    return () => clearInterval(id);
  }, [active]);

  // While clocked in, drop a location ping every so often so owners/managers can
  // see a live trail. Stops the instant the tab closes or they clock out — never
  // runs in the background (see useNearShop above for why: phones don't allow it).
  useEffect(() => {
    if (!active || !active.clockRecordId) return;
    const ping = async () => {
      const coords = await getGeoCoords();
      if (coords) db.create("locationpings", { employeeName: active.employee, clockRecordId: active.clockRecordId, lat: coords.lat, lng: coords.lng, at: new Date().toISOString() });
    };
    const id = setInterval(ping, 90000);
    return () => clearInterval(id);
  }, [active?.clockRecordId]);

  const persist = v => { setActive(v); if (v) storage.set(ACTIVE_CLOCK_KEY, JSON.stringify(v)); else storage.remove(ACTIVE_CLOCK_KEY); };

  const clockIn = async () => {
    // A server-visible "I'm on the clock" record, so owners/managers can see who's
    // active from any device — separate from the shift record, which is only
    // written on clock-out.
    const rec = db.create("activeclocks", { employeeName: employee, startISO: new Date().toISOString() });
    const v = { employee, startISO: rec.startISO, geoIn: null, clockRecordId: rec._id };
    persist(v);
    const coords = await getGeoCoords();
    if (coords) {
      persist({ ...v, geoIn: latLngStr(coords.lat, coords.lng) });
      db.create("locationpings", { employeeName: employee, clockRecordId: rec._id, lat: coords.lat, lng: coords.lng, at: new Date().toISOString() });
    }
  };

  const clockOut = async () => {
    if (!active) return;
    setBusy(true);
    const start = new Date(active.startISO);
    const end = new Date();
    const geoOut = await getGeo();
    db.create("shifts", {
      employeeName: active.employee, entryDate: dateStr(start),
      clockInAt: active.startISO, clockOutAt: end.toISOString(),
      startTime: timeHM(start), endTime: timeHM(end),
      hours: Math.round((end - start) / 3600000 * 100) / 100,
      clockInLocation: active.geoIn || "", clockOutLocation: geoOut || "",
      // Keeps the link to this shift's location pings so the route can still be
      // viewed on Crew Locations after clock-out (only the "currently active"
      // marker goes away — the trail itself is kept).
      clockRecordId: active.clockRecordId || "",
    });
    if (active.clockRecordId) db.remove("activeclocks", active.clockRecordId);
    notifyData();
    persist(null);
    setBusy(false);
  };

  const t = today();
  const myShifts = getCol("shifts").filter(s => s.entryDate === t && s.employeeName === employee);
  const myWork = getCol("timeentries").filter(e => e.entryDate === t && e.employeeName === employee && e.source !== "mobile-clock");
  const runningMs = active ? (nowTs - new Date(active.startISO)) : 0;
  const clockedToday = myShifts.reduce((a, s) => a + num(s.hours), 0) + runningMs / 3600000;
  const loggedToday = loggedHoursFor(myWork);
  const effToday = clockedToday > 0 ? Math.round((loggedToday / clockedToday) * 100) : null;

  return (
    <div>
      {employeeOptions.length > 1 && !active && (
        <div style={{ marginBottom: 12 }}>
          <label style={{ fontSize: 12, color: C.textMuted, fontWeight: 600 }}>Logging time for</label>
          <select value={employee} onChange={e => setEmployee(e.target.value)} style={{ ...mInput, marginTop: 4 }}>
            {employeeOptions.map(n => <option key={n} value={n}>{n}</option>)}
          </select>
        </div>
      )}

      {notifyPerm === "default" && company?.shopLat != null && (
        <div style={{ display: "flex", alignItems: "center", gap: 10, background: C.surfaceAlt, border: "1px solid " + C.border, borderRadius: 12, padding: "12px 12px 12px 14px", marginBottom: 14 }}>
          <div style={{ fontSize: 20 }}>🔔</div>
          <div style={{ flex: 1, minWidth: 0, fontSize: 13, fontWeight: 600 }}>Get a phone alert to check in/out near the shop</div>
          <button type="button" onClick={requestNotify} style={{ ...btnOutline, whiteSpace: "nowrap", padding: "8px 12px", fontSize: 12 }}>Enable</button>
        </div>
      )}

      {!active && nearShop && !alertDismissed && (
        <div style={{ display: "flex", alignItems: "center", gap: 10, background: "#0F172A", color: "#fff", borderRadius: 12, padding: "12px 12px 12px 14px", marginBottom: 14 }}>
          <div style={{ fontSize: 22 }}>📍</div>
          <div style={{ flex: 1, minWidth: 0 }}>
            <div style={{ fontWeight: 800, fontSize: 14 }}>You're near the shop</div>
            <div style={{ fontSize: 12, opacity: .65 }}>Clock in now?</div>
          </div>
          <button type="button" onClick={clockIn} style={{ background: C.secondary, color: "#fff", border: "none", borderRadius: 8, padding: "9px 14px", fontWeight: 700, fontSize: 13, cursor: "pointer" }}>Clock In</button>
          <button type="button" onClick={() => setAlertDismissed(true)} aria-label="Dismiss" style={{ background: "none", border: "none", color: "#fff", opacity: .5, fontSize: 20, cursor: "pointer", lineHeight: 1 }}>×</button>
        </div>
      )}

      {leavingShop && !checkOutDismissed && (
        <div style={{ display: "flex", alignItems: "center", gap: 10, background: "#0F172A", color: "#fff", borderRadius: 12, padding: "12px 12px 12px 14px", marginBottom: 14 }}>
          <div style={{ fontSize: 22 }}>📍</div>
          <div style={{ flex: 1, minWidth: 0 }}>
            <div style={{ fontWeight: 800, fontSize: 14 }}>Leaving the shop</div>
            <div style={{ fontSize: 12, opacity: .65 }}>Clock out now?</div>
          </div>
          <button type="button" disabled={busy} onClick={clockOut} style={{ background: "#DC2626", color: "#fff", border: "none", borderRadius: 8, padding: "9px 14px", fontWeight: 700, fontSize: 13, cursor: "pointer", opacity: busy ? .7 : 1 }}>Clock Out</button>
          <button type="button" onClick={() => setCheckOutDismissed(true)} aria-label="Dismiss" style={{ background: "none", border: "none", color: "#fff", opacity: .5, fontSize: 20, cursor: "pointer", lineHeight: 1 }}>×</button>
        </div>
      )}

      <div style={{ ...mCard, textAlign: "center", padding: "26px 16px", background: active ? "#0F172A" : C.surface, color: active ? "#fff" : C.text, border: active ? "none" : mCard.border }}>
        {active ? (
          <>
            <div style={{ fontSize: 11, letterSpacing: 1.5, textTransform: "uppercase", opacity: .55 }}>● On the clock</div>
            <div style={{ fontSize: 46, fontWeight: 900, fontVariantNumeric: "tabular-nums", margin: "6px 0 2px" }}>{fmtDur(runningMs)}</div>
            <div style={{ fontSize: 12, opacity: .55, marginTop: 3 }}>Since {timeHM(new Date(active.startISO))}{active.geoIn ? " · 📍 location saved" : ""}</div>
            <button type="button" disabled={busy} onClick={clockOut} style={{ ...mBtn, background: "#DC2626", color: "#fff", marginTop: 20, opacity: busy ? .7 : 1 }}>{busy ? "Saving…" : "■  Clock Out"}</button>
          </>
        ) : (
          <>
            <div style={{ fontSize: 40, marginBottom: 4 }}>⏱️</div>
            <div style={{ fontSize: 15, color: C.textMuted, marginBottom: 18 }}>You're not clocked in</div>
            <button type="button" onClick={clockIn} style={{ ...mBtn, background: C.secondary, color: "#fff" }}>▶  Clock In</button>
          </>
        )}
      </div>

      {/* Today: clocked envelope vs job time logged inside it, with efficiency. */}
      <div style={{ ...mCard, padding: "14px 16px" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 14 }}>
          <EffBadge pct={effToday} size={56} />
          <div style={{ flex: 1 }}>
            <div style={{ fontSize: 12, color: C.textMuted, fontWeight: 600, marginBottom: 2 }}>Today</div>
            <div style={{ display: "flex", gap: 18 }}>
              <div><div style={{ fontSize: 20, fontWeight: 900 }}>{hmm(clockedToday)}</div><div style={{ fontSize: 11, color: C.textMuted }}>clocked</div></div>
              <div><div style={{ fontSize: 20, fontWeight: 900, color: C.accent }}>{hmm(loggedToday)}</div><div style={{ fontSize: 11, color: C.textMuted }}>logged</div></div>
            </div>
          </div>
        </div>
        {canLogWork && <button type="button" onClick={onLogWork} style={{ ...mBtn, background: C.surfaceAlt, color: C.text, marginTop: 14, fontSize: 15, border: "1px solid " + C.border }}>＋ Log work on a job</button>}
      </div>

      {myWork.length > 0 && (
        <div>
          <div style={{ fontSize: 13, fontWeight: 700, margin: "10px 2px 8px" }}>Work logged today</div>
          {myWork.map(e => (
            <div key={e._id} style={{ ...mCard, display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8, padding: 14 }}>
              <div style={{ minWidth: 0 }}>
                <div style={{ fontWeight: 700, fontSize: 14, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{e.jobName || "No job"}</div>
                <div style={{ fontSize: 12, color: C.textMuted }}>{e.startTime || "?"}–{e.endTime || "?"}</div>
              </div>
              <div style={{ fontWeight: 800, color: C.accent, whiteSpace: "nowrap", marginLeft: 10 }}>{hmm(num(e.hoursWorked))}</div>
            </div>
          ))}
        </div>
      )}

      {myShifts.length > 0 && (
        <div style={{ fontSize: 12, color: C.textMuted, margin: "4px 2px 10px" }}>
          Shifts today: {myShifts.map(s => (s.startTime || "?") + "–" + (s.endTime || "?")).join(", ")}
        </div>
      )}

      {canManage && <MobileTeamEfficiency />}
    </div>
  );
}

// 📝 Quick daily log — one entry at a time, thumb-friendly.
// The in-progress entry is saved to a draft (so switching tabs never loses it),
// and photos/videos can be attached straight to the picked job.
const DL_DRAFT_KEY = "bmb_dl_draft";
const emptyDraft = {
  job: "", jobId: "", work: "", start: "", end: "", notes: "", maintenance: false, maintUnit: "", maintMileage: "", maintHours: "",
  hauling: false, loads: [], siteId: "", siteName: "", siteClient: "",
  equipmentUse: false, equipRows: [],
};
const emptyLoadRow = () => ({ id: genId(), truck: "", yards: "", ticketNumber: "" });
const emptyEquipRow = () => ({ id: genId(), equipment: "", hours: "" });
// How far (m) a dropped pin can be from a saved local site and still count as a match.
const SITE_RADIUS_M = 800;
// Edit (or delete) an already-logged "timeentries" record from the "Logged
// today" list — mirrors TimeEntryEditForm's fields but as a mobile sheet.
// Fields not shown here (maintUnit, siteId, source, etc.) are preserved
// since `form` starts as a full copy of the entry.
function MobileEditLogSheet({ entry, jobs, onSave, onDelete, onClose }) {
  const [form, setForm] = useState({ ...entry });
  const set = (k, v) => setForm(p => ({ ...p, [k]: v }));
  const hrs = hoursBetween(form.startTime, form.endTime);
  const save = () => onSave({ ...form, hoursWorked: hrs });
  return (
    <MobileSheet title="Edit Entry" onClose={onClose}>
      <div style={{ padding: 16 }}>
        <label style={mLbl}>Job</label>
        <select value={form.jobName || ""} onChange={e => set("jobName", e.target.value)} style={mInput}>
          <option value="">No specific job</option>
          {jobsByClient(jobs).map(j => <option key={j._id} value={j.jobTitle}>{jobLabel(j)}</option>)}
        </select>
        <div style={{ display: "flex", gap: 10 }}>
          <div style={{ flex: 1 }}><label style={mLbl}>Start</label><input type="time" value={form.startTime || ""} onChange={e => set("startTime", e.target.value)} style={mInput} /></div>
          <div style={{ flex: 1 }}><label style={mLbl}>End</label><input type="time" value={form.endTime || ""} onChange={e => set("endTime", e.target.value)} style={mInput} /></div>
        </div>
        <div style={{ fontSize: 12, color: C.textMuted, marginTop: 4 }}>{hrs.toFixed(2)} h</div>
        <label style={mLbl}>Work Done</label>
        <input value={form.workDescription || ""} onChange={e => set("workDescription", e.target.value)} placeholder="Excavation…" style={mInput} />
        <label style={mLbl}>Notes</label>
        <input value={form.notes || ""} onChange={e => set("notes", e.target.value)} placeholder="Additional notes…" style={mInput} />
        <div style={{ display: "flex", gap: 10, marginTop: 14 }}>
          <button type="button" onClick={onClose} style={{ ...btnOutline, flex: 1 }}>Cancel</button>
          <button type="button" onClick={save} style={{ ...mBtn, flex: 1, background: C.secondary, color: "#fff", padding: "12px" }}>Save</button>
        </div>
        <button type="button" onClick={() => onDelete(form)} style={{ ...btnDanger, width: "100%", marginTop: 10, padding: "10px" }}>Delete entry</button>
      </div>
    </MobileSheet>
  );
}

function MobileDailyLog() {
  const { user } = useAuth();
  useDataVersion();
  const jobs = getCol("jobs");
  const equipment = getCol("equipment");
  const employee = user?.name || "Me";
  const [draft, setDraft] = useState(() => {
    try { const d = JSON.parse(storage.get(DL_DRAFT_KEY) || "null"); return d && typeof d === "object" ? { ...emptyDraft, ...d } : { ...emptyDraft }; }
    catch (e) { return { ...emptyDraft }; }
  });
  const [msg, setMsg] = useState("");
  const [busy, setBusy] = useState(false);
  const [siteSearching, setSiteSearching] = useState(false);
  const [siteResults, setSiteResults] = useState(null);
  const [editingEntry, setEditingEntry] = useState(null);
  const fileRef = useRef(null);
  // Persist the draft on every change so a tab switch (or reload) keeps it.
  useEffect(() => { storage.set(DL_DRAFT_KEY, JSON.stringify(draft)); }, [draft]);
  const set = (k, v) => setDraft(d => ({ ...d, [k]: v }));
  const pickJob = title => {
    const j = jobs.find(x => x.jobTitle === title);
    setDraft(d => ({ ...d, job: title, jobId: j ? j._id : "", siteId: "", siteName: "", siteClient: "" }));
  };

  const hrs = hoursBetween(draft.start, draft.end);

  const setLoadRow = (id, k, v) => setDraft(d => ({ ...d, loads: d.loads.map(r => (r.id === id ? { ...r, [k]: v } : r)) }));
  const addLoadRow = () => setDraft(d => ({ ...d, loads: [...d.loads, emptyLoadRow()] }));
  const removeLoadRow = id => setDraft(d => ({ ...d, loads: d.loads.filter(r => r.id !== id) }));

  const setEquipRow = (id, k, v) => setDraft(d => ({ ...d, equipRows: d.equipRows.map(r => (r.id === id ? { ...r, [k]: v } : r)) }));
  const addEquipRow = () => setDraft(d => ({ ...d, equipRows: [...d.equipRows, emptyEquipRow()] }));
  const removeEquipRow = id => setDraft(d => ({ ...d, equipRows: d.equipRows.filter(r => r.id !== id) }));

  const findNearbySites = async () => {
    setSiteSearching(true);
    const geo = await getGeo();
    setSiteSearching(false);
    if (!geo) { setMsg("Couldn't get your location — allow location access and try again."); return; }
    const [lat, lng] = geo.split(",").map(s => +s.trim());
    const nearby = getCol("sites")
      .filter(s => s.siteLat != null && s.siteLng != null)
      .map(s => ({ ...s, dist: distanceMeters(lat, lng, s.siteLat, s.siteLng) }))
      .filter(s => s.dist <= SITE_RADIUS_M)
      .sort((a, b) => a.dist - b.dist);
    setSiteResults(nearby);
  };
  const pickSite = s => {
    setDraft(d => ({ ...d, job: s.siteName, jobId: "", siteId: s._id, siteName: s.siteName, siteClient: s.clientName || "" }));
    setSiteResults(null);
  };

  const save = () => {
    if (draft.maintenance && !draft.maintUnit.trim()) { setMsg("Pick or enter the equipment unit for the maintenance."); return; }
    const validLoads = draft.hauling ? draft.loads.filter(r => r.truck && (r.yards || r.ticketNumber)) : [];
    const validEquip = draft.equipmentUse ? draft.equipRows.filter(r => r.equipment && num(r.hours) > 0) : [];
    if (!draft.job && !draft.work.trim() && !draft.maintenance && validLoads.length === 0 && validEquip.length === 0) { setMsg("Pick a job or describe the work first."); return; }
    db.create("timeentries", {
      employeeName: employee, jobName: draft.job, entryDate: today(),
      startTime: draft.start, endTime: draft.end, hoursWorked: hrs,
      workDescription: draft.work, notes: draft.notes,
      equipmentUsed: draft.maintenance ? draft.maintUnit : "", mileageDriven: draft.maintenance ? num(draft.maintMileage) : 0,
      isMaintenance: !!draft.maintenance, maintUnit: draft.maintUnit, maintMileage: draft.maintMileage, maintHours: draft.maintHours,
      siteId: draft.siteId, siteName: draft.siteName, siteClient: draft.siteClient,
      source: "mobile-log",
    });
    // Push the latest mileage/hours reading onto the matching equipment record,
    // so each machine keeps its running totals up to date.
    if (draft.maintenance && draft.maintUnit && (draft.maintHours || draft.maintMileage)) {
      const eq = getCol("equipment").find(e => (e.equipmentName || "").trim() === draft.maintUnit.trim());
      if (eq) {
        const patch = { ...eq, lastServiceDate: today() };
        if (draft.maintHours) patch.totalHours = num(draft.maintHours);
        if (draft.maintMileage) patch.currentMileage = num(draft.maintMileage);
        db.update("equipment", patch);
      }
    }
    // One record per load — keeps yards/ticket numbers billable and exportable individually.
    validLoads.forEach(r => {
      db.create("loads", {
        employeeName: employee, entryDate: today(), jobId: draft.jobId, jobName: draft.job,
        truck: r.truck, yards: num(r.yards), ticketNumber: r.ticketNumber,
        source: "mobile-log",
      });
    });
    // Bills each piece of equipment at its rate and rolls the hours onto its total.
    validEquip.forEach(r => {
      logEquipmentUsage({ equipmentName: r.equipment, hours: r.hours, employeeName: employee, entryDate: today(), jobId: draft.jobId, jobName: draft.job, source: "mobile-log" });
    });
    notifyData();
    setDraft({ ...emptyDraft }); storage.remove(DL_DRAFT_KEY);
    setSiteResults(null);
    setMsg("Saved ✓");
    setTimeout(() => setMsg(""), 2500);
  };
  const clearDraft = () => { setDraft({ ...emptyDraft }); storage.remove(DL_DRAFT_KEY); setMsg(""); setSiteResults(null); };

  const saveEditedEntry = record => { db.update("timeentries", record); notifyData(); setEditingEntry(null); };
  const deleteEditedEntry = async record => {
    if (!(await confirmDialog("Delete this entry?"))) return;
    db.remove("timeentries", record._id); notifyData(); setEditingEntry(null);
  };

  const onFiles = async (fileList) => {
    const files = Array.from(fileList || []);
    if (!files.length) return;
    if (!draft.jobId) { window.alert("Pick a registered job first, then photos/videos attach to it."); return; }
    setBusy(true);
    let ok = 0;
    for (const f of files) { try { await bmbMedia.upload(draft.jobId, f, user); ok++; } catch (e) { window.alert("Couldn't upload " + f.name + ":\n" + (e.message || e)); } }
    setBusy(false);
    notifyData();
    if (ok) setMsg(ok + " file" + (ok > 1 ? "s" : "") + " added to job ✓");
    if (fileRef.current) fileRef.current.value = "";
  };

  const mine = getCol("timeentries").filter(e => e.entryDate === today() && e.employeeName === employee && e.source !== "mobile-clock");
  const myLoads = getCol("loads").filter(l => l.entryDate === today() && l.employeeName === employee);
  const myEquipment = getCol("equipmentlogs").filter(l => l.entryDate === today() && l.employeeName === employee);
  const jobMediaCount = draft.jobId ? getCol("job_media").filter(m => m.jobId === draft.jobId).length : 0;

  return (
    <div>
      <div style={mCard}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline" }}>
          <div style={{ fontWeight: 800, fontSize: 15, marginBottom: 4 }}>Log today's work</div>
          {(draft.job || draft.work || draft.start || draft.notes || draft.maintenance || draft.hauling || draft.equipmentUse) && <button type="button" onClick={clearDraft} style={{ background: "none", border: "none", color: C.textMuted, fontSize: 12, cursor: "pointer" }}>Clear</button>}
        </div>
        <div style={{ fontSize: 12, color: C.textMuted, marginBottom: 6 }}>{new Date().toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" })}</div>
        <label style={mLbl}>Job</label>
        <select value={draft.job} onChange={e => pickJob(e.target.value)} style={mInput}>
          <option value="">No specific job</option>
          {jobsByClient(jobs).map(j => <option key={j._id} value={j.jobTitle}>{jobLabel(j)}</option>)}
        </select>
        {draft.siteId && <div style={{ fontSize: 12, color: C.secondary, fontWeight: 700, marginTop: 4 }}>🧭 Site: {draft.siteName}{draft.siteClient ? " — " + draft.siteClient : ""}</div>}
        <button type="button" onClick={findNearbySites} disabled={siteSearching} style={{ ...mBtn, background: C.surfaceAlt, color: C.text, border: "1px solid " + C.border, marginTop: 8, padding: "10px", fontSize: 13 }}>
          {siteSearching ? "Finding nearby sites…" : "🧭 Find nearby site"}
        </button>
        {siteResults && (
          <div style={{ background: C.surfaceAlt, borderRadius: 10, padding: 10, marginTop: 8 }}>
            {siteResults.length === 0
              ? <div style={{ fontSize: 12, color: C.textMuted, textAlign: "center", padding: "6px 0" }}>No billable sites nearby.</div>
              : siteResults.map(s => (
                <button key={s._id} type="button" onClick={() => pickSite(s)} style={{ display: "block", width: "100%", textAlign: "left", background: C.surface, border: "1px solid " + C.border, borderRadius: 8, padding: "9px 12px", marginBottom: 6, cursor: "pointer" }}>
                  <div style={{ fontWeight: 700, fontSize: 13 }}>{s.siteName}{s.clientName ? " — " + s.clientName : ""}</div>

// 📅 Schedule — jobs grouped by when, as tappable cards with a map link.
// 📅 Schedule — the same month calendar as the desktop page, sized for a thumb.
// Seven columns of ~46px can't hold a job title, so a square carries the date
// and a count; tapping it lists that day in full underneath.
function MobileSchedule() {
  useDataVersion();
  const t = today();
  const [cursor, setCursor] = useState(() => new Date());
  const [sel, setSel] = useState(t);

  const dated = getCol("jobs").filter(j => j.startDate);
  const jobs = jobsByClient(dated.filter(j => !jobIsDone(j)));
  const spans = spanMap(jobs, t);

  const year = cursor.getFullYear();
  const month = cursor.getMonth();
  const cells = monthGrid(year, month);

  // Moving months moves the selection with it, so the list underneath always
  // belongs to the calendar above it. Landing on the current month re-picks
  // today rather than the 1st.
  const jump = d => {
    const c = new Date(year, month + d, 1);
    setCursor(c);
    const first = dateStr(c);
    setSel(first.slice(0, 7) === t.slice(0, 7) ? t : first);
  };

  const navBtn = { background: C.surface, border: "1px solid " + C.border, borderRadius: 10, width: 38, height: 38, fontSize: 17, fontWeight: 800, color: C.text, cursor: "pointer" };

  return (
    <div>
      <div style={{ ...mCard, padding: 12 }}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8, marginBottom: 10 }}>
          <button type="button" onClick={() => jump(-1)} aria-label="Previous month" style={navBtn}>‹</button>
          <div style={{ textAlign: "center", minWidth: 0 }}>
            <div style={{ fontWeight: 800, fontSize: 15, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{monthLabel(cursor)}</div>
            <button type="button" onClick={() => { setCursor(new Date()); setSel(t); }}
              style={{ background: "none", border: "none", color: C.accent, fontSize: 12, fontWeight: 700, padding: "2px 0 0", cursor: "pointer" }}>Today</button>
          </div>
          <button type="button" onClick={() => jump(1)} aria-label="Next month" style={navBtn}>›</button>
        </div>

        <div style={{ display: "grid", gridTemplateColumns: "repeat(7, minmax(0, 1fr))", gap: 3 }}>
          {WEEKDAYS.map(d => (
            <div key={d} style={{ textAlign: "center", fontSize: 10, fontWeight: 800, color: C.textMuted, paddingBottom: 4 }}>{d.slice(0, 2)}</div>
          ))}
          {cells.map(({ date, inMonth }) => {
            const ds = dateStr(date);
            const dayJobs = jobsOnDay(jobs, spans, ds);
            const n = dayJobs.length;
            const carry = dayJobs.some(j => isCarryDay(spans, j._id, ds));
            const isToday = ds === t;
            const picked = ds === sel;
            return (
              <button
                key={ds}
                type="button"
                onClick={() => setSel(ds)}
                style={{
                  height: 46, borderRadius: 10, padding: 0, cursor: "pointer",
                  display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 2,
                  background: picked ? C.secondary : isToday ? "#EEF2FF" : C.surface,
                  border: picked ? "2px solid " + C.secondary : isToday ? "2px solid " + C.accent : "1px solid " + C.border,
                  opacity: inMonth ? 1 : 0.4,
                }}
              >
                <span style={{ fontSize: 13, fontWeight: picked || isToday ? 800 : 600, color: picked ? "#fff" : isToday ? C.accent : C.text, lineHeight: 1 }}>{date.getDate()}</span>
                {/* The empty span keeps every square the same shape on days with nothing on them. */}
                {n > 0
                  ? <span style={{ fontSize: 9, fontWeight: 800, lineHeight: 1, color: "#fff", background: picked ? "rgba(255,255,255,0.35)" : carry ? "#D97706" : C.secondary, borderRadius: 99, padding: "2px 5px", minWidth: 14 }}>{n}</span>
                  : <span style={{ height: 13 }} />}
              </button>
            );
          })}
        </div>
      </div>

      <div style={{ fontSize: 12, fontWeight: 800, textTransform: "uppercase", letterSpacing: .6, color: sel === t ? C.secondary : C.textMuted, margin: "10px 2px 8px" }}>
        {sel === t ? "Today · " : ""}{longDay(sel)}
      </div>
      <ScheduleDayList dayStr={sel} jobs={jobsOnDay(jobs, spans, sel)} spans={spans} />

      {dated.length === 0
        ? <div style={{ ...mCard, textAlign: "center", padding: "20px 18px", color: C.textMuted, fontSize: 13 }}>No scheduled jobs yet. Jobs with a start date show up here.</div>
        : <div style={{ fontSize: 11.5, color: C.textMuted, textAlign: "center", padding: "4px 8px 2px" }}>Completed jobs are hidden. Unfinished ones carry over to today (↻).</div>}
    </div>
  );
}

// 📷 Photos — pick a job, then view / capture photos (reuses the gallery).
function MobilePhotos() {
  useDataVersion();
  const jobs = jobsByClient(getCol("jobs"));
  // Persist the open job: if iOS reloads the app while the camera is open
  // (memory pressure on big landscape shots), we return to the same job.
  const [jobId, setJobIdState] = useState(() => storage.get("bmb_photos_job") || null);
  const setJobId = v => { setJobIdState(v); if (v) storage.set("bmb_photos_job", v); else storage.remove("bmb_photos_job"); };
  const job = jobs.find(j => j._id === jobId);

  if (job) {
    return (
      <div>
        <button type="button" onClick={() => setJobId(null)} style={{ background: "none", border: "none", color: C.accent, fontWeight: 700, fontSize: 14, cursor: "pointer", marginBottom: 8, padding: 0 }}>‹ All jobs</button>
        <div style={{ fontWeight: 800, fontSize: 17, marginBottom: 10 }}>{job.jobTitle}</div>
        <div style={mCard}><JobMediaGallery job={job} /></div>
        <div style={mCard}><JobDocsList job={job} /></div>
      </div>
    );
  }

  if (jobs.length === 0) return <div style={{ ...mCard, textAlign: "center", padding: "30px 18px", color: C.textMuted }}>No jobs yet — create one to add photos.</div>;

  return (
    <div>
      <div style={{ fontSize: 13, color: C.textMuted, margin: "2px 2px 10px" }}>Pick a job to view or add photos & videos.</div>
      {jobs.map(j => {
        const count = getCol("job_media").filter(m => m.jobId === j._id).length;
        return (
          <button key={j._id} type="button" onClick={() => setJobId(j._id)} style={{ ...mCard, width: "100%", textAlign: "left", cursor: "pointer", display: "flex", justifyContent: "space-between", alignItems: "center", gap: 10 }}>
            <div style={{ minWidth: 0 }}>
              <div style={{ fontWeight: 700, fontSize: 14, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{j.jobTitle}</div>
              {j.clientName && <div style={{ fontSize: 12, color: C.textMuted }}>{j.clientName}</div>}
            </div>
            <div style={{ fontSize: 13, color: C.textMuted, whiteSpace: "nowrap" }}>{count ? "📷 " + count : "＋"}</div>
          </button>
        );
      })}
    </div>
  );
}

        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          {company?.logoUrl
            ? <img src={company.logoUrl} alt="" style={{ width: 30, height: 30, borderRadius: 8, objectFit: "cover", background: "#fff" }} />
            : <div style={{ width: 30, height: 30, borderRadius: 8, background: C.secondary, display: "flex", alignItems: "center", justifyContent: "center", fontWeight: 900, fontSize: 15 }}>{(company?.companyName || "B").slice(0, 1).toUpperCase()}</div>}
          <div>
            <div style={{ fontSize: 15, fontWeight: 800, lineHeight: 1.1 }}>{title}</div>
            <div style={{ fontSize: 11, opacity: .6 }}>{company?.companyName || "BuildMyBill"}</div>
          </div>
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <div style={{ fontSize: 12, opacity: .8, maxWidth: 96, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{user?.name}</div>
          <button type="button" onClick={() => setCmdOpen(true)} aria-label="Quick Command"
            style={{ flexShrink: 0, width: 38, height: 38, borderRadius: 12, border: "none", background: "rgba(255,255,255,0.16)", color: "#fff", fontSize: 19, cursor: "pointer" }}>⚡</button>
        </div>
      </div>
      <div className="mmain">
        <MobileInstallBanner />
        {tab === "track" && (can("time-entry") ? <MobileTimeClock onLogWork={() => setTab("log")} /> : <MobileLocked />)}
        {tab === "log" && (can("daily-log") ? <MobileDailyLog /> : <MobileLocked />)}
        {tab === "schedule" && (can("schedule") ? <MobileSchedule /> : <MobileLocked />)}
        {tab === "photos" && (can("jobs") ? <MobilePhotos /> : <MobileLocked />)}
        {tab === "safety" && (can("safety") ? <MobileSafety /> : <MobileLocked />)}
        {tab === "more" && <MobileMore onQuickCommand={() => setCmdOpen(true)} />}
      </div>
      <div className="mtabbar">
        {TABS.map(t => (
          <button key={t.id} type="button" className={"mtab" + (tab === t.id ? " active" : "")} onClick={() => setTab(t.id)}>
            <span className="ico">{t.icon}</span>{relabel(t.label)}
          </button>
        ))}
      </div>
      {cmdOpen && <QuickCommand onClose={() => setCmdOpen(false)} />}
    </div>
  );
}

function AppShell() {
  const { page, navigate } = useRouter();
  const { user, isAuthenticated, pending, noAccess, ready, dataReady } = useAuth();
  const { company } = useCompany();
  const [menuOpen, setMenuOpen] = useState(false);
  const [cmdOpen, setCmdOpen] = useQuickCommand();
  const dataVersion = useDataVersion();
  const isMobile = useIsMobile();

  useEffect(() => { setMenuOpen(false); }, [page]);
  // Drain any safety forms that were filled out with no signal. Starts once the
  // company is known (CURRENT_COMPANY_ID is set during bootstrap) and then keeps
  // itself going for the life of the tab.
  useEffect(() => { if (dataReady) startSafetySync(); }, [dataReady]);

  if (!ready) return <FullScreenLoader label="Starting BuildMyBill…" />;
  if (!isAuthenticated) return <LoginPage />;
  if (noAccess) return <NoAccessScreen />;
  if (pending) return <PendingScreen />;
  if (!dataReady) return <FullScreenLoader label="Loading your company data…" />;

  // A brand-new company gets the guided setup before anything else. Only the
  // owner ever sees it — everyone else joins a workspace that's already shaped.
  if (user?.isOwner && company && !company.setupComplete) return <SetupGate onDone={() => navigate("dashboard")} />;

  // Phone-first field experience (unless the user chose the full desktop app).
  if (isMobile) return <MobileShell />;

  const allowed = page === "pricing" ? true
    : page === "setup" ? !!user?.isOwner
    : page === "quote-editor" ? canAccess("quotes", user)
    : canAccess(page, user);
  // Two different reasons a page can be closed off: the owner switched the
  // whole section off for the company, or this person wasn't granted it.
  const sectionOff = !allowed && !moduleEnabled(page);
  const render = allowed ? (PAGES[page] || PAGES.dashboard) : null;
  const label = (NAV.find(n => n.id === page) || {}).label || "Dashboard";

  return (
    <div className="app">
      <Sidebar open={menuOpen} onClose={() => setMenuOpen(false)} />
      <div style={{ flex: 1, minWidth: 0, display: "flex", flexDirection: "column" }}>
        <div className="topbar">
          <button type="button" className="tb-menu" onClick={() => setMenuOpen(o => !o)} aria-label="Menu" style={{ background: "rgba(255,255,255,0.12)", border: "none", color: "#fff", fontSize: 18, borderRadius: 8, width: 36, height: 36, cursor: "pointer" }}>☰</button>
          <span className="tb-title" style={{ fontWeight: 700, fontSize: 15 }}>{relabel(label)}</span>
          <button type="button" className="tb-btn" onClick={() => setCmdOpen(true)} title="Type what you want to do (Ctrl+K)" aria-label="Quick Command"
            style={{ marginLeft: "auto", background: "rgba(255,255,255,0.15)", border: "none", color: "#fff", borderRadius: 8, padding: "7px 12px", fontSize: 12.5, fontWeight: 700, cursor: "pointer", whiteSpace: "nowrap", display: "flex", alignItems: "center", gap: 8 }}>
            ⚡<span className="tb-btn-text">&nbsp;Quick Command</span>
            <span className="tb-kbd" style={{ fontSize: 10.5, opacity: 0.7, border: "1px solid rgba(255,255,255,0.35)", borderRadius: 4, padding: "1px 5px" }}>Ctrl K</span>
          </button>
          <button type="button" className="tb-btn" title="Switch to the field app" aria-label="Field view"
            onClick={() => { storage.remove(FORCE_DESKTOP_KEY); storage.set(FORCE_MOBILE_KEY, "1"); window.location.reload(); }}
            style={{ background: "rgba(255,255,255,0.15)", border: "none", color: "#fff", borderRadius: 8, padding: "7px 12px", fontSize: 12.5, fontWeight: 700, cursor: "pointer", whiteSpace: "nowrap" }}>📱<span className="tb-btn-text">&nbsp;Field view</span></button>
        </div>
        {/* key includes dataVersion so a rolled-back background write re-reads the store */}
        <main className="app-main" key={page + ":" + dataVersion}>
          {isIOS() && !isStandalone() && <MobileInstallBanner />}
          {render
            ? render()
            : sectionOff
              ? (
                <EmptyState
                  icon="🧩"
                  title="This section isn't switched on"
                  subtitle={user?.isOwner
                    ? "You turned this section off during setup. Switch it back on and its records return exactly as they were."
                    : "Your company doesn't use this section. Ask your owner if you need it."}
                  action={<button type="button" onClick={() => navigate(user?.isOwner ? "setup" : "dashboard")} style={btnSecondary}>
                    {user?.isOwner ? "Open workspace setup" : "Back to Dashboard"}
                  </button>}
                />
              )
              : (
                <EmptyState
                  icon="🔒"
                  title="You don't have access to this section"
                  subtitle="Your company owner controls which areas you can see. Ask them if you need access."
                  action={<button type="button" onClick={() => navigate("dashboard")} style={btnSecondary}>Back to Dashboard</button>}
                />
              )}
        </main>
      </div>
      {cmdOpen && <QuickCommand onClose={() => setCmdOpen(false)} />}
    </div>
  );
}

/* ─── Error boundary ─────────────────────────────────────────────────────── */
class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { error: null }; }
  static getDerivedStateFromError(error) { return { error }; }
  componentDidCatch(error, info) { console.error("BuildMyBill error:", error, info); }
  render() {
    if (!this.state.error) return this.props.children;
    return (
      <div style={{ padding: 40, fontFamily: "system-ui, sans-serif", maxWidth: 640, margin: "0 auto" }}>
        <h1 style={{ fontSize: 22, fontWeight: 800, marginBottom: 12 }}>Something went wrong</h1>
        <pre style={{ background: "#FEF2F2", color: "#991B1B", padding: 16, borderRadius: 8, whiteSpace: "pre-wrap", fontSize: 13 }}>
          {String(this.state.error)}
        </pre>
        <button type="button" onClick={() => window.location.reload()} style={{ ...btnPrimary, marginTop: 16 }}>Reload App</button>
      </div>
    );
  }
}

function App() {
  return (
    <ErrorBoundary>
      <Router>
        <AuthProvider>
          <CompanyProvider>
            <AppShell />
            <ConfirmHost />
          </CompanyProvider>
        </AuthProvider>
      </Router>
    </ErrorBoundary>
  );
}

  </script>
  <script>
    // Tag the root when launched as an installed app (and specifically on iOS),
    // so CSS can add safe-area / status-bar breathing room only where needed.
    (function () {
      var standalone = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
      var ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
      if (standalone) document.documentElement.classList.add("standalone");
      if (standalone && ios) document.documentElement.classList.add("ios-standalone");
    })();
    // Register the service worker so the app is installable and loads offline.
    // (Network-first inside the worker, so new deploys still show up.)
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("sw.js").catch(function () {});
      });
    }
    // Capture the install prompt (Android/Chrome) so the app can offer a clear
    // "Install" button instead of relying on the easy-to-miss browser prompt.
    window.__bmbInstall = null;
    window.addEventListener("beforeinstallprompt", function (e) {
      e.preventDefault();
      window.__bmbInstall = e;
      window.dispatchEvent(new Event("bmb-installready"));
    });
    window.addEventListener("appinstalled", function () {
      window.__bmbInstall = null;
      window.dispatchEvent(new Event("bmb-installready"));
    });
  </script>
